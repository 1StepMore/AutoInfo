# Regression #326: real-KB generation path must produce non-empty sections
# for the column Deep Dive and the report Sections (not empty shells).
#
# Two blind-spot defects previously let the real path render empty:
#   (a) `_is_test_entry` dropped real Draft/Wiki entries whose DB `summary`
#       column is empty (content lives in the KB markdown file) — leaving the
#       product with zero entries → empty Deep Dive / `**Sections**: 0`.
#   (b) `_normalize_digest_product_context` only derived sections for the
#       "column" family; the "report" family got NO deterministic fallback.
#
# This regression drives generate_digest with the report + column product
# templates using entries that carry empty summaries but a real title + URL
# (the real-KB shape), and asserts sections are derived non-empty.
#
# Deterministic (requires_env: []): KBStore and _call_llm_for_digest are
# patched; the synthesis carries NO "sections", so the deterministic
# derivation must fire (matching the real LLM returning no sections).
name: regression-sections-real-path
description: "Regression #326: column/report products from real-KB-shaped entries render non-empty Deep Dive / Sections"
category: regression
regression: true
regression_issue: "#326"
requires_env: []
steps:
  - name: "column product derives Deep Dive sections from real-KB-shaped entries"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest

      # Real-KB shape: title + source_url present, summary EMPTY (content is
      # in the KB markdown file, not the summary column).
      ENTRIES = [
          {"entry_id": f"e{i}", "title": f"IVF time-lapse imaging study {i}",
           "summary": "",
           "source_url": f"https://pubmed.ncbi.nlm.nih.gov/{10000000 + i}/",
           "source_type": "api", "source_platform": "pubmed",
           "relevance_score": 90.0 - i, "tags": json.dumps(["IVF", "embryo"]),
           "tier": "02-Draft", "collected_at": "2026-07-15T10:00:00Z"}
          for i in range(1, 11)
      ]
      # LLM synthesis returns NO sections (the real failure mode) -> the
      # deterministic derivation must fire.
      SYNTH = {
          "executive_summary": "This week\u2019s column covers ten IVF time-lapse studies.",
          "key_findings": [{"topic": "Time-lapse imaging", "detail": "Improved outcomes."}],
          "trends": ["Time-lapse imaging adoption"],
          "recommendations": ["Consider time-lapse imaging as standard of care."],
      }

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-sections-col-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_digest(domain="medical-research", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("column"))
          assert isinstance(out, str), type(out)
          # Unfiltered real entries must survive -> Deep Dive present, never
          # the empty placeholder.
          assert "## Deep Dive" in out, "missing Deep Dive section"
          assert "_No deep-dive sections available" not in out, \
              "empty placeholder rendered despite real entries"
          subs = [ln for ln in out.splitlines() if ln.startswith("### ")]
          assert len(subs) >= 8, f"expected >=8 derived subsections, got {len(subs)}"
          assert f"**Sections**: {len(subs)}" in out, \
              "Sections metadata does not match derived subsection count"
          print(f"COLUMN_REALPATH_SECTIONS_OK: {len(subs)}")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["COLUMN_REALPATH_SECTIONS_OK"]

  - name: "report product derives non-empty Sections from real-KB-shaped entries"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest

      ENTRIES = [
          {"entry_id": f"e{i}", "title": f"Research finding {i} on time-lapse imaging",
           "summary": "",
           "source_url": f"https://pubmed.ncbi.nlm.nih.gov/{10000000 + i}/",
           "source_type": "api", "source_platform": "pubmed",
           "relevance_score": 90.0 - i, "tags": json.dumps(["IVF"]),
           "tier": "03-Wiki", "collected_at": "2026-07-15T10:00:00Z"}
          for i in range(1, 10)
      ]
      SYNTH = {
          "executive_summary": "This briefing covers nine findings.",
          "key_findings": [{"topic": "Time-lapse", "detail": "Improved outcomes."}],
          "recommendations": ["Adopt time-lapse imaging as standard of care."],
      }

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-sections-rpt-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_digest(domain="medical-research", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("report"))
          assert isinstance(out, str), type(out)
          # The report family must derive sections too (not just column).
          assert "**Sections**:" in out, "Sections metadata missing"
          import re
          m = re.search(r"\*\*Sections\*\*:\s*(\d+)", out)
          assert m, "Sections count not parseable"
          n = int(m.group(1))
          assert n >= 8, f"report Sections empty shell (got {n}):\n{out}"
          print(f"REPORT_REALPATH_SECTIONS_OK: {n}")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["REPORT_REALPATH_SECTIONS_OK"]
