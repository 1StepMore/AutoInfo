# Processing + batch_run — LLM-required operations.  Without
# AUTOINFO_LLM_API_KEY this scenario reports unconfigured (no steps run,
# no state written): the Director User is obligated to provide BYOK keys
# during onboarding.
# check_factual/check_translation explicitly enable the G4/G5 quality gates.
#
# DISPOSABLE-PROJECT ONLY — NOT self-cleaning by design:
# process_collection / batch_run consume cached collections/ and write
# 01-Raw KB entries (Markdown files + SQLite rows + summaries).  Those
# entries carry the real source_url of the collected items — no scenario
# marker exists that could distinguish them from entries created by a
# genuine processing run, so any cleanup attempt would risk deleting real
# user data.  This scenario MUST only be run in a disposable / scratch
# project.  In a clean project it is a no-op ('noop' status — no cached
# items, nothing written).
name: processing
description: "LLM-gated processing, batch run, and G4/G5 quality gates"
category: collection
requires_env: ["AUTOINFO_LLM_API_KEY"]
requires_domain: ["medical-research"]
steps:
  - name: "process_collection with G4/G5 gates"
    tool: process_collection
    arguments:
      domain: medical-research
      batch_size: 1
      check_factual: true
      check_translation: true
    expect:
      success: true
      llm_assert: "Does the response contain a status field — either 'completed' (items were processed), 'noop' (no cached items), or describe a successful batch processing result? The domain is medical-research."

  - name: "batch_run small limit for medical-research"
    tool: batch_run
    arguments:
      domain: medical-research
      limit: 1
    expect:
      success: true
      llm_assert: "Does the response contain a 'phases' array with both 'collection' and 'processing' phase entries, each having a 'status' field?"
