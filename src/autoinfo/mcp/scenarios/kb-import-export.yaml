# KB Import/Export — verify markdown import and JSON/EPUB export of knowledge base entries.
# B23 (2026-08-04): export_kb format="epub" added (no LLM; needs [ebook] extra).
# format="mobi" omitted — calibre ebook-convert absent in validation env; covered by
# tests/output/test_output_ebook.py (mobi missing-calibre error path).
name: kb-import-export
description: "KB import (markdown) and export (JSON, EPUB) in real project context"
category: kb
requires_env: []
steps:
  - name: "import_kb imports markdown entry"
    tool: import_kb
    arguments:
      domain: medical-research
      format: markdown
      data: |
        ---
        source_url: https://example.com/validation-import
        source_type: web
        source_platform: web
        ---
        # Validation Import Entry

        This entry was imported by the kb-import-export validation scenario.
    expect:
      success: true
      data_has: ["domain", "format", "entries_imported"]

  - name: "export_kb exports domain as JSON"
    tool: export_kb
    arguments:
      domain: medical-research
      format: json
    expect:
      success: true

  - name: "export_kb exports domain as EPUB"
    tool: export_kb
    arguments:
      domain: medical-research
      format: epub
    expect:
      success: true
