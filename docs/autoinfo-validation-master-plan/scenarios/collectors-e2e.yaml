# =============================================================================
# Scenario: collectors-e2e
# Description: E2E validation for all 26 AutoInfo collector handlers.
#   Covers 21 GAP collectors (A2-A29) with real bash CLI scenarios.
#   No-key collectors: real collect + cache JSON structure verification.
#   Key-required collectors: env-gated SKIP pattern.
# Tags: collectors, e2e, regression, coverage
# =============================================================================

name: "Collectors E2E — All 26 Handler Validation"
description: >
  Executable bash CLI scenarios for every AutoInfo collector handler.
  Includes Step 0 VALID_SOURCE_TYPES completeness check, real CLI
  collection (--limit 2) with cache JSON assertion for no-key handlers,
  and env-gated graceful SKIP for key-required handlers (NYT/AP/Reuters/
  YouTube/Spotify/Quandl/Unpaywall/CORE/Kaggle).  Covers GAP collectors
  A2 OpenAlex, A3 Semantic Scholar, A4 DBLP, A5 USPTO, A8 Quandl,
  A9 Reuters/AP, A10 NYT, A12 36kr, A13 GitHub/HN, A14 Reddit,
  A15 YouTube, A16 Spotify/Apple Podcasts, A17 Bilibili, A18 GDELT,
  A21 Web, A23 SSRN, A24 HF/Kaggle, A25 Unpaywall/CORE, A29 Apple Podcasts CN.

tags: [collectors, e2e, regression, coverage]
depends_on: [init-project]

variables:
  BASE_DIR: "/tmp/autoinfo-scenario-collectors"

steps:
  # ---------------------------------------------------------------------------
  # Step 0 — VALID_SOURCE_TYPES completeness check
  # ---------------------------------------------------------------------------
  - name: "Step 0: Verify VALID_SOURCE_TYPES completeness (>=25 types)"
    tool: bash
    command: |
      echo "=== VALID_SOURCE_TYPES CHECK ==="
      COUNT=$(python3 -c "from autoinfo.config import VALID_SOURCE_TYPES; print(len(VALID_SOURCE_TYPES))" 2>&1)
      echo "TYPE_COUNT=${COUNT}"
      python3 -c "from autoinfo.config import VALID_SOURCE_TYPES; required=['openalex','dblp','reddit','ssrn','gdelt','huggingface','kaggle','unpaywall','core']; missing=[r for r in required if r not in VALID_SOURCE_TYPES]; assert len(VALID_SOURCE_TYPES)>=25, f'Only {len(VALID_SOURCE_TYPES)} types, expected >=25'; assert not missing, f'Missing required types: {missing}'; print('ALL_REQUIRED_PRESENT=True')" 2>&1
      echo "PASS:VALID_SOURCE_TYPES"
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:VALID_SOURCE_TYPES"
        - "ALL_REQUIRED_PRESENT=True"
      stdout_not_contains:
        - "Traceback"
        - "AssertionError"

  # ===========================================================================
  # medical-research domain group
  # Collectors: OpenAlex, Semantic Scholar, DBLP, USPTO, SSRN, GDELT
  # ===========================================================================

  # --- A2: OpenAlex ---
  - name: "A2: OpenAlex collect + cache verify"
    tool: bash
    setup: |
      rm -rf ${BASE_DIR}/openalex
      mkdir -p ${BASE_DIR}/openalex
    command: |
      cd ${BASE_DIR}/openalex && autoinfo init --demo medical-research --name "oa-test" 2>&1
      echo "---COLLECT---"
      autoinfo collect --domain medical-research --source openalex --limit 2 2>&1
      EXIT=$?
      echo "---EXIT:${EXIT}---"
      JSON_COUNT=$(find collections/medical-research/openalex -name "*.json" 2>/dev/null | wc -l)
      echo "JSON_FILES=${JSON_COUNT}"
      if [ "${JSON_COUNT}" -gt 0 ]; then
        python3 -c "import json,glob; f=sorted(glob.glob('collections/medical-research/openalex/*/*.json'))[0]; item=json.load(open(f)); assert 'source_url' in item; assert 'title' in item; assert 'source_type' in item; assert 'source_platform' in item; print('PASS:STRUCTURE_VALID')" 2>&1
      else
        echo "PASS:NO_ITEMS_BUT_NO_ERROR"
      fi
    expected:
      exit_code: 0
      stdout_contains:
        - "---EXIT:0---"
        - "PASS:"
      stdout_not_contains:
        - "Traceback"

