# Local fast-feedback lint layer (gaps C3 + C4).
#
# Install once with: pre-commit install
# (pre-commit >= 3.7 is in the dev extra; `pre-commit install` writes the
# hook scripts into .git/hooks — solving the empty-hooks problem for new
# clones, since the hook samples are not copied by git clone).
#
# This is the LOCAL fast-feedback layer only: CI runs ruff and mypy directly
# in ci.yml (changed-files ruff + mypy gates) so the pre-commit hooks here
# are a convenience, not the enforcement point. Keep the two in sync —
# anything added below should also be covered by the CI gates.

repos:
  # Ruff rev mirrors the pyproject.toml pin (ruff==0.17.1) so the local hook
  # and the CI gate lint with the same rule set; bump both in the same change.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      - id: debug-statements
      - id: check-merge-conflict

  # Secret scanning — blocks commits containing API keys / tokens / credentials.
  # Uses gitleaks (Go binary, downloaded on first run). Covers ghp_/gho_/
  # github_pat_, sk-, AIza, AKIA, eyJ, long hex/base64, and 150+ other rules.
  # Keep in sync with CI: the `lint` job in .github/workflows/ci.yml runs the
  # same pinned gitleaks release over the PR/push commit range.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Lightweight fallback — catches credential URLs even if gitleaks is skipped.
  # Runs a local grep for token-in-URL forms and ghp_/github_pat_ prefixes.
  - repo: local
    hooks:
      - id: no-credential-url
        name: no-credential-url (block token-in-URL)
        entry: 'bash -c ''git diff --cached --diff-filter=ACM --name-only | xargs grep -nE "https://[^/]*@github\.com|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}" 2>/dev/null && echo "ERROR: staged files contain credential URL or GitHub PAT" && exit 1 || exit 0'''
        language: system
        always_run: false
        pass_filenames: false

      # Left-shifts the CI doc-count gates (Drift Guard + DriftGuard test) to
      # commit time: `scripts/doc_inventory.py --check` fails in CI whenever a
      # change adds a tool/test/doc without regenerating README counts and
      # docs/dev/doc-inventory.md — catching it here is a 13s local check
      # instead of a ~10-min round-trip. Whole-repo state, not per-file, so it
      # runs unconditionally. The env probe keeps it from false-blocking on
      # machines where autoinfo is not importable: --check exits 1 for an
      # environment mismatch exactly like real drift, so without the probe the
      # hook would fail everywhere the editable install is missing. CI's
      # Drift Guard remains the enforcement point for those machines.
      - id: doc-inventory-check
        name: doc-inventory-check (README counts + doc-inventory.md freshness)
        entry: 'bash -c ''PY=.venv/Scripts/python.exe; [ -x "$PY" ] || PY=.venv/bin/python; [ -x "$PY" ] || PY=python3; if ! "$PY" -c "import autoinfo" 2>/dev/null; then echo "doc-inventory-check: SKIPPED (autoinfo not importable — environment mismatch, not doc drift; CI Drift Guard still enforces)"; exit 0; fi; "$PY" scripts/doc_inventory.py --check'''
        language: system
        always_run: true
        pass_filenames: false
