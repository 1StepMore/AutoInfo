  # ===========================================================================
  - name: "Delivery channel health validation (get_channel_health — all 11 channels)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Get health for all channels
      r = app.call_tool("get_channel_health", {})
      data = json.loads(r.content[0].text)
      assert isinstance(data, list), f"Expected list, got {type(data)}"
      print(f"PASS:CHANNEL-HEALTH-ALL count={len(data)}")

      # Verify all 11 expected channels
      expected_channels = {
          "smtp", "webhook", "rest_api", "file_export",
          "discord", "telegram", "wechat_oa", "wechat_work",
          "dingtalk", "feishu", "rss",
      }
      found_channels = set()
      for entry in data:
          ch = entry.get("channel", "")
          if ch:
              found_channels.add(ch)
          # Each entry should have healthy, latency_ms, channel keys
          assert "healthy" in entry, f"Missing healthy in {ch}"
          assert "channel" in entry, f"Missing channel: {entry}"
          print(f"  CHANNEL: {ch:20s} healthy={entry.get('healthy')} latency={entry.get('latency_ms', 0)}ms")

      print(f"PASS:CHANNEL-FOUND-COUNT {len(found_channels)}/{len(expected_channels)}")
      # Verify at minimum the known channels are present
      missing = expected_channels - found_channels
      if missing:
          print(f"WARN:CHANNEL-MISSING {missing}")
      else:
          print("PASS:ALL-CHANNELS-PRESENT")

      # Get health for a single channel
      r = app.call_tool("get_channel_health", {
          "channel_name": "webhook",
      })
      data = json.loads(r.content[0].text)
      assert isinstance(data, list) and len(data) == 1, f"Expected single result: {data}"
      assert data[0].get("channel") == "webhook", f"Expected webhook: {data[0]}"
      print(f"PASS:CHANNEL-SINGLE channel={data[0].get('channel')} healthy={data[0].get('healthy')}")

      # Get health for unknown channel
      r = app.call_tool("get_channel_health", {
          "channel_name": "nonexistent_channel_xyz",
      })
      data = json.loads(r.content[0].text)
      assert isinstance(data, list), f"Expected list: {data}"
      if len(data) > 0:
          assert data[0].get("healthy") == False, f"Expected unhealthy for unknown: {data[0]}"
      print("PASS:CHANNEL-UNKNOWN-HANDLED")

      print("PASS:MCP-CHANNEL-HEALTH-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:CHANNEL-HEALTH-ALL"
        - "PASS:CHANNEL-FOUND-COUNT"
        - "PASS:CHANNEL-SINGLE"
        - "PASS:CHANNEL-UNKNOWN-HANDLED"
        - "PASS:MCP-CHANNEL-HEALTH-COMPLETE"

