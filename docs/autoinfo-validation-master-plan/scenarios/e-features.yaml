# =============================================================================
# Scenario: e-features
# Description: Verify E-dimension features — E2 Stripe, E9 source_score,
#              E10 ToS compliance, E11 RAW variants, E12 single-article
#              payment, E14 simplify_content.
# Tags: e-dimension, stripe, source-score, tos, raw-variants, payment, simplify
#
# Code evidence per feature:
#   E9  src/autoinfo/quality.py:41-46    SOURCE_TIER_SCORE_MAP
#   E9  src/autoinfo/quality.py:245-253  G1SourceAuthority source_score resolve
#   E9  src/autoinfo/models.py:186       KBEntry.source_score: float = 0.0
#   E10 src/autoinfo/quality.py:305-474  G1TosCompliance class
#   E10 src/autoinfo/quality.py:328-333  _TIER_TOS_MAP
#   E10 src/autoinfo/quality.py:1794-1890 D2FormatIntegrity.tos_delivery_check
#   E11 src/autoinfo/models.py:102-118   Product dataclass (variants field)
#   E11 src/autoinfo/mcp/server.py:4165  RAW product: variants=["api_feed","webhook","bulk_export"]
#   E12 src/autoinfo/billing.py:227-318  create_checkout_session (mode="payment")
#   E12 src/autoinfo/billing.py:649-708  check_access (article_id fast path)
#   E12 src/autoinfo/consumption.py:351-430 grant_article_access + check_article_access
#   E2  src/autoinfo/api/server.py:412-469 stripe_webhook + signature verify
#   E2  src/autoinfo/billing.py:321-435  handle_webhook lifecycle
#   E14 src/autoinfo/output/__init__.py:5207-5369 simplify_text function
#   E14 src/autoinfo/mcp/server.py:5382-5406 _handle_simplify_content
#   E14 src/autoinfo/mcp/server.py:9548  simplify_content in LLM_REQUIRED_TOOLS
# =============================================================================

name: "E-Dimension Features Validation"
description: >
  Validates E-dimension features: E9 source credibility scoring
  (SOURCE_TIER_SCORE_MAP, G1 integration), E10 ToS compliance
  (G1TosCompliance, D2FormatIntegrity.tos_delivery_check),
  E11 RAW product variants (api_feed/webhook/bulk_export),
  E12 single-article payment (create_checkout_session mode=payment,
  check_access article_id fast path), E2 Stripe lifecycle
  (webhook signature verification, checkout), and E14 content
  simplification (simplify_text with CEFR targeting, MCP tool
  simplify_content). All tests use real internal API; Stripe
  and LLM steps are env-gated with SKIP.

tags: [e-dimension, stripe, source-score, tos, raw-variants, payment, simplify, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-e-features"
  DOMAIN: "medical-research"

steps:
  # ===========================================================================
  # E9 — Source Credibility Score (source_score)
  # ===========================================================================
  # Code: src/autoinfo/quality.py:41-46 SOURCE_TIER_SCORE_MAP
  #       src/autoinfo/quality.py:245-253 G1SourceAuthority.score_map → source_score
  #       src/autoinfo/models.py:186 KBEntry.source_score
  # ===========================================================================

  - name: "E9: SOURCE_TIER_SCORE_MAP constants — tier1=90, tier2=70, tier3=50, tier4=30"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import SOURCE_TIER_SCORE_MAP

      assert 1 in SOURCE_TIER_SCORE_MAP, "tier 1 missing"
      assert 2 in SOURCE_TIER_SCORE_MAP, "tier 2 missing"
      assert 3 in SOURCE_TIER_SCORE_MAP, "tier 3 missing"
      assert 4 in SOURCE_TIER_SCORE_MAP, "tier 4 missing"

      s1 = SOURCE_TIER_SCORE_MAP[1]
      s2 = SOURCE_TIER_SCORE_MAP[2]
      s3 = SOURCE_TIER_SCORE_MAP[3]
      s4 = SOURCE_TIER_SCORE_MAP[4]

      assert 0 <= s1 <= 100, f"tier1 out of range: {s1}"
      assert 0 <= s2 <= 100, f"tier2 out of range: {s2}"
      assert 0 <= s3 <= 100, f"tier3 out of range: {s3}"
      assert 0 <= s4 <= 100, f"tier4 out of range: {s4}"

      assert s1 > s2 > s3 > s4, (
          f"tier score order violated: {s1} > {s2} > {s3} > {s4}"
      )
      print(f"PASS: SOURCE_TIER_SCORE_MAP={SOURCE_TIER_SCORE_MAP}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: SOURCE_TIER_SCORE_MAP="

  - name: "E9: G1SourceAuthority embeds source_score in details for all tiers"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1SourceAuthority, SOURCE_TIER_SCORE_MAP
      from autoinfo.models import Item

      gate = G1SourceAuthority()

      for tier in [1, 2, 3, 4]:
          item = Item(
              id=f"e9-tier{tier}",
              source_name=f"source-tier{tier}",
              title="Test",
              content="test",
              collected_at="2026-01-01",
              quality_tier=tier,
          )
          result = gate.check(item, {"quality_tier": tier})
          details = result.details

          assert "source_score" in details, (
              f"tier {tier}: source_score missing from details"
          )
          score = float(details["source_score"])
          expected = SOURCE_TIER_SCORE_MAP.get(tier, 30.0)
          assert score == expected, (
              f"tier {tier}: expected source_score={expected}, got {score}"
          )
          assert 0 <= score <= 100, f"tier {tier}: score {score} out of 0-100"
      print("PASS: G1SourceAuthority embeds source_score for all tiers")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1SourceAuthority embeds source_score for all tiers"

  - name: "E9: KBEntry model has source_score field (E9 persistence)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.models import KBEntry

      # Verify KBEntry has source_score dataclass field
      entry = KBEntry(
          entry_id="e9-test",
          title="Source Score Test",
          domain="${DOMAIN}",
          source_score=87.5,
      )
      assert hasattr(entry, "source_score"), "KBEntry missing source_score attr"
      assert entry.source_score == 87.5, (
          f"source_score not persisted: {entry.source_score}"
      )
      print(f"PASS: KBEntry.source_score={entry.source_score} (field exists)")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: KBEntry.source_score="

  # ===========================================================================
  # E10 — ToS Compliance (G1TosCompliance, D2FormatIntegrity.tos_delivery_check)
  # ===========================================================================
  # Code: src/autoinfo/quality.py:305-474 G1TosCompliance
  #       src/autoinfo/quality.py:328-333 _TIER_TOS_MAP
  #       src/autoinfo/quality.py:1794-1890 D2FormatIntegrity.tos_delivery_check
  # ===========================================================================

  - name: "E10: Tier→ToS mapping — tier1=open, tier2=licensed, tier3=restricted, tier4=sensitive"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1TosCompliance

      gate = G1TosCompliance()
      assert hasattr(gate, "_TIER_TOS_MAP"), "G1TosCompliance missing _TIER_TOS_MAP"
      tier_tos = gate._TIER_TOS_MAP
      assert tier_tos == {
          1: "open",
          2: "licensed",
          3: "restricted",
          4: "sensitive",
      }, f"Unexpected _TIER_TOS_MAP: {tier_tos}"
      print(f"PASS: _TIER_TOS_MAP={tier_tos}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: _TIER_TOS_MAP="

  - name: "E10: G1TosCompliance — open/licensed pass, restricted/sensitive flagged"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1TosCompliance
      from autoinfo.models import Item

      gate = G1TosCompliance()

      # Open source → passed, not flagged
      item_open = Item(
          id="tos-open", source_name="pubmed", title="T", content="t",
          collected_at="2026-01-01", quality_tier=1,
      )
      r = gate.check(item_open, {"tos_classification": "open", "quality_tier": 1})
      assert r.passed == True, f"open should pass, got passed={r.passed}"
      assert r.flagged == False, f"open should not be flagged, got flagged={r.flagged}"
      assert r.details.get("tos_compliant") == True, f"open should be tos_compliant"
      print("PASS: ToS classification 'open' — passes unflagged")

      # Licensed source → passed, not flagged
      item_lic = Item(
          id="tos-licensed", source_name="ap-api", title="T", content="t",
          collected_at="2026-01-01", quality_tier=2,
      )
      r = gate.check(item_lic, {"tos_classification": "licensed", "quality_tier": 2})
      assert r.passed == True, f"licensed should pass, got passed={r.passed}"
      assert r.flagged == False, f"licensed should not be flagged, got flagged={r.flagged}"
      assert r.details.get("tos_compliant") == True, f"licensed should be tos_compliant"
      print("PASS: ToS classification 'licensed' — passes unflagged")

      # Restricted source → flagged advisory
      item_res = Item(
          id="tos-restricted", source_name="blog", title="T", content="t",
          collected_at="2026-01-01", quality_tier=3,
      )
      r = gate.check(item_res, {"tos_classification": "restricted", "quality_tier": 3})
      assert r.flagged == True, f"restricted should be flagged, got flagged={r.flagged}"
      assert r.details.get("tos_compliant") == False, f"restricted should NOT be tos_compliant"
      assert "compliance_warning" in r.details, "restricted should have compliance_warning"
      assert r.passed == True, "advisory = passes (default action=flag)"
      print("PASS: ToS classification 'restricted' — flagged advisory")

      # Sensitive source → flagged advisory
      item_sens = Item(
          id="tos-sensitive", source_name="private-api", title="T", content="t",
          collected_at="2026-01-01", quality_tier=4,
      )
      r = gate.check(item_sens, {"tos_classification": "sensitive", "quality_tier": 4})
      assert r.flagged == True, f"sensitive should be flagged, got flagged={r.flagged}"
      assert r.details.get("tos_compliant") == False, f"sensitive should NOT be tos_compliant"
      assert "compliance_warning" in r.details, "sensitive should have compliance_warning"
      assert r.passed == True, "advisory = passes (default action=flag)"
      print("PASS: ToS classification 'sensitive' — flagged advisory")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: ToS classification 'open' — passes unflagged"
        - "PASS: ToS classification 'licensed' — passes unflagged"
        - "PASS: ToS classification 'restricted' — flagged advisory"
        - "PASS: ToS classification 'sensitive' — flagged advisory"

  - name: "E10: G1TosCompliance with source_config=None derives ToS from item tier"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1TosCompliance
      from autoinfo.models import Item

      gate = G1TosCompliance()

      # No source_config → derive from item.quality_tier
      item = Item(
          id="tos-derived", source_name="wikipedia", title="T", content="t",
          collected_at="2026-01-01", quality_tier=1,
      )
      r = gate.check(item, source_config=None)
      # tier 1 → "open"
      assert r.details.get("source_tos") == "open", (
          f"tier 1 should derive to 'open', got {r.details.get('source_tos')}"
      )
      assert r.passed == True
      assert r.flagged == False
      print("PASS: ToS derived from item quality_tier=1 → 'open' correctly")

      item4 = Item(
          id="tos-derived4", source_name="scraper", title="T", content="t",
          collected_at="2026-01-01", quality_tier=4,
      )
      r = gate.check(item4, source_config=None)
      # tier 4 → "sensitive"
      assert r.details.get("source_tos") == "sensitive", (
          f"tier 4 should derive to 'sensitive', got {r.details.get('source_tos')}"
      )
      assert r.flagged == True
      print("PASS: ToS derived from item quality_tier=4 → 'sensitive' correctly")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: ToS derived from item quality_tier=1 → 'open' correctly"
        - "PASS: ToS derived from item quality_tier=4 → 'sensitive' correctly"

  - name: "E10: D2FormatIntegrity.tos_delivery_check blocks RAW with restricted sources"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import D2FormatIntegrity

      checker = D2FormatIntegrity()
      assert hasattr(checker, "tos_delivery_check"), "D2FormatIntegrity missing tos_delivery_check"

      # RAW product with restricted entry → blocked
      raw_output = {
          "product_type": "raw",
          "entries": [
              {
                  "entry_id": "e-test-1",
                  "title": "Restricted Source Article",
                  "tos_classification": "restricted",
                  "source_url": "https://example.com/restricted",
              },
          ],
      }
      result = checker.tos_delivery_check(raw_output)
      assert result.passed == False, (
          f"RAW with restricted should be blocked, got passed={result.passed}"
      )
      assert result.details.get("tos_blocked") == True, (
          "RAW restricted entries should set tos_blocked=True"
      )
      print("PASS: D2 RAW product with 'restricted' entry — blocked correctly")

      # PROCESSED product with restricted entry → passes with notice
      processed_output = {
          "product_type": "processed",
          "entries": [
              {
                  "entry_id": "e-test-2",
                  "title": "Processed Restricted",
                  "tos_classification": "restricted",
                  "source_url": "https://example.com/restricted",
              },
          ],
      }
      result2 = checker.tos_delivery_check(processed_output)
      assert result2.passed == True, (
          f"PROCESSED with restricted should pass with notice, got passed={result2.passed}"
      )
      assert result2.details.get("tos_compliance_notice") == True, (
          "PROCESSED should carry tos_compliance_notice=True"
      )
      print("PASS: D2 PROCESSED product with 'restricted' — passes with notice")

      # No restricted entries → all clear
      clean_output = {
          "product_type": "raw",
          "entries": [
              {"entry_id": "e-test-3", "title": "Open Article", "tos_classification": "open"},
          ],
      }
      result3 = checker.tos_delivery_check(clean_output)
      assert result3.passed == True
      assert result3.details.get("tos_blocked") == False
      print("PASS: D2 product with only 'open' entries — passes cleanly")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: D2 RAW product with 'restricted' entry — blocked correctly"
        - "PASS: D2 PROCESSED product with 'restricted' — passes with notice"
        - "PASS: D2 product with only 'open' entries — passes cleanly"

  # ===========================================================================
  # E11 — RAW Product Variants
  # ===========================================================================
  # Code: src/autoinfo/models.py:102-118 Product dataclass
  #       src/autoinfo/mcp/server.py:4165,4216 variants field on RAW
  # ===========================================================================

  - name: "E11: Product dataclass supports variants field (backward-compat)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.models import Product, ProductType

      # Product default — variants is empty list (backward compat: old products without variants don't error)
      p_default = Product(id="test", domain="${DOMAIN}", type=ProductType.RAW)
      assert hasattr(p_default, "variants"), "Product missing variants field"
      assert isinstance(p_default.variants, list), f"variants should be list, got {type(p_default.variants)}"
      assert p_default.variants == [], f"default variants should be [], got {p_default.variants}"
      print("PASS: Product default variants=[] (backward compat — no crash)")

      # Product with explicit variants
      p_explicit = Product(
          id="test2", domain="${DOMAIN}", type=ProductType.RAW,
          variants=["api_feed", "webhook", "bulk_export"],
      )
      assert p_explicit.variants == ["api_feed", "webhook", "bulk_export"], (
          f"variants mismatch: {p_explicit.variants}"
      )
      print("PASS: Product variants=['api_feed','webhook','bulk_export'] stored correctly")

      # to_dict / from_dict round-trip preserves variants
      d = p_explicit.to_dict()
      p_roundtrip = Product.from_dict(d)
      assert p_roundtrip.variants == ["api_feed", "webhook", "bulk_export"], (
          f"round-trip variants lost: {p_roundtrip.variants}"
      )
      print("PASS: Product variants survive to_dict/from_dict round-trip")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: Product default variants=[] (backward compat — no crash)"
        - "PASS: Product variants=['api_feed','webhook','bulk_export'] stored correctly"
        - "PASS: Product variants survive to_dict/from_dict round-trip"

  - name: "E11: MCP list_products returns RAW with variants field"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      r = app.call_tool("list_products", {"domain": "${DOMAIN}"})
      data = json.loads(r.content[0].text)
      products = data if isinstance(data, list) else data.get("products", [])
      assert len(products) >= 1, f"Expected >=1 product, got {len(products)}"

      raw_product = None
      for p in products:
          if p.get("type") == "raw":
              raw_product = p
              break
      assert raw_product is not None, "No RAW product found in list_products"

      variants = raw_product.get("variants")
      assert variants is not None, f"RAW product missing 'variants' key: {raw_product}"
      assert isinstance(variants, list), f"variants should be list: {variants}"
      assert "api_feed" in variants, f"api_feed missing from variants: {variants}"
      assert "webhook" in variants, f"webhook missing from variants: {variants}"
      assert "bulk_export" in variants, f"bulk_export missing from variants: {variants}"
      print(f"PASS: RAW product variants={variants}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: RAW product variants="

  - name: "E11: MCP get_product returns variants for raw products"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      r = app.call_tool("get_product", {"product_id": "${DOMAIN}-raw"})
      data = json.loads(r.content[0].text)
      product = data.get("product", data)

      assert product.get("type") == "raw", f"Expected raw type: {product.get('type')}"
      variants = product.get("variants")
      assert variants is not None, "get_product RAW missing 'variants'"
      assert sorted(variants) == sorted(["api_feed", "webhook", "bulk_export"]), (
          f"variants mismatch: {sorted(variants)}"
      )
      print(f"PASS: get_product({DOMAIN}-raw) variants={variants}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: get_product("

  # ===========================================================================
  # E12 — Single-Article Payment
  # ===========================================================================
  # Code: src/autoinfo/billing.py:227-318 create_checkout_session(mode="payment")
  #       src/autoinfo/billing.py:649-708 check_access(article_id=...)
  #       src/autoinfo/consumption.py:351-430 grant_article_access + check_article_access
  # ===========================================================================

  - name: "E12: create_checkout_session mode='payment' — env-gated (SKIP without STRIPE_API_KEY)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")

      has_key = bool(
          os.environ.get("STRIPE_API_KEY") or os.environ.get("AUTOINFO_STRIPE_KEY")
      )
      if not has_key:
          print("SKIP: E12 create_checkout_session(mode=payment) — no STRIPE_API_KEY set")
          sys.exit(0)

      from autoinfo.billing import create_checkout_session

      result = create_checkout_session(
          product_id="test-article-payment",
          end_user_id="e12-test-user",
          mode="payment",
          article_id="article-e12-001",
      )
      # With mock key the call may fail, but the function should return a dict
      assert isinstance(result, dict), f"Expected dict return, got {type(result)}"
      if "error" in result:
          print(f"SKIP: create_checkout_session returned error (expected with test key): {result.get('error')}")
          sys.exit(0)

      assert "mode" in result, f"Missing 'mode' in: {result}"
      assert result["mode"] == "payment", f"Expected mode=payment, got {result['mode']}"
      print(f"PASS: create_checkout_session(mode=payment) returned: session_id={result.get('session_id')}, mode={result['mode']}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: create_checkout_session"  # when key exists
      stdout_contains_any:
        - "PASS: create_checkout_session"
        - "SKIP: E12 create_checkout_session"
        - "SKIP: create_checkout_session returned error"

  - name: "E12: check_access article_id fast path — grants access for entitled users"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.billing import check_access

      # Test 1: article_id supplied but no user exists → check_access returns
      # dict with clear reason (not entitled → falls through to tier check)
      result = check_access(
          "e12-nonexistent-user",
          access_level="free",
          article_id="nonexistent-article",
      )
      assert isinstance(result, dict), f"check_access should return dict, got {type(result)}"
      assert "allowed" in result, f"check_access missing 'allowed': {result}"
      # With free access_level, should be allowed even without article
      assert result["allowed"] == True, (
          f"free access should be allowed, got: {result}"
      )
      assert result.get("article_id") == "nonexistent-article", (
          f"article_id not propagated: {result}"
      )
      print(f"PASS: check_access free tier with article_id — allowed={result['allowed']}")

      # Test 2: premium access without article entitlement → blocked
      result2 = check_access(
          "e12-non-premium-user",
          access_level="premium",
          article_id="article-e12-001",
      )
      assert isinstance(result2, dict)
      assert result2.get("article_id") == "article-e12-001"
      # Should be blocked (no premium subscription for this user)
      print(f"PASS: check_access premium with article_id — allowed={result2['allowed']}, reason={result2.get('reason')}")

      # Test 3: check_access article_id parameter exists in function signature
      import inspect
      sig = inspect.signature(check_access)
      params = list(sig.parameters.keys())
      assert "article_id" in params, (
          f"check_access missing article_id param: {params}"
      )
      print(f"PASS: check_access signature includes article_id: {params}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: check_access free tier with article_id"
        - "PASS: check_access premium with article_id"
        - "PASS: check_access signature includes article_id"

  - name: "E12: ConsumptionStore.grant_article_access and check_article_access (E12 persistence)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.consumption import ConsumptionStore

      store = ConsumptionStore()
      # Grant access for test user
      result = store.grant_article_access(
          user_id="e12-test-user",
          article_id="article-e12-002",
          payment_intent_id="pi_test_123",
      )
      assert isinstance(result, dict), f"grant_article_access should return dict: {type(result)}"
      assert result.get("reason") in ("granted", "already_entitled"), (
          f"unexpected grant reason: {result}"
      )
      print(f"PASS: grant_article_access → reason={result.get('reason')}")

      # Check access
      has_access = store.check_article_access(
          user_id="e12-test-user",
          article_id="article-e12-002",
      )
      assert has_access == True, (
          f"check_article_access should return True after grant, got {has_access}"
      )
      print("PASS: check_article_access returns True for granted article")

      # Check non-existent article
      no_access = store.check_article_access(
          user_id="e12-test-user",
          article_id="article-never-purchased",
      )
      assert no_access == False, (
          f"check_article_access should return False for unpurchased, got {no_access}"
      )
      print("PASS: check_article_access returns False for unpurchased article")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: grant_article_access"
        - "PASS: check_article_access returns True for granted article"
        - "PASS: check_article_access returns False for unpurchased article"

  # ===========================================================================
  # E2 — Stripe Payment Lifecycle
  # ===========================================================================
  # Code: src/autoinfo/billing.py:227-318 create_checkout_session
  #       src/autoinfo/api/server.py:412-469 stripe_webhook signature verify
  #       src/autoinfo/billing.py:321-435 handle_webhook lifecycle
