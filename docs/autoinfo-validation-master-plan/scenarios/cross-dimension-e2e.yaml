# =============================================================================
# Scenario: cross-dimension-e2e
# Description: Verify full end-to-end cross-dimension user journey spanning
#              Director User (human commander), Direct User (agent executor),
#              and End User (paying customer). Also validates the agent callback
#              subscription pattern for push notifications without polling.
# Tags: e2e, cross-dimension, agent-callback, pipeline, audit, regression
# =============================================================================

name: "Cross-Dimension End-to-End Validation"
description: >
  Validates the full end-to-end user journey across all three dimensions:
  Director User (human) gives natural language instructions → Direct User
  (agent) configures topics, collects from sources, processes with LLM,
  searches KB, generates digest → End User (customer) receives delivered
  product. Also validates the agent callback subscription pattern: register
  callbacks for push notifications (set_agent_callback, list_agent_callbacks,
  remove_agent_callback), eliminating polling. Covers expectations F01-F55.

tags: [e2e, cross-dimension, agent-callback, pipeline, audit, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-e2e"
  DOMAIN: "medical-research"
  TOPIC: "IVF breakthroughs"
  END_USER: "ivf-researcher"
  CALLBACK_URL: "https://test-agent.example.com/callback"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project and create end user (setup all dimensions)
  # -------------------------------------------------------------------------
  - name: "Initialize project with demo domain and create end user"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR}
      autoinfo init --demo ${DOMAIN} --name "e2e-test" 2>&1 > /dev/null
      autoinfo enduser create \
        --user-id ${END_USER} \
        --name "Alice Chen" \
        --email alice@example.com \
        --tier pro 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"
    artifacts:
      - "${TEST_DIR}/.autoinfo/config.yaml"
      - "${TEST_DIR}/.autoinfo/users.db"

  # -------------------------------------------------------------------------
  # Step 2: Agent configures topic — Director→Agent handoff (Dimension 1→2)
  # -------------------------------------------------------------------------
  - name: "Agent configures IVF topic with keywords via MCP"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Director says: "帮我配置IVF研究追踪"
      # Agent: adds topic with keywords
      result = app.call_tool("add_topic", {
          "domain": "${DOMAIN}",
          "name": "${TOPIC}",
          "keywords": ["IVF", "embryo", "implantation", "in vitro fertilization",
                        "endometrial receptivity", "blastocyst"]
      })
      data = json.loads(result.content[0].text)
      print(f"PASS: topic configured — {data.get('name', data.get('status', 'OK'))}")

      # Agent: lists topics to verify
      result2 = app.call_tool("list_topics", {"domain": "${DOMAIN}"})
      data2 = json.loads(result2.content[0].text)
      topics = data2.get("topics", data2.get("items", []))
      topic_names = [t.get("name") for t in topics]
      assert "${TOPIC}" in topic_names, f"Topic not found in {topic_names}"
      print(f"PASS: topic verified — '{${TOPIC}}' found with {len(topics)} total topics")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: topic configured"
        - "PASS: topic verified"

  # -------------------------------------------------------------------------
  # Step 3: Agent collects from PubMed and searches KB (Dimension 2 — Agent)
  # -------------------------------------------------------------------------
  - name: "Agent collects from PubMed, searches KB, generates digest"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Agent: dry-run first
      result = app.call_tool("collect_sources", {
          "domain": "${DOMAIN}",
          "topic": "${TOPIC}",
          "limit": 3,
          "dry_run": True
      })
      data = json.loads(result.content[0].text)
      print(f"PASS: dry-run collection completed")

      # Agent: actual collection
      result2 = app.call_tool("collect_sources", {
          "domain": "${DOMAIN}",
          "topic": "${TOPIC}",
          "limit": 3
      })
      data2 = json.loads(result2.content[0].text)
      items = data2.get("items_collected", data2.get("total_items", 0))
      print(f"PASS: collection completed — {items} items")

      # Agent: search KB and report to Director
      result3 = app.call_tool("search_knowledge_base", {
          "domain": "${DOMAIN}",
          "query": "IVF embryo implantation",
          "mode": "hybrid",
          "limit": 5
      })
      data3 = json.loads(result3.content[0].text)
      results = data3.get("results", data3.get("entries", []))
      print(f"PASS: KB search returned {len(results)} results")

      # Agent: generate digest for End User
      result4 = app.call_tool("generate_digest", {
          "domain": "${DOMAIN}",
          "period": "day",
          "topic": "${TOPIC}",
          "format": "markdown"
      })
      data4 = json.loads(result4.content[0].text)
      digest_id = data4.get("digest_id", data4.get("id", "?"))
      print(f"PASS: digest generated — {digest_id}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: dry-run collection completed"
        - "PASS: collection completed"
        - "PASS: KB search returned"
        - "PASS: digest generated"

  # -------------------------------------------------------------------------
  # Step 4: Pipeline artifact verification — every stage leaves a file
  # -------------------------------------------------------------------------
  - name: "Pipeline stages produce verifiable file artifacts"
    tool: bash
    command: |
      cd ${TEST_DIR}
      ALL_OK=true

      # Stage 1: Collection cache JSON files
      CACHE_COUNT=$(find collections/${DOMAIN} -name "*.json" ! -name "_runs.json" -type f 2>/dev/null | wc -l)
      echo "  Collection cache: $CACHE_COUNT JSON files"
      [ "$CACHE_COUNT" -gt 0 ] && echo "  ✅ PASS: collection cache" || { echo "  ❌ FAIL: no cache files"; ALL_OK=false; }

      # Stage 2: KB 01-Raw markdown entries
      KB_DIR="knowledge/${DOMAIN}/01-Raw"
      KB_COUNT=$(find "$KB_DIR" -name "*.md" -type f 2>/dev/null | wc -l)
      echo "  KB 01-Raw: $KB_COUNT entries"
      # KB entries may be 0 if no processing ran — that's OK for this surface test
      [ "$KB_COUNT" -gt 0 ] && echo "  ✅ PASS: KB entries exist" || echo "  ⚠️  NOTE: No KB entries (process may not have run)"

      # Stage 3: Output/digest files
      DIGEST_DIR="outputs/${DOMAIN}/digest"
      DIGEST_COUNT=$(find "$DIGEST_DIR" -type f 2>/dev/null | wc -l)
      echo "  Digest output: $DIGEST_COUNT files"

      # Stage 4: Pipeline logs
      LOG_COUNT=$(find logs -name "pipeline-*.log" -type f 2>/dev/null | wc -l)
      echo "  Pipeline logs: $LOG_COUNT files"
      [ "$LOG_COUNT" -gt 0 ] && echo "  ✅ PASS: pipeline logs exist" || echo "  ⚠️  NOTE: No pipeline logs"

      # Stage 5: SQLite DB
      if [ -f "autoinfo.db" ]; then
        DB_SIZE=$(stat --format=%s autoinfo.db 2>/dev/null || stat -f%z autoinfo.db 2>/dev/null || echo 0)
        echo "  SQLite DB: $DB_SIZE bytes"
        [ "$DB_SIZE" -gt 0 ] && echo "  ✅ PASS: SQLite DB exists" || { echo "  ❌ FAIL: empty DB"; ALL_OK=false; }
      else
        echo "  ⚠️  NOTE: No autoinfo.db"
      fi

      if [ "$ALL_OK" = true ]; then
        echo "PASS: pipeline artifacts verified"
      else
        echo "FAIL: one or more pipeline stages missing artifacts"
      fi
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: pipeline artifacts verified"

  # -------------------------------------------------------------------------
  # Step 5: Agent callback — register, list, and remove callbacks
  # -------------------------------------------------------------------------
  - name: "Agent callback lifecycle: set → list → remove"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Director says: "当生成摘要时推送到我的webhook，不要再轮询了"
      # Agent: registers callback
      result = app.call_tool("set_agent_callback", {
          "url": "${CALLBACK_URL}",
          "events": ["new_digest", "new_report"],
          "description": "E2E test callback",
          "secret": "whsec_e2e_test"
      })
      data = json.loads(result.content[0].text)
      callback_id = data.get("callback_id", data.get("id", "?"))
      print(f"PASS: callback registered — {callback_id}")

      # Agent: verify via list
      result2 = app.call_tool("list_agent_callbacks", {})
      data2 = json.loads(result2.content[0].text)
      callbacks = data2.get("callbacks", data2.get("items", []))
      found = any(cb.get("url", "") == "${CALLBACK_URL}" for cb in callbacks)
      assert found, f"Callback ${CALLBACK_URL} not found after registration"
      print(f"PASS: callback listed — {len(callbacks)} active callback(s)")

      # Director says: "不需要了，取消回调"
      # Agent: removes callback
      if callback_id and callback_id != "?":
          result3 = app.call_tool("remove_agent_callback", {"callback_id": callback_id})
          data3 = json.loads(result3.content[0].text)
          print(f"PASS: callback removed — {data3}")

          # Verify gone
          result4 = app.call_tool("list_agent_callbacks", {})
          data4 = json.loads(result4.content[0].text)
          remaining = data4.get("callbacks", data4.get("items", []))
          still_present = any(cb.get("url", "") == "${CALLBACK_URL}" for cb in remaining)
          assert not still_present, f"Callback still present after removal"
          print("PASS: callback removal verified — no longer listed")

      print("PASS: agent callback lifecycle complete (register → list → remove)")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: agent callback lifecycle complete"

  # -------------------------------------------------------------------------
  # Step 6: Audit log completeness — pipeline events recorded
  # -------------------------------------------------------------------------
  - name: "Audit log contains pipeline events from collection through delivery"
    tool: bash
    command: |
      cd ${TEST_DIR}
      ALL_OK=true

      # Query audit log for any entries
      AUDIT_OUT=$(autoinfo audit query --json --limit 20 2>&1 || echo '{"entries":[]}')
      TOTAL=$(echo "$AUDIT_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('entries',[])))" 2>/dev/null || echo 0)
      echo "  Audit log entries: $TOTAL"

      if [ "$TOTAL" -gt 0 ]; then
        echo "  ✅ PASS: audit log contains $TOTAL entries"

        # Check action diversity
        echo "$AUDIT_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); entries=d.get('entries',[]); actions=set(e.get('action','?') for e in entries); resources=set(e.get('resource_type','?') for e in entries); print(f'  Actions: {sorted(actions)[:10]}'); print(f'  Resources: {sorted(resources)[:10]}'); pa_list=['collect','process','deliver','topic_add','source_add']; found=set(); [found.add(pa) for a in actions for pa in pa_list if pa in a.lower()]; print(f'  Pipeline stages: {len(found)}: {found}' if len(found)>=2 else f'  Note: only {len(found)} stages')" 2>/dev/null
      else
        echo "  ⚠️  NOTE: Audit log empty — no events recorded yet"
      fi

      # Verify audit infrastructure is importable
      python3 -c "from autoinfo.audit import query_audit_log; print('PASS: audit module importable')" 2>&1

      if [ "$ALL_OK" = true ]; then
        echo "PASS: audit log infrastructure verified"
      fi
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: audit module importable"
        - "PASS: audit log infrastructure verified"

  # -------------------------------------------------------------------------
  # Step 7: End User delivery verification (Dimension 3 — End User)
  # -------------------------------------------------------------------------
  - name: "End User profile and delivery channel verified"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Agent verifies End User profile
      result = app.call_tool("get_end_user", {"user_id": "${END_USER}"})
      data = json.loads(result.content[0].text)
      uid = data.get("user_id", data.get("id", "?"))
      email = data.get("email", "?")
      tier = data.get("tier", "?")
      print(f"PASS: End User profile — {uid} <{email}> tier={tier}")

      # Agent checks delivery preferences
      result2 = app.call_tool("get_preferences", {"user_id": "${END_USER}"})
      data2 = json.loads(result2.content[0].text)
      prefs = data2.get("preferences", data2)
      print(f"PASS: delivery preferences retrieved — keys={list(prefs.keys())[:5] if isinstance(prefs, dict) else '?'}")

      # Agent checks end user history
      result3 = app.call_tool("get_enduser_history", {"user_id": "${END_USER}"})
      data3 = json.loads(result3.content[0].text)
      entries = data3.get("history", data3.get("entries", data3.get("items", [])))
      print(f"PASS: end user history — {len(entries)} entries")

      # Agent checks channel health
      result4 = app.call_tool("get_channel_health", {})
      data4 = json.loads(result4.content[0].text)
      channels = data4.get("channels", data4.get("results", []))
      ch_count = len(channels)
      print(f"PASS: channel health — {ch_count} channels checked")
      assert ch_count > 0, "No channels reported"

      print("PASS: end user delivery infrastructure verified")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: end user delivery infrastructure verified"
