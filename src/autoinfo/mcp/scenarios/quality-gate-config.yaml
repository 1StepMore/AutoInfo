# Quality gate configuration — read, mutate, verify, restore.
# get_gate_config: test error path (gate not configured) and success path (after set).
# set_gate_config: create a test gate, then restore to original (no gate).
name: quality-gate-config
description: "Quality gate config: read, set, verify, restore"
category: quality
requires_env: []
requires_domain: ["medical-research"]
steps:
  - name: "get_gate_config returns GateNotFound for unconfigured gate"
    tool: get_gate_config
    arguments:
      domain: medical-research
      gate: G0
    expect:
      success: false
      error_code: "GateNotFound"

  - name: "set_gate_config creates G0 test gate"
    tool: set_gate_config
    arguments:
      domain: medical-research
      gate: G0
      config:
        category: soft
        action: flag
        retries: 2
        threshold: 0.0
    expect:
      success: true
      data_has: ["domain", "gate", "updated", "config"]

  - name: "get_gate_config verifies G0 is now configured"
    tool: get_gate_config
    arguments:
      domain: medical-research
      gate: G0
    expect:
      success: true
      data_has: ["domain", "gate", "gate_type", "config"]

  - name: "cleanup: remove test G0 gate from domain quality_gates"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"from autoinfo.config import load_config, get_config_path, save_config; cp=get_config_path(); cfg=load_config(cp); [d.quality_gates.pop('G0', None) for d in cfg.domains if d.name=='medical-research']; save_config(cfg, cp); print('GATE_REMOVED')\""
    expect:
      exit_code: 0
      stdout_has: ["GATE_REMOVED"]

  - name: "set_gate_config creates CurationGate quality gate (enabled=False, threshold=35)"
    tool: set_gate_config
    arguments:
      domain: medical-research
      gate: CurationGate
      config:
        enabled: false
        threshold: 35
    expect:
      success: true
      data_has: ["domain", "gate", "updated", "config"]

  - name: "get_gate_config reads CurationGate back as a quality gate"
    tool: get_gate_config
    arguments:
      domain: medical-research
      gate: CurationGate
    expect:
      success: true
      data_has: ["domain", "gate", "gate_type", "config"]

  - name: "CurationGate round-trips through a fresh config load"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"from autoinfo.config import load_config, get_config_path; cp=get_config_path(); cfg=load_config(cp); d=next(x for x in cfg.domains if x.name=='medical-research'); c=d.quality_gates.get('CurationGate'); assert c is not None and c.threshold==35 and c.enabled is False and 'CurationGate' not in d.delivery_gates, 'ROUNDTRIP_FAILED'; print('CURATION_ROUNDTRIP_OK')\""
    expect:
      exit_code: 0
      stdout_has: ["CURATION_ROUNDTRIP_OK"]

  - name: "cleanup: remove test CurationGate from domain quality_gates"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"from autoinfo.config import load_config, get_config_path, save_config; cp=get_config_path(); cfg=load_config(cp); [d.quality_gates.pop('CurationGate', None) for d in cfg.domains if d.name=='medical-research']; save_config(cfg, cp); print('CURATION_REMOVED')\""
    expect:
      exit_code: 0
      stdout_has: ["CURATION_REMOVED"]
