# M5T40 B24 column report_type — generate_report with report_type="column"
# renders via column.md.j2 (product_type derivation, G15 premium row).
# LLM-required (same BYOK obligation as output-ebook): without
# AUTOINFO_LLM_API_KEY this scenario reports unconfigured, never skipped.
name: output-column
description: "B24 — generate_report with report_type column (markdown)"
category: output
requires_env: ["AUTOINFO_LLM_API_KEY"]
requires_domain: ["medical-research"]
steps:
  - name: "generate_report column type markdown"
    tool: generate_report
    arguments:
      domain: medical-research
      format: markdown
      period: monthly
      report_type: column
    expect:
      success: true

  - name: "generate_report column type weekly markdown"
    tool: generate_report
    arguments:
      domain: medical-research
      format: markdown
      period: weekly
      report_type: column
    expect:
      success: true
