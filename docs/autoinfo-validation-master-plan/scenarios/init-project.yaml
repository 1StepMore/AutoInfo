# =============================================================================
# Scenario: init-project
# Description: Verify autoinfo init with various flags
# Tags: init, regression, cli
# =============================================================================

name: "Init Project Validation"
description: >
  Tests autoinfo init across multiple flag combinations: single demo domain,
  multi-demo, custom project name, --list-domains, --no-interactive with TTY,
  --no-interactive without TTY, and idempotent re-init.

tags: [init, regression, cli, project-scaffold]
depends_on: []

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-init"
  DOMAIN: "medical-research"
  DOMAIN2: "ai-commercial"
  PROJECT_NAME: "test-project"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Happy path — single demo domain
  # -------------------------------------------------------------------------
  - name: "Init with single demo domain (medical-research)"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
        - "medical-research"
        - "Next steps"
        - "CREATE"
    artifacts:
      - "${TEST_DIR}/.autoinfo/config.yaml"
      - "${TEST_DIR}/.autoinfo/knowledge"
      - "${TEST_DIR}/.autoinfo/collections"
      - "${TEST_DIR}/.autoinfo/outputs"

  # -------------------------------------------------------------------------
  # Step 2: Idempotent re-init (no overwrite)
  # -------------------------------------------------------------------------
  - name: "Idempotent re-init (should skip existing files)"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "SKIP"
      stdout_not_contains:
        - "ERROR"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: --list-domains flag
  # -------------------------------------------------------------------------
  - name: "List available demo domains"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo init --list-domains 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Available demo domains"
        - "medical-research"
        - "ai-commercial"
        - "financial-intelligence"
        - "tech-ai-developer"
        - "language-learning"

  # -------------------------------------------------------------------------
  # Step 4: Init with custom --name
  # -------------------------------------------------------------------------
  - name: "Init with custom project name"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}-named
      mkdir -p ${TEST_DIR}-named
    command: |
      cd ${TEST_DIR}-named && autoinfo init --demo ${DOMAIN} --name "${PROJECT_NAME}" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
    artifacts:
      - "${TEST_DIR}-named/.autoinfo/config.yaml"
    post_checks:
      - description: "config.yaml contains project name"
        command: |
          grep -q "name: ${PROJECT_NAME}" "${TEST_DIR}-named/.autoinfo/config.yaml" && echo "FOUND" || echo "NOT_FOUND"
        expected_stdout:
          - "FOUND"

  # -------------------------------------------------------------------------
  # Step 5: Multi-demo init (two domains)
  # -------------------------------------------------------------------------
  - name: "Init with multiple demo domains"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}-multi
      mkdir -p ${TEST_DIR}-multi
    command: |
      cd ${TEST_DIR}-multi && autoinfo init --demo ${DOMAIN} --demo ${DOMAIN2} 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
        - "2 domains"
    artifacts:
      - "${TEST_DIR}-multi/.autoinfo/config.yaml"
    post_checks:
      - description: "config.yaml contains both domains"
        command: |
          grep -q "medical-research" "${TEST_DIR}-multi/.autoinfo/config.yaml" && \
          grep -q "ai-commercial" "${TEST_DIR}-multi/.autoinfo/config.yaml" && \
          echo "BOTH_FOUND" || echo "MISSING"
        expected_stdout:
          - "BOTH_FOUND"

  # -------------------------------------------------------------------------
  # Step 6: --no-interactive with TTY (should show tip, not error)
  # -------------------------------------------------------------------------
  - name: "Non-interactive mode with TTY (shows tip)"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}-nointer
      mkdir -p ${TEST_DIR}-nointer
    command: |
      cd ${TEST_DIR}-nointer && autoinfo init --no-interactive 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Tip"
        - "--demo"
      stdout_not_contains:
        - "ERROR"

  # -------------------------------------------------------------------------
  # Step 7: Unknown demo domain (should error)
  # -------------------------------------------------------------------------
  - name: "Init with unknown demo domain"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}-bad
      mkdir -p ${TEST_DIR}-bad
    command: |
      cd ${TEST_DIR}-bad && autoinfo init --demo nonexistent-domain 2>&1
    expected:
      exit_code: 1
      stdout_contains:
        - "unknown demo domain"
        - "nonexistent-domain"

  # -------------------------------------------------------------------------
  # Step 8: Invalid flag raises error
  # -------------------------------------------------------------------------
  - name: "Init with invalid flag"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo init --nonexistent-flag 2>&1
    expected:
      exit_code: 2
      stdout_contains:
        - "No such option"
