# report_demand — the A-E 99-item end-user report-demand surface.
#
# Single authored source for the generated `docs/dev/enduser-coverage-matrix.md`
# view (rendered by scripts/coverage_matrix.py --render-enduser-doc). The five
# dimensions mirror the research synthesis: A sources 29, B products 25,
