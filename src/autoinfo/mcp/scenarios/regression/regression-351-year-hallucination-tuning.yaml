# Regression #351: _no_year_hallucination tuning.
#
# The bare-month-year loop previously flagged EVERY "Month Year" in prose as
# P1 — including legitimate references like "In March 2020, the market
# crashed" or "founded in June 1995" (13 false positives in the real-product
# run).  A second false-positive class matched 4-digit runs inside numeric
# tokens (UUID groups like "-1831-" and decimals like "1800.128").  The
# maintainer decision downgraded DISTANT-PAST years (< 1950) from a failure to
# an informational note — historical references are legitimate.  This scenario
# pins:
#
#   Step 1 — a FUTURE year in the BODY still FAILS P0; a pre-1950
#            "back in 1850, ..." is informational and PASSES.
#   Step 2 — legitimate plausible prose PASSES: "In March 2020, the market
#            crashed", "founded in June 1995", and a current-year month-year
#            ("In July {current_year}, growth continued").
#   Step 3 — a plausible bare month-year "In July 2023, the team shipped"
#            passes (not flagged).
#   Step 4 — forward-looking future years pass; a bare future year still
#            fails P0; "founded in 1917" is informational and passes.
#   Step 5 — title/guide publication-name future years pass (#351 V5).
#   Step 6 — 4-digit runs inside UUID-like tokens and decimal numbers do not
#            fire.
#
# Deterministic (requires_env: []): exercises _no_year_hallucination directly
# on defect + clean bodies — no LLM, no network.
name: regression-351-year-hallucination-tuning
description: "Regression #351: _no_year_hallucination no longer flags plausible month-year prose (March 2020 / June 1995 / current year) nor distant-past years (pre-1950 informational), while future years still fail P0"
category: edge_case
pyramid_layer: unit
pipeline_stage: A4
user_level: B2.5
regression: true
regression_issue: "#351"
requires_env: []
steps:
  - name: "future years still fail; pre-1950 is informational and passes"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # Future year in the BODY (not References) — must fail P0.
      r = _no_year_hallucination("# T\n\nIn 2031, adoption tripled\n", "d", "report")
      assert not r.passed and r.severity == "P0", r.details
      # Pre-1950 year in the BODY — informational, NOT a failure.
      r = _no_year_hallucination("# T\n\nback in 1850, the crisis deepened\n", "d", "report")
      assert r.passed and r.severity == "P1", r.details
      assert "informational" in r.details and "distant-past" in r.details, r.details
      print("YEAR_HALLUCINATION_OUT_OF_RANGE_TUNED_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_OUT_OF_RANGE_TUNED_OK"]

  - name: "plausible month-year prose passes (no false positive)"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # Clean product with legitimate "Month Year" prose in the plausible
      # range — the #351 false-positive class.  Must PASS after the fix.
      CLEAN = """# AI Commercial Report

      **Domain**: ai-commercial

      ## Summary

      In March 2020, the market crashed.

      ## Key Takeaways

      The firm was founded in June 1995 and kept growing.

      ## Current Status

      In July {current_year}, growth continued.

      ## References

      1. **Source** — https://example.com/1
      """.replace("{current_year}", str(__import__("datetime").datetime.now().year))
      assert _no_year_hallucination(CLEAN, "d", "report").passed is True
      print("YEAR_HALLUCINATION_PLAUSIBLE_PASSES_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_PLAUSIBLE_PASSES_OK"]

  - name: "plausible bare month-year passes"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # A plausible bare month-year in the body must pass (not flagged).
      BODY = "# T\n\nIn July 2023, the team shipped the release.\n"
      assert _no_year_hallucination(BODY, "d", "report").passed
      print("YEAR_HALLUCINATION_BARE_PLAUSIBLE_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_BARE_PLAUSIBLE_OK"]

  - name: "forward-looking future years pass (no 2027/2030 false positives)"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # The #351 V4 false-positive class from the real-product matrix:
      # financial products legitimately project forward ("by 2030",
      # "targeting 2027", "2025-2030 runway") — those must PASS.
      for body in (
          "# T\n\nRevenue is expected to double by 2030\n",
          "# T\n\nThe firm is targeting 2027 for breakeven\n",
          "# T\n\n2025-2030 runway is funded\n",
          "# T\n\nThe plant opens by July 2027\n",
      ):
          assert _no_year_hallucination(body, "d", "report").passed, body
      # A future year asserted as a completed fact still fails P0.
      r = _no_year_hallucination("# T\n\nIn 2031, adoption tripled\n", "d", "report")
      assert not r.passed and r.severity == "P0", r.details
      # A distant-past year is informational only (P1, passes).
      r = _no_year_hallucination("# T\n\nfounded in 1917\n", "d", "report")
      assert r.passed and r.severity == "P1", r.details
      assert "informational" in r.details, r.details
      print("YEAR_HALLUCINATION_FORWARD_LOOKING_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_FORWARD_LOOKING_OK"]

  - name: "title/guide publication-name future years pass (#351 V5)"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # The #351 V5 false-positive class: a publishing year used as part of a
      # list/guide/ranking/publication NAME (e.g. "Princeton Review\x27s 2027
      # Best Colleges guide", "The 2027 Best Colleges guide") is a legitimate
      # reference, not a hallucination — it must NOT fire.
      for body in (
          "# T\n\nThe Princeton Review\x27s 2027 Best Colleges guide ranks the "
          "top 10 colleges for financial aid.\n",
          "# T\n\nThe 2027 Best Colleges guide is out now.\n",
          "# T\n\nBloomberg\x27s 2027 outlook lists the key risks.\n",
      ):
          assert _no_year_hallucination(body, "financial-intelligence", "report").passed, body

      # A bare future year asserted as a completed fact STILL fails (V5 must
      # not weaken the P0 gate for factual claims).
      r = _no_year_hallucination("# T\n\nIn 2031, adoption tripled\n", "financial-intelligence", "report")
      assert not r.passed and r.severity == "P0", r.details
      print("YEAR_HALLUCINATION_NAMED_YEAR_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_NAMED_YEAR_OK"]

  - name: "numeric-token false positives do not fire (UUID group / decimal)"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import _no_year_hallucination

      # The #351 tuning false-positive class: a 4-digit run inside a
      # hex/UUID-like token or a decimal measurement is not a year.
      for body in (
          "# T\n\ntrace_id: 7c8cc68a-1831-4653-ab65-a2fad98a50fe\n",
          "# T\n\nffmpeg -t 1800.128 out.mp4\n",
      ):
          r = _no_year_hallucination(body, "d", "report")
          assert r.passed, r.details
      # Real years still match: a bare future year still fails P0.
      r = _no_year_hallucination("# T\n\nIn 2031, adoption tripled\n", "d", "report")
      assert not r.passed and r.severity == "P0", r.details
      print("YEAR_HALLUCINATION_NON_YEAR_NUMERIC_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["YEAR_HALLUCINATION_NON_YEAR_NUMERIC_OK"]
