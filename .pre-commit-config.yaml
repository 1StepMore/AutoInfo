# Local fast-feedback lint layer (gaps C3 + C4).
#
# Install once with: pre-commit install
# (pre-commit >= 3.7 is in the dev extra; `pre-commit install` writes the
# hook scripts into .git/hooks — solving the empty-hooks problem for new
# clones, since the hook samples are not copied by git clone).
#
# This is the LOCAL fast-feedback layer only: CI runs ruff and mypy directly
# in ci.yml (changed-files ruff + mypy gates) so the pre-commit hooks here
# are a convenience, not the enforcement point. Keep the two in sync —
# anything added below should also be covered by the CI gates.

repos:
  # Ruff rev mirrors the pyproject.toml pin (ruff==0.17.1) so the local hook
  # and the CI gate lint with the same rule set; bump both in the same change.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      - id: debug-statements
      - id: check-merge-conflict

  # Secret scanning — blocks commits containing API keys / tokens / credentials.
  # Uses gitleaks (Go binary, downloaded on first run). Covers ghp_/gho_/
  # github_pat_, sk-, AIza, AKIA, eyJ, long hex/base64, and 150+ other rules.
  # Keep in sync with CI: the `lint` job in .github/workflows/ci.yml runs the
  # same pinned gitleaks release over the PR/push commit range.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Lightweight fallback — catches credential URLs even if gitleaks is skipped.
  # Runs a local grep for token-in-URL forms and ghp_/github_pat_ prefixes.
  - repo: local
    hooks:
      - id: no-credential-url
        name: no-credential-url (block token-in-URL)
        entry: 'bash -c ''git diff --cached --diff-filter=ACM --name-only | xargs grep -nE "https://[^/]*@github\.com|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}" 2>/dev/null && echo "ERROR: staged files contain credential URL or GitHub PAT" && exit 1 || exit 0'''
        language: system
        always_run: false
        pass_filenames: false

      # Left-shifts the governance drift gates to commit time (T11):
      # `python -m autoinfo.gov check` re-derives the facts from code and
      # scans every tracked markdown — the same check guard.yml runs (which
      # also subsumes doc_inventory --check's fact parity). Whole-repo state,
      # not per-file, so it runs unconditionally. The env probe keeps it from
      # false-blocking where autoinfo is not importable (environment mismatch,
      # not drift). CI's Drift Guard + derived-facts job remain the
      # enforcement point for those machines.
      - id: doc-inventory-check
        name: gov drift check (derived facts + whole-repo scan)
        entry: 'bash -c ''PY=.venv/Scripts/python.exe; [ -x "$PY" ] || PY=.venv/bin/python; [ -x "$PY" ] || PY=python3; if ! "$PY" -c "import autoinfo" 2>/dev/null; then echo "gov-check: SKIPPED (autoinfo not importable — environment mismatch, not doc drift; CI Drift Guard still enforces)"; exit 0; fi; "$PY" -m autoinfo.gov check --json'''
        language: system
        always_run: true
        pass_filenames: false
