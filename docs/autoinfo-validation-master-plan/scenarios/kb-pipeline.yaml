# =============================================================================
# Scenario: kb-pipeline
# Description: Verify KB 4-tier pipeline, import/export, versioning, relations,
#              and knowledge graph
# Tags: kb, pipeline, tiers, import, export, versioning, relations, graph, regression
# =============================================================================

name: "KB Pipeline — 4-Tier Lifecycle"
tier: 1
description: >
  Tests the KB 4-tier pipeline (Inbox→Raw→Draft→Wiki), KB import (Markdown,
  HTML, JSON), KB export (md, json, sqlite, csv, graphml, pdf, rss, sitemap,
  agent), KB versioning (get_entry_history, restore_entry_version), KB
  relations (link_items, get_item_relations), knowledge graph
  (query_knowledge_graph, knowledge_graph_export). No LLM key required.

tags: [kb, pipeline, tiers, import, export, versioning, relations, graph, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-kb-pipeline"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project with domain (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for KB pipeline tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "kb-pipeline-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
      stdout_not_contains:
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/.autoinfo/config.yaml:!"
        - "${TEST_DIR}/.autoinfo/knowledge/01-Raw"

  # -------------------------------------------------------------------------
  # Step 2: KB tier listing — verify all tiers
  # -------------------------------------------------------------------------
  - name: "List KB entries by tier (01-Raw, 02-Draft, 03-Wiki)"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo kb list --domain ${DOMAIN} --tier "01-Raw" --limit 5 2>&1 && \
      echo "---" && \
      autoinfo kb list --domain ${DOMAIN} --tier "02-Draft" --limit 5 2>&1 && \
      echo "---" && \
      autoinfo kb list --domain ${DOMAIN} --tier "03-Wiki" --limit 5 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: KB import — Markdown file to 01-Raw
  # -------------------------------------------------------------------------
  - name: "Import Markdown content into KB (01-Raw)"
    tool: python
    command: |
      import sys, os, json, pathlib, tempfile
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      md_content = "\n".join([
          "---",
          "title: Imported Pipeline Test Article",
          "source_url: https://example.com/pipeline-import",
          "source_type: web",
          "source_platform: test",
          "quality_tier: 1",
          "topic_tags: [ivf]",
          "---",
          "# Imported Pipeline Test Article",
          "",
          "This is imported content for testing the KB pipeline import tool.",
          "It should end up in 01-Raw tier.",
      ])

      result = app.call_tool("import_kb", {
          "domain": "medical-research",
          "data": md_content,
          "format": "markdown"
      })
      import_data = json.loads(result.content[0].text)
      assert "entry_id" in import_data or "status" in import_data or "id" in import_data, \
        f"Expected entry_id/status/id in import result, got keys: {list(import_data.keys())}"
      print(json.dumps({"tool": "import_kb", "format": "markdown", "response_keys": list(import_data.keys())[:5]}))
    expected:
      exit_code: 0
      stdout_contains:
        - "import_kb"
        - "markdown"
      stdout_not_contains:
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/knowledge/medical-research/01-Raw/**/*.md:!"

  # -------------------------------------------------------------------------
  # Step 4: KB import — CSV file to 01-Raw
  # -------------------------------------------------------------------------
  - name: "Import CSV content into KB (01-Raw)"
    tool: python
    command: |
      import sys, os, json, pathlib, tempfile
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      csv_content = "\n".join([
          "title,source_url,source_type,source_platform,content",
          "Imported CSV Article,https://example.com/csv-import,web,test,This is CSV content imported into the KB pipeline.",
      ])

      result = app.call_tool("import_kb", {
          "domain": "medical-research",
          "data": csv_content,
          "format": "csv"
      })
      import_data = json.loads(result.content[0].text)
      assert "entries_imported" in import_data, \
        f"Expected entries_imported in import result, got keys: {list(import_data.keys())}"
      print(json.dumps({"tool": "import_kb", "format": "csv", "entries_imported": import_data.get("entries_imported", 0)}))
    expected:
      exit_code: 0
      stdout_contains:
        - "import_kb"
        - "csv"
      stdout_not_contains:
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/knowledge/medical-research/01-Raw/**/*.md:!"

  # -------------------------------------------------------------------------
  # Step 5: KB import — JSON file to 01-Raw
  # -------------------------------------------------------------------------
  - name: "Import JSON content into KB (01-Raw)"
    tool: python
    command: |
      import sys, os, json, pathlib, tempfile
      os.chdir("${TEST_DIR}")
      import asyncio, json
