# =============================================================================
# Scenario: human-agent-collaboration
# Description: Verify human-agent collaboration patterns — ambiguous intent
#              clarification, failure escalation, human review & iteration,
#              and human override & agent compliance.
# Tags: collaboration, ambiguity, escalation, review, override, agent, regression
# =============================================================================

name: "Human-Agent Collaboration Validation"
description: >
  Validates multi-turn human↔agent collaboration patterns from the Director
  User perspective: agent clarifies ambiguous intent before executing (vague
  topic, multiple domains, completely ambiguous), escalates failures to human
  decision-makers (source errors, LLM failures, hard failures), iterates on
  human feedback for content review cycles (digest revision, draft→Wiki flow),
  and complies with explicit human overrides (custom instructions, forced full
  collection, skip dedup, override documentation).
tier: 2

tags: [collaboration, ambiguity, escalation, review, override, agent, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-collab"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for collaboration tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "collab-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
    artifacts:
      - "${TEST_DIR}/.autoinfo/config.yaml"

  # -------------------------------------------------------------------------
  # Step 2: Ambiguous intent — agent lists domains before collecting
  # -------------------------------------------------------------------------
  - name: "Ambiguous intent: agent lists active domains before executing"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: Human says "Gather intelligence across my domains"
      # Agent: lists domains first to clarify which one
      result = app.call_tool("list_domains", {})
      data = json.loads(result.content[0].text)
      domains = data.get("domains", [])
      active = [d for d in domains if d.get("active")]
      assert len(active) >= 1, "Expected at least 1 active domain"
      print("ACTIVE_DOMAINS=" + str(len(active)))

      # Agent would ask which domain, then collect only that one
      domain_name = active[0].get("name", "${DOMAIN}")
      result2 = app.call_tool("collect_sources", {
          "domain": domain_name,
          "limit": 1,
          "dry_run": True
      })
      data2 = json.loads(result2.content[0].text)
      assert result2 is not None, "collect_sources dry_run failed"
      print("DRY_RUN_COMPLETE domain=" + domain_name)
    expected:
      exit_code: 0
      stdout_contains:
        - "ACTIVE_DOMAINS="
        - "DRY_RUN_COMPLETE"

  # -------------------------------------------------------------------------
  # Step 3: Failure escalation — agent detects source error, reports to human
  # -------------------------------------------------------------------------
  - name: "Escalation: agent checks source health and reports failures"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: Agent performs pre-collection health check
      result = app.call_tool("get_source_health", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      sources = data.get("sources", data.get("items", []))
      healthy = sum(1 for s in sources if s.get("status") in ("ok", "healthy", "active"))
      unhealthy = len(sources) - healthy
      print(f"SOURCE_HEALTH_CHECK healthy={healthy} unhealthy={unhealthy} total={len(sources)}")

      # Agent would report unhealthy sources to human and offer options
      # Human decides: test the source
      if sources:
          src_name = sources[0].get("name", "pubmed")
          result2 = app.call_tool("test_source", {
              "domain": "${DOMAIN}",
              "name": src_name
          })
          data2 = json.loads(result2.content[0].text)
          reachable = data2.get("reachable", data2.get("status", "?"))
          print(f"TEST_SOURCE_COMPLETE name={src_name} reachable={reachable}")
    expected:
      exit_code: 0
      stdout_contains:
        - "SOURCE_HEALTH_CHECK"
        - "TEST_SOURCE_COMPLETE"

  # -------------------------------------------------------------------------
  # Step 4: Human review — agent creates Draft, human promotes to Wiki
  # -------------------------------------------------------------------------
  - name: "Human review: agent searches KB, creates Draft from Raw entry"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: Human says "Turn the endometrial receptivity paper into a KB entry"
      # Agent searches for relevant Raw entries
      result = app.call_tool("search_knowledge_base", {
          "domain": "${DOMAIN}",
          "query": "research",
          "mode": "faceted",
          "filters": {"tier": "raw"},
          "limit": 3
      })
      data = json.loads(result.content[0].text)
      entries = data.get("results", data.get("entries", []))
      if entries:
          top_id = entries[0].get("id", entries[0].get("entry_id", ""))
          print(f"KB_SEARCH_COMPLETE entries={len(entries)}")

          # Agent creates Draft from Raw (per F20 — agent can create Draft)
          if top_id:
              draft_result = app.call_tool("create_kb_draft", {"raw_ids": [top_id], "title": "Agent draft from " + top_id})
              draft_data = json.loads(draft_result.content[0].text)
              draft_id = draft_data.get("draft_id", draft_data.get("entry_id", "?"))
              print(f"DRAFT_CREATED id={draft_id}")

              # Agent links related items
              if len(entries) >= 2:
                  target_id = entries[1].get("id", entries[1].get("entry_id", ""))
                  link_result = app.call_tool("link_items", {
                      "source_id": top_id,
                      "target_id": target_id,
                      "relation": "related"
                  })
                  link_data = json.loads(link_result.content[0].text)
                  print(f"ITEMS_LINKED source={top_id} target={target_id}")
      else:
          print("KB_SEARCH_EMPTY tool_works=True")
    expected:
      exit_code: 0
      stdout_contains:
        - "KB_SEARCH"

  # -------------------------------------------------------------------------
  # Step 5: Human override — custom_instructions parameter for digest
  # -------------------------------------------------------------------------
  - name: "Human override: agent applies custom_instructions parameter"
    tool: python
    env_required:
      - AUTOINFO_LLM_API_KEY
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: Human says "Focus exclusively on clinical trials, no basic science"
      # Agent applies custom_instructions parameter
      result = app.call_tool("generate_digest", {
          "domain": "${DOMAIN}",
          "period": "week",
          "custom_instructions": "Focus exclusively on clinical trials. Exclude basic science and preclinical studies."
      })
      data = json.loads(result.content[0].text)
      digest_text = data.get("content", data.get("digest", ""))
      assert len(digest_text) >= 0, "digest generation returned"
      print("DIGEST_GENERATED chars=" + str(len(digest_text)))

      # Simulate: human overrides default limit for collection
      result2 = app.call_tool("collect_sources", {
          "domain": "${DOMAIN}",
          "limit": 0  # 0 = no limit, collect all
      })
      data2 = json.loads(result2.content[0].text)
      items = data2.get("items_collected", data2.get("total_items", 0))
      print(f"FULL_COLLECTION items={items}")
    expected:
      exit_code: 0
      stdout_contains:
        - "DIGEST_GENERATED"
        - "FULL_COLLECTION"

  # -------------------------------------------------------------------------
  # Step 6: Agent compliance — skip_dedup on human request
  # -------------------------------------------------------------------------
  - name: "Agent compliance: skip_dedup collected on human request"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: Agent detected 3 potential duplicates
      print("DEDUP_WARNING 3 potential duplicates")

      # Human says "collect them anyway, I want to check for updates"
      # Agent collects with skip_dedup=True
      result = app.call_tool("collect_sources", {
          "domain": "${DOMAIN}",
          "topic": "IVF breakthroughs",
          "limit": 3,
          "skip_dedup": True
      })
      data = json.loads(result.content[0].text)
      items = data.get("items_collected", data.get("total_items", 0))
      print(f"SKIP_DEDUP_COLLECTION items={items}")
      print("OVERRIDE_AUDIT type=collection_dedup parameter=skip_dedup value=True")
    expected:
      exit_code: 0
      stdout_contains:
        - "SKIP_DEDUP_COLLECTION"
        - "OVERRIDE_AUDIT"

  # -------------------------------------------------------------------------
  # Step 7: LLM failure escalation — agent checks config, offers fallback
  # -------------------------------------------------------------------------
  - name: "LLM escalation: agent checks LLM config and identifies fallback"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Simulate: LLM call fails with auth error
      print("WARNING: simulated LLM auth error detected")

      # Agent checks current config
      result = app.call_tool("get_effective_llm_config", {})
      data = json.loads(result.content[0].text)
      provider = data.get("provider", "?")
      model = data.get("model", "?")
      fallback = data.get("fallback", None)
      print(f"LLM_CONFIG provider={provider} model={model} fallback={'configured' if fallback else 'none'}")

      # Agent would offer human: "switch to fallback model or update API key"
      # Human: "switch to fallback"
      print("ESCALATION_COMPLETE pattern=detect_report_offer_decide")
    expected:
      exit_code: 0
      stdout_contains:
        - "LLM_CONFIG"
        - "ESCALATION_COMPLETE"
