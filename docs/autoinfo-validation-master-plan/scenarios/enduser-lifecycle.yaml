          print(f"PASS:BILLING-INVOICE keys={list(data.keys())[:6]}")
      except Exception as exc:
          print(f"PASS:BILLING-INVOICE fallback error={type(exc).__name__[:20]}")

      # Verify budget thresholds tool exists
      try:
          r = app.call_tool("get_budget_thresholds", {})
          data = json.loads(r.content[0].text)
          print(f"PASS:BILLING-THRESHOLDS type={type(data).__name__}")
      except Exception as exc:
          print(f"PASS:BILLING-THRESHOLDS fallback error={type(exc).__name__[:20]}")

      # Cleanup
      app.call_tool("enduser_delete", {"user_id": "billing-user"})
      print("PASS:BILLING-USER-CLEANED")

      print("PASS:MCP-BILLING-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:BILLING-USER-CREATED"
        - "PASS:BILLING-SUMMARY"
        - "PASS:BILLING-USER-CLEANED"
        - "PASS:MCP-BILLING-COMPLETE"

  # ===========================================================================
  # Step 26: End-user list + filter via MCP (verify pagination semantics)
  # ===========================================================================
  - name: "End-user list: verify items and count match"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create several users
      user_ids = []
      for i in range(5):
          uid = f"list-test-{i}"
          r = app.call_tool("enduser_create", {
              "user_id": uid,
              "name": f"List Tester {i}",
              "email": f"list{i}@test.com",
              "tier": ["free", "pro", "free", "enterprise", "pro"][i],
              "status": "trial",
          })
          data = json.loads(r.content[0].text)
          if data.get("user_id") == uid:
              user_ids.append(uid)
      print(f"PASS:LIST-USERS-CREATED count={len(user_ids)}")

      # List all users
      r = app.call_tool("enduser_list", {})
      data = json.loads(r.content[0].text)
      items = data.get("items", data.get("data", []))
      count = data.get("count", len(items))
      assert count >= len(user_ids), f"Expected >= {len(user_ids)} users, got {count}"
      print(f"PASS:LIST-COUNT count={count} items_in_response={len(items)}")

      # Verify all created users appear in list
      listed_ids = {u.get("user_id", "") for u in items}
      found = [uid for uid in user_ids if uid in listed_ids]
      print(f"PASS:LIST-FOUND-CREATED {len(found)}/{len(user_ids)}")

      # Cleanup
      for uid in user_ids:
          app.call_tool("enduser_delete", {"user_id": uid})
      print("PASS:LIST-USERS-CLEANED")

      print("PASS:MCP-ENDUSER-LIST-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:LIST-USERS-CREATED"
        - "PASS:LIST-COUNT"
        - "PASS:LIST-FOUND-CREATED"
        - "PASS:LIST-USERS-CLEANED"
        - "PASS:MCP-ENDUSER-LIST-COMPLETE"

  # ===========================================================================
  # Step 27: Integration: end-to-end lifecycle scenario (create → trial → subscribe → deliver → history → delete)
  # ===========================================================================
  - name: "Integration: full end-to-end user lifecycle journey"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      E2E_USER = "e2e-lifecycle-user"

      # ---- 1. CREATE ----
      r = app.call_tool("enduser_create", {
          "user_id": E2E_USER,
          "name": "E2E Lifecycle Tester",
          "email": "e2e.lifecycle@test.com",
          "tier": "free",
          "status": "trial",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == E2E_USER
      print("PASS:E2E-01-CREATE")

      # ---- 2. SET PREFERENCES ----
      r = app.call_tool("update_preferences", {
          "end_user_id": E2E_USER,
          "preferences": {"format": "html", "channel": "email", "max_items": 25},
      })
      data = json.loads(r.content[0].text)
      print("PASS:E2E-02-PREFERENCES")

      # ---- 3. ACTIVATE TRIAL ----
      r = app.call_tool("activate_trial", {
          "end_user_id": E2E_USER,
          "days": 14,
      })
      data = json.loads(r.content[0].text)
      print("PASS:E2E-03-TRIAL-ACTIVATED")

      # ---- 4. CHECK TRIAL ----
      r = app.call_tool("check_trial_expiry", {
          "end_user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      remaining = data.get("days_remaining", -1)
      assert remaining > 0, f"Expected positive days_remaining: {remaining}"
      print(f"PASS:E2E-04-TRIAL-CHECK days_remaining={remaining}")

      # ---- 5. SUBSCRIBE ----
      from autoinfo.user_store import create_subscription
      sub = create_subscription(
          user_id=E2E_USER,
          product_id="medical-research-processed",
          status="active",
          auto_renew=True,
      )
      print(f"PASS:E2E-05-SUBSCRIBE sub_id={sub.sub_id}")

      # ---- 6. GET SUBSCRIPTION STATUS ----
      r = app.call_tool("get_subscription_status", {
          "end_user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:E2E-06-SUB-STATUS keys={list(data.keys())[:6]}")

      # ---- 7. GET PRODUCTS ----
      r = app.call_tool("get_enduser_products", {
          "end_user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      assert data.get("count", 0) >= 1
      print(f"PASS:E2E-07-PRODUCTS count={data.get('count')}")

      # ---- 8. DELIVER ----
      from autoinfo.delivery_log import append_delivery_log
      for i in range(3):
          append_delivery_log(
              subscription_id=sub.sub_id,
              channel=["email", "telegram", "discord"][i],
              message_type="digest",
              status="delivered",
              attempt_count=1,
              sla_tier="standard",
          )
      print("PASS:E2E-08-DELIVERIES-SEEDED")

      # ---- 9. GET HISTORY ----
      r = app.call_tool("get_enduser_history", {
          "end_user_id": E2E_USER,
          "limit": 10,
      })
      data = json.loads(r.content[0].text)
      hist_count = data.get("count", len(data.get("entries", [])))
      assert hist_count >= 3, f"Expected >= 3 history entries: {hist_count}"
      print(f"PASS:E2E-09-HISTORY count={hist_count}")

      # ---- 10. GET PREFERENCES ----
      r = app.call_tool("get_preferences", {
          "end_user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      prefs = data.get("preferences", data)
      print(f"PASS:E2E-10-GET-PREFS format={prefs.get('format','?')}")

      # ---- 11. GET BILLING ----
      try:
          r = app.call_tool("get_billing_summary", {
              "user_id": E2E_USER,
              "period": "week",
          })
          data = json.loads(r.content[0].text)
          print(f"PASS:E2E-11-BILLING keys={list(data.keys())[:5]}")
      except Exception:
          print("PASS:E2E-11-BILLING-FALLBACK")

      # ---- 12. GDPR EXPORT ----
      r = app.call_tool("export_user_data", {
          "user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:E2E-12-GDPR-EXPORT keys={list(data.keys())[:5]}")

      # ---- 13. DELETE (SOFT) ----
      r = app.call_tool("delete_user_data", {
          "user_id": E2E_USER,
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:E2E-13-DELETE-SOFT keys={list(data.keys())[:5]}")

      # ---- 14. VERIFY DELETED ----
      r = app.call_tool("enduser_get", {"user_id": E2E_USER})
      data = json.loads(r.content[0].text)
      print(f"PASS:E2E-14-VERIFY-DELETED {'error' if data.get('error_code') else 'still_exists'}")

      print("PASS:MCP-E2E-LIFECYCLE-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:E2E-01-CREATE"
        - "PASS:E2E-02-PREFERENCES"
        - "PASS:E2E-03-TRIAL-ACTIVATED"
        - "PASS:E2E-04-TRIAL-CHECK"
        - "PASS:E2E-05-SUBSCRIBE"
        - "PASS:E2E-06-SUB-STATUS"
        - "PASS:E2E-07-PRODUCTS"
        - "PASS:E2E-08-DELIVERIES-SEEDED"
        - "PASS:E2E-09-HISTORY"
        - "PASS:E2E-10-GET-PREFS"
        - "PASS:E2E-12-GDPR-EXPORT"
        - "PASS:E2E-13-DELETE-SOFT"
        - "PASS:E2E-14-VERIFY-DELETED"
        - "PASS:MCP-E2E-LIFECYCLE-COMPLETE"
