# PR title gate (gap C1).
#
# AutoInfo squash-merges, so the PR title becomes the commit message on main
# — and from there it feeds release-please's changelog (release-please.yml).
# A title that is not a valid Conventional Commit either lands in the wrong
# changelog section or no section at all. Gate it at the PR level instead of
# fixing up history after the merge.
#
# Plain bash + grep: a regex check does not justify a third-party action.

name: PR title check

permissions:
  contents: read

on:
  pull_request:
    # `labeled`/`unlabeled` re-run the release-scope job when an
    # escape-hatch label (release:user-visible / release:skip) is applied.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          # Passed via env, not shell interpolation, so titles containing
          # $, backticks, or quotes are inert.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u

          # Conventional Commits: type(scope)!?: subject.
          # Scope is optional, "!" (breaking change) is allowed before the
          # colon, and the subject must be non-empty.
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'

          # Bot/automation titles that are expected on main but are not
          # Conventional Commits. Never block these: dependabot bumps
          # ("dependabot[bot]: bump ..."), merge commits ("Merge ..."), and
          # release-please's own release PRs ("Release v1.9.0").
          case "$TITLE" in
            dependabot\[*|Merge*|Release*) echo "Exempt title (bot/merge/release): $TITLE"; exit 0 ;;
          esac

          if [[ "$TITLE" =~ $REGEX ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit (https://www.conventionalcommits.org): '$TITLE'"
            echo "::error::Expected 'type(scope): subject', e.g. 'feat(collect): add GDELT fulltext depth'"
            exit 1
          fi

  # Type-vs-path release-scope gate (issue #406).
  #
  # release-please keys off the conventional-commit TYPE only, so an
  # internal-only PR typed `fix(ci):`/`fix(release):` cuts a public release
  # whose only difference is the version number — and this repo auto-merges
  # release PRs, so nothing human stands in the way. Fail the mismatch; the
  # `release:user-visible`/`release:skip` labels are the explicit escape
  # hatches. Unknown paths default to user-visible, so a mis-classification
  # demands a release rather than silently suppressing one.
  release-scope:
    name: Release scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed paths against the PR title's release scope
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          # No `--depth=1` fetch here: actions/checkout with fetch-depth: 0
          # already has full history and tags, and a shallow ref would break
          # the merge base the three-dot diff needs.
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            git fetch origin "$BASE_REF"
          fi
          git rev-parse --verify "origin/$BASE_REF^{commit}"
          git diff --name-only "origin/$BASE_REF...HEAD" \
            | python3 scripts/check_release_scope.py --files - --title "$PR_TITLE" --labels "$LABELS"
