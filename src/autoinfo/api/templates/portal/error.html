{% extends "base.html" %}
{% block title %}Error — AutoInfo Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 50vh">
  <div class="text-center">
    <div class="display-1 text-danger mb-3">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="h3 mb-3">Something went wrong</h1>
    <p class="text-muted mb-4">{{ error_message }}</p>

    <div class="card border-0 bg-body-tertiary mb-4">
      <div class="card-body">
        <h6 class="text-muted small text-uppercase mb-3">Try a different user ID</h6>
        <form class="row g-2 justify-content-center" onsubmit="navigateToUser(event)">
          <div class="col-auto">
            <input type="text" id="userIdInput" class="form-control" name="user_id" placeholder="user_id" required>
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-arrow-right"></i> Go
            </button>
          </div>
        </form>
        <p class="text-muted small mt-2 mb-0">
          Or visit the <a href="/dashboard">main dashboard</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function navigateToUser(event) {
  event.preventDefault();
  const input = document.getElementById("userIdInput");
  const userId = (input.value || "").trim();
  if (userId) {
    window.location.href = "/portal/" + encodeURIComponent(userId);
  }
}
</script>
{% endblock %}
