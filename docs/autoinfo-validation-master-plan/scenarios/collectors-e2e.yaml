      fi
      autoinfo init --demo medical-research --name "nyt-test" 2>&1
      echo "---ADD_SOURCE---"
      autoinfo sources add --domain medical-research --name nyt --type nyt --url "https://api.nytimes.com/svc/search/v2/articlesearch.json" 2>&1
      echo "---COLLECT---"
      autoinfo collect --domain medical-research --source nyt --limit 2 2>&1
