# =============================================================================
# Scenario: quality-gates
# Description: Verify quality gates G1-G5 and gate configuration tools
# Tags: quality, gates, regression, python
# =============================================================================

name: "Quality Gates Validation"
description: >
  Tests quality gates G1 (source authority tier check), G2 (dedup),
  G3 (relevance scoring), and gate configuration (get_gate_config,
  set_gate_config). Tests G0 schema integrity via CLI process with
  valid/invalid items. SKIPs G4 (factual consistency) and G5
  (translation accuracy) as they require a real LLM key.

tags: [quality, gates, regression, python, g1, g2, g3, g0]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-quality-gates"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project with domain (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for quality gate tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "quality-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"

  # -------------------------------------------------------------------------
  # Step 2: G1 Source Authority — Tier 1 passes unflagged
  # -------------------------------------------------------------------------
  - name: "G1: Tier 1 source passes unflagged"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1SourceAuthority
      from autoinfo.models import Item

      item = Item(id="g1-1", source_name="pubmed", title="Test", content="test",
                  collected_at="2026-07-20", quality_tier=1)
      result = G1SourceAuthority().check(item, {"quality_tier": 1})
      assert result.passed == True, f"Expected passed=True, got {result.passed}"
      assert result.flagged == False, f"Expected flagged=False, got {result.flagged}"
      print("PASS: G1 Tier 1 passes unflagged")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1 Tier 1 passes unflagged"

  # -------------------------------------------------------------------------
  # Step 3: G1 Source Authority — Tier 3+ flagged advisory
  # -------------------------------------------------------------------------
  - name: "G1: Tier 3 source flagged (advisory, not blocked)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1SourceAuthority
      from autoinfo.models import Item

      item = Item(id="g1-2", source_name="blog", title="Test", content="test",
                  collected_at="2026-07-20", quality_tier=3)
      result = G1SourceAuthority().check(item, {"quality_tier": 3})
      assert result.flagged == True, f"Expected flagged=True for Tier 3, got {result.flagged}"
      print("PASS: G1 Tier 3 flagged advisory")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1 Tier 3 flagged advisory"

  # -------------------------------------------------------------------------
  # Step 4: G2 Dedup — exact URL match
  # -------------------------------------------------------------------------
  - name: "G2: Exact URL match dedup"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item

      checker = DedupChecker()
      item = Item(id="dup-1", source_name="pubmed",
                  source_url="https://doi.org/10.1234/test",
                  title="Dup Article", content="same content",
                  collected_at="2026-07-20")
      existing = [{"source_url": "https://doi.org/10.1234/test"}]
      result = checker.check(item, existing)
      assert result["is_duplicate"] == True, f"Expected duplicate, got {result}"
      print("PASS: G2 URL exact match dedup works")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G2 URL exact match dedup works"

  # -------------------------------------------------------------------------
  # Step 5: G2 Dedup — unique URL passes
  # -------------------------------------------------------------------------
  - name: "G2: Unique URL passes dedup"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item

      checker = DedupChecker()
      item = Item(id="unique-1", source_name="pubmed",
                  source_url="https://doi.org/10.9999/unique",
                  title="Unique Article", content="different",
                  collected_at="2026-07-20")
      existing = [{"source_url": "https://doi.org/10.1234/other"}]
      result = checker.check(item, existing)
      assert result["is_duplicate"] == False, f"Expected unique, got {result}"
      print("PASS: G2 unique URL passes dedup")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G2 unique URL passes dedup"

  # -------------------------------------------------------------------------
  # Step 6: G2 Dedup — empty source_url handled gracefully
  # -------------------------------------------------------------------------
  - name: "G2: Empty source_url does not crash"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item

      checker = DedupChecker()
      item = Item(id="no-url", source_name="pubmed", source_url="",
                  title="No URL", content="test", collected_at="2026-07-20")
      existing = [{"source_url": "https://example.com"}]
      result = checker.check(item, existing)
      assert result["is_duplicate"] == False, f"Empty URL should not match, got {result}"
      print("PASS: G2 empty source_url handled gracefully (no crash)")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G2 empty source_url handled gracefully"

  # -------------------------------------------------------------------------
  # Step 7: G3 Relevance — score in 0-100 range
  # -------------------------------------------------------------------------
  - name: "G3: Relevance score within 0-100 range"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G3RelevanceScoring
      from autoinfo.models import Item

      item = Item(id="g3-1", title="IVF treatment outcomes in 2026",
                  content="This paper discusses IVF embryo implantation success rates...",
                  collected_at="2026-07-20")
      result = G3RelevanceScoring().check(item, {"keywords": ["IVF", "embryo", "implantation"]})
      assert 0 <= result.score <= 100, f"Score {result.score} out of range"
      print(f"PASS: G3 relevance score {result.score} in [0,100]")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G3 relevance score"

  # -------------------------------------------------------------------------
  # Step 8: G3 Relevance — higher keyword overlap = higher score
  # -------------------------------------------------------------------------
  - name: "G3: Higher keyword overlap scores higher"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G3RelevanceScoring
      from autoinfo.models import Item

      item_high = Item(id="g3-hi", title="IVF embryo implantation study 2026",
                       content="IVF embryo implantation research findings...",
                       collected_at="2026-07-20")
      item_low = Item(id="g3-lo", title="Cooking recipes",
                      content="How to make pasta carbonara...",
                      collected_at="2026-07-20")
      result_high = G3RelevanceScoring().check(item_high, {"keywords": ["IVF", "embryo", "implantation"]})
      result_low = G3RelevanceScoring().check(item_low, {"keywords": ["IVF", "embryo", "implantation"]})
      assert result_high.score > result_low.score, \
        f"Expected high({result_high.score}) > low({result_low.score})"
      print(f"PASS: G3 relevance ranking: high={result_high.score} > low={result_low.score}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G3 relevance ranking"

  # -------------------------------------------------------------------------
  # Step 9: Gate config — get default gate configuration
  # -------------------------------------------------------------------------
  - name: "Get default gate configuration via MCP"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      result = app.call_tool("get_gate_config", {"domain": "medical-research"})
      data = json.loads(result.content[0].text)
      assert "G1" in str(data) or "G2" in str(data) or "gates" in str(data) or isinstance(data, dict), \
        f"Expected gate config data, got: {data}"
      print(f"PASS: get_gate_config returned: {list(data.keys())[:5] if isinstance(data, dict) else type(data).__name__}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: get_gate_config"

  # -------------------------------------------------------------------------
  # Step 10: Gate config — error on invalid gate name
  # -------------------------------------------------------------------------
  - name: "Gate config with invalid gate name should handle gracefully"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      try:
        result = app.call_tool("get_gate_config", {"domain": "medical-research", "gate_name": "nonexistent_gate"})
        data = json.loads(result.content[0].text)
        print(f"PASS: invalid gate name handled: {data}")
      except Exception as e:
        print(f"PASS: invalid gate name raised exception (expected): {type(e).__name__}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: invalid gate"

  # -------------------------------------------------------------------------
  # Step 11: G2 Dedup — empty existing list passes
  # -------------------------------------------------------------------------
  - name: "G2: Empty existing list — not a duplicate"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item

      checker = DedupChecker()
      item = Item(id="fresh-1", source_name="pubmed",
                  source_url="https://doi.org/10.1234/fresh",
                  title="Fresh Article", content="new content",
                  collected_at="2026-07-20")
      result = checker.check(item, [])
      assert result["is_duplicate"] == False, f"Empty existing should not match, got {result}"
      print("PASS: G2 empty existing list — not duplicate")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G2 empty existing list"

  # =========================================================================
  # G1 Extension: E9 source_score verification  [added 2026-08-02 — e-features]
  # 唯一修改：追加 E9/E10 到 quality-gates.yaml 末尾
  # Code: src/autoinfo/quality.py:41-46 SOURCE_TIER_SCORE_MAP
  #       src/autoinfo/quality.py:245-253 source_score in G1SourceAuthority
  # =========================================================================

  - name: "G1-E9: SOURCE_TIER_SCORE_MAP tier ordering (tier1 > tier2 > tier3 > tier4)"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import SOURCE_TIER_SCORE_MAP

      s1 = SOURCE_TIER_SCORE_MAP[1]
      s2 = SOURCE_TIER_SCORE_MAP[2]
      s3 = SOURCE_TIER_SCORE_MAP[3]
      s4 = SOURCE_TIER_SCORE_MAP[4]

      for tier, score in [(1, s1), (2, s2), (3, s3), (4, s4)]:
          assert 0 <= score <= 100, f"tier{tier} score {score} out of 0-100"

      assert s1 > s2 > s3 > s4, (
          f"score order violated: {s1} > {s2} > {s3} > {s4}"
      )
      print(f"PASS: G1-E9 SOURCE_TIER_SCORE_MAP tier ordering — "
            f"tier1={s1} > tier2={s2} > tier3={s3} > tier4={s4}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1-E9 SOURCE_TIER_SCORE_MAP tier ordering"

  - name: "G1-E9: source_score embedded in G1SourceAuthority result details"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1SourceAuthority, SOURCE_TIER_SCORE_MAP
      from autoinfo.models import Item

      gate = G1SourceAuthority()
      for tier in [1, 2, 3, 4]:
          item = Item(id=f"g1e9-{tier}", source_name=f"src{tier}",
                      title="T", content="c", collected_at="2026-01-01",
                      quality_tier=tier)
          result = gate.check(item, {"quality_tier": tier})
          score = result.details.get("source_score")
          assert score is not None, f"tier {tier}: source_score missing"
          assert score == SOURCE_TIER_SCORE_MAP.get(tier), (
              f"tier {tier}: expected {SOURCE_TIER_SCORE_MAP.get(tier)}, got {score}"
          )
      print("PASS: G1-E9 source_score in G1SourceAuthority details for all 4 tiers")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1-E9 source_score in G1SourceAuthority details for all 4 tiers"

  # =========================================================================
  # G1 Extension: E10 ToS compliance  [added 2026-08-02 — e-features]
  # Code: src/autoinfo/quality.py:305-474 G1TosCompliance
  #       src/autoinfo/quality.py:328-333 _TIER_TOS_MAP
  #       src/autoinfo/quality.py:1794-1890 D2FormatIntegrity.tos_delivery_check
  # =========================================================================

  - name: "G1-E10: G1TosCompliance — open/licensed pass, restricted/sensitive flagged"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import G1TosCompliance
      from autoinfo.models import Item

      gate = G1TosCompliance()

      # open → passes
      r = gate.check(
          Item(id="tos-o", source_name="pubmed", title="T", content="c",
               collected_at="2026-01-01", quality_tier=1),
          {"tos_classification": "open", "quality_tier": 1},
      )
      assert r.passed and not r.flagged and r.details.get("tos_compliant") == True
      print("PASS: G1-E10 'open' — passes, tos_compliant=True")

      # licensed → passes
      r = gate.check(
          Item(id="tos-l", source_name="ap", title="T", content="c",
               collected_at="2026-01-01", quality_tier=2),
          {"tos_classification": "licensed", "quality_tier": 2},
      )
      assert r.passed and not r.flagged and r.details.get("tos_compliant") == True
      print("PASS: G1-E10 'licensed' — passes, tos_compliant=True")

      # restricted → flagged advisory
      r = gate.check(
          Item(id="tos-r", source_name="blog", title="T", content="c",
               collected_at="2026-01-01", quality_tier=3),
          {"tos_classification": "restricted", "quality_tier": 3},
      )
      assert r.flagged and r.details.get("tos_compliant") == False
      assert "compliance_warning" in r.details
      print("PASS: G1-E10 'restricted' — flagged, tos_compliant=False")

      # sensitive → flagged advisory
      r = gate.check(
          Item(id="tos-s", source_name="private", title="T", content="c",
               collected_at="2026-01-01", quality_tier=4),
          {"tos_classification": "sensitive", "quality_tier": 4},
      )
      assert r.flagged and r.details.get("tos_compliant") == False
      assert "compliance_warning" in r.details
      print("PASS: G1-E10 'sensitive' — flagged, tos_compliant=False")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1-E10 'open' — passes, tos_compliant=True"
        - "PASS: G1-E10 'licensed' — passes, tos_compliant=True"
        - "PASS: G1-E10 'restricted' — flagged, tos_compliant=False"
        - "PASS: G1-E10 'sensitive' — flagged, tos_compliant=False"

  - name: "G1-E10: D2FormatIntegrity.tos_delivery_check — RAW blocked, PROCESSED passes"
    tool: python
    command: |
      import sys, os
      os.chdir("${TEST_DIR}")
      from autoinfo.quality import D2FormatIntegrity

      checker = D2FormatIntegrity()

      # RAW with restricted → blocked
      r = checker.tos_delivery_check({
          "product_type": "raw",
          "entries": [{"tos_classification": "restricted", "entry_id": "x"}],
      })
      assert r.passed == False and r.details.get("tos_blocked") == True
      print("PASS: G1-E10 D2 RAW + restricted → blocked")

      # PROCESSED with restricted → passes with notice
      r = checker.tos_delivery_check({
          "product_type": "processed",
          "entries": [{"tos_classification": "restricted", "entry_id": "y"}],
      })
      assert r.passed == True and r.details.get("tos_compliance_notice") == True
      print("PASS: G1-E10 D2 PROCESSED + restricted → passes with notice")

      # No restricted → clean
      r = checker.tos_delivery_check({
          "product_type": "raw",
          "entries": [{"tos_classification": "open", "entry_id": "z"}],
      })
      assert r.passed == True and r.details.get("tos_blocked") == False
      print("PASS: G1-E10 D2 open only → clean pass")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: G1-E10 D2 RAW + restricted → blocked"
        - "PASS: G1-E10 D2 PROCESSED + restricted → passes with notice"
        - "PASS: G1-E10 D2 open only → clean pass"
