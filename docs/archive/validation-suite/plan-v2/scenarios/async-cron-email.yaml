# =============================================================================
# Scenario: async-cron-email
# Description: Verify async operations, cron schedules, email, webhooks, and alerting
# Tags: async, cron, email, webhook, alerting, regression
# =============================================================================

name: "Async Operations, Cron Schedules, Email, Webhooks, and Alerting"
description: >
  Tests async job_id polling pattern, cron schedule management (add/list/run/remove),
  email digest configuration, webhook setup and retrieval, and agent alerting rules.
  Covers CLI and MCP-based workflows. Steps marked [REQUIRES SMTP] need working
  SMTP config; they test command existence otherwise.

tier: 3
tags: [async, cron, email, webhook, alerting, regression, mcp]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-async"
  DOMAIN: "medical-research"

steps:
  - name: "Initialize project for async/cron tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "async-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"

  - name: "Async collection with domain-based progress polling"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo collect --domain ${DOMAIN} --limit 3 2>&1
      EXIT=$?
      [ ${EXIT} -eq 0 ] || exit ${EXIT}
      autoinfo status 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"

  - name: "MCP collect_sources async returns job_id"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; r=json.loads(asyncio.run(_ct('collect_sources',{'domain':'${DOMAIN}','limit':3,'async':True}))[0].text); print('JOB_ID='+str(r.get('job_id',''))); assert 'job_id' in r, 'No job_id'" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "JOB_ID="
      stdout_not_contains:
        - "Traceback"

  - name: "MCP get_collection_progress returns status"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; data=json.loads(asyncio.run(_ct('get_collection_progress',{'domain':'${DOMAIN}'}))[0].text); s=data.get('status','unknown'); print('STATUS='+str(s)); assert s is not None" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "STATUS="
      stdout_not_contains:
        - "Traceback"
        - "Error"

  - name: "Add cron schedule via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo cron add-schedule --name "weekly-digest" --expression "0 8 * * 1" --domain ${DOMAIN} 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"
        - "Error"

  - name: "List cron schedules via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo cron list-schedules 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"

  - name: "Run cron schedules and verify heartbeat file"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo cron run 2>&1
      HB=".autoinfo/cron-heartbeat.json"
      [ -f "${HB}" ] || exit 1
      python3 -c "import json; hb=json.load(open('${HB}')); assert 'schedules' in hb" 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"

  - name: "Remove cron schedule via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo cron remove-schedule --name "weekly-digest" 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"

  - name: "Set domain webhooks via MCP"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; d=json.loads(asyncio.run(_ct('set_domain_webhooks',{'domain':'${DOMAIN}','webhook_urls':['https://example.com/webhook'],'events':['item_collected']}))[0].text); print('SET_WEBHOOK='+json.dumps(d)[:200])" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "SET_WEBHOOK="
      stdout_not_contains:
        - "Traceback"
        - "Error"

  - name: "Get domain webhooks via MCP"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; d=json.loads(asyncio.run(_ct('get_domain_webhooks',{'domain':'${DOMAIN}'}))[0].text); print('GET_WEBHOOK='+json.dumps(d)[:200]); assert 'webhook_urls' in d" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "GET_WEBHOOK="
      stdout_not_contains:
        - "Traceback"

  - name: "Add agent alert rule via MCP"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; d=json.loads(asyncio.run(_ct('add_alert_rule',{'domain':'${DOMAIN}','name':'source-down-alert','condition':'source_health != ok','action':'log'}))[0].text); print('ADD_ALERT='+json.dumps(d)[:200])" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "ADD_ALERT="
      stdout_not_contains:
        - "Traceback"

  - name: "List alert rules via MCP"
    tool: bash
    command: |
      cd ${TEST_DIR}
      python3 -c "import asyncio,json; from autoinfo.mcp.server import call_tool as _ct; d=json.loads(asyncio.run(_ct('get_alert_rules',{'domain':'${DOMAIN}'}))[0].text); rules=d.get('rules',d.get('items',[])); print('ALERT_RULES_COUNT='+str(len(rules)))" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "ALERT_RULES_COUNT="
      stdout_not_contains:
        - "Traceback"

  - name: "[REQUIRES SMTP] Email config command exists and runs"
    tool: bash
    env_required:
      - AUTOINFO_SMTP_HOST
    command: |
      cd ${TEST_DIR}
      autoinfo email config 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"
