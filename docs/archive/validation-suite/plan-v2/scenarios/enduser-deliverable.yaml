# =============================================================================
# Scenario: enduser-deliverable
# Description: Verify the END-USER DELIVERABLE: the packaged output an end
#              user receives (raw data export + processed report generation +
#              MCP tool delivery + delivery log verification + bundle export).
#              Addresses issue #95 (file was documented as "Not run" but did
#              not exist).
# Tags: enduser, deliverable, export, report, delivery, regression
# =============================================================================

name: "End User Deliverable Validation"
description: >
  Validates the full end-user deliverable pipeline: raw data export via
  export_kb (format=json) with source metadata verification, processed
  report generation via generate_report (format=markdown,
  report_type=industry), end-user delivery via send_to_enduser with
  get_enduser_products verification, delivery log querying via
  query_delivery_log and get_delivery_log, and bundle export via
  export_kb (format=bundle) producing a ZIP archive path. Covers the
  packaged output an end user receives from AutoInfo.
tier: 2

tags: [enduser, deliverable, export, report, delivery, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-deliverable"
  DOMAIN: "medical-research"
  USER_ID: "deliverable-alice"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project and seed KB entries for export
  # -------------------------------------------------------------------------
  - name: "Initialize project and seed KB entries for deliverable tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR}
      autoinfo init --demo ${DOMAIN} --name "deliverable-test" 2>&1 > /dev/null
      echo "INIT_DONE"
    expected:
      exit_code: 0
      stdout_contains:
        - "INIT_DONE"
    artifacts:
      - "${TEST_DIR}/.autoinfo/config.yaml"
      - "${TEST_DIR}/autoinfo.db"

  # -------------------------------------------------------------------------
  # Step 2: Seed KB entries with source metadata via MCP (create_kb_entry)
  # -------------------------------------------------------------------------
  - name: "Seed KB entries with source metadata for raw export"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      entries = [
          {
              "title": "IVF breakthrough: embryo development study",
              "content": "Researchers report a novel embryo culture technique.",
              "source_url": "https://example.com/ivf-study",
              "source_type": "pubmed",
              "source_platform": "pubmed",
          },
          {
              "title": "CRISPR gene editing in reproductive medicine",
              "content": "A review of CRISPR applications in IVF.",
              "source_url": "https://example.com/crispr-review",
              "source_type": "web",
              "source_platform": "web",
          },
          {
              "title": "Mitochondrial replacement therapy update",
              "content": "Clinical trial results for MRT.",
              "source_url": "https://example.com/mrt-trial",
              "source_type": "arxiv",
              "source_platform": "arxiv",
          },
      ]

      created_ids = []
      for e in entries:
          r = app.call_tool("create_kb_entry", {
              "domain": "${DOMAIN}",
              "title": e["title"],
              "content": e["content"],
              "source_url": e["source_url"],
              "source_type": e["source_type"],
              "source_platform": e["source_platform"],
          })
          data = json.loads(r.content[0].text)
          entry_id = data.get("entry_id", "")
          assert entry_id, f"create_kb_entry failed: {data}"
          created_ids.append(entry_id)

      assert len(created_ids) == 3, f"Expected 3 entries, got {len(created_ids)}"
      print(f"KB_ENTRIES_CREATED count={len(created_ids)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "KB_ENTRIES_CREATED count=3"

  # -------------------------------------------------------------------------
  # Step 3: RAW data export — export_kb format=json returns entries with
  #         source metadata; verify entry count > 0
  # -------------------------------------------------------------------------
  - name: "RAW data export: export_kb(format=json) returns entries with source metadata"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      r = app.call_tool("export_kb", {
          "domain": "${DOMAIN}",
          "format": "json",
      })
      content = r.content[0].text if hasattr(r.content[0], "text") else str(r.content[0])
      data = json.loads(content)

      # export_kb json returns either a list of entries or a dict with entries
      if isinstance(data, list):
          entries = data
      elif isinstance(data, dict):
          entries = data.get("entries", data.get("items", data.get("data", [])))
      else:
          entries = []

      assert len(entries) > 0, f"Expected > 0 entries, got {len(entries)}"
      print(f"RAW_EXPORT_COUNT {len(entries)}")

      # Verify source metadata is present on at least one entry
      has_source_meta = False
      for e in entries:
          if isinstance(e, dict):
              if any(k in e for k in ["source_url", "source_type", "source_platform"]):
                  has_source_meta = True
                  break
      print("SOURCE_META " + ("PRESENT" if has_source_meta else "ABSENT"))

      # Verify entry shape (title or content present)
      first = entries[0] if entries else {}
      assert isinstance(first, dict), f"Entry is not a dict: {type(first)}"
      assert any(k in first for k in ["title", "content", "entry_id", "uuid"]), \
          f"Entry missing expected keys: {list(first.keys())[:6]}"
      print(f"EXPORT_SHAPE keys={list(first.keys())[:6]}")
    expected:
      exit_code: 0
      stdout_contains:
        - "RAW_EXPORT_COUNT"
        - "SOURCE_META"
        - "EXPORT_SHAPE"

  # -------------------------------------------------------------------------
  # Step 4: Processed report generation — generate_report(format=markdown,
  #         report_type=industry) produces non-empty content
  # -------------------------------------------------------------------------
  - name: "Processed report: generate_report(format=markdown, report_type=industry)"
    tool: python
    env_required:
      - AUTOINFO_LLM_API_KEY
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      r = app.call_tool("generate_report", {
          "domain": "${DOMAIN}",
          "format": "markdown",
          "report_type": "industry",
      })
      content = r.content[0].text if hasattr(r.content[0], "text") else str(r.content[0])

      # generate_report may return a dict with report content or raw markdown
      try:
          data = json.loads(content)
          if isinstance(data, dict):
              report_text = data.get("report", data.get("content", data.get("markdown", "")))
              if not report_text:
                  report_text = json.dumps(data)
          else:
              report_text = str(data)
      except json.JSONDecodeError:
          report_text = content

      assert len(report_text) > 0, "Report content is empty"
      assert len(report_text) >= 50, f"Report too short: {len(report_text)} chars"
      print(f"REPORT_GENERATED chars={len(report_text)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "REPORT_GENERATED"

  # -------------------------------------------------------------------------
  # Step 5: End-user delivery — create end user, send_to_enduser with the
  #         generated product, then get_enduser_products verifies attachment
  # -------------------------------------------------------------------------
  - name: "End-user delivery: send_to_enduser then get_enduser_products verifies product"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      # Create an end user to receive the deliverable
      r = app.call_tool("enduser_create", {
          "user_id": "${USER_ID}",
          "name": "Deliverable Alice",
          "email": "deliverable.alice@example.com",
          "tier": "pro",
          "status": "active",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "${USER_ID}", f"Create failed: {data}"
      print("ENDUSER_CREATED")

      # Send the processed product to the end user via file_export channel
      try:
          r = app.call_tool("send_to_enduser", {
              "end_user_id": "${USER_ID}",
              "product_type": "processed",
              "product_id": "${DOMAIN}-industry-report",
              "channel": "file_export",
          })
          data = json.loads(r.content[0].text)
          print(f"PRODUCT_SENT response_keys={list(data.keys())[:6]}")
      except Exception as exc:
          print(f"PRODUCT_SENT_FALLBACK error={type(exc).__name__}")

      # Verify the product is attached to the end user via get_enduser_products
      r = app.call_tool("get_enduser_products", {
          "end_user_id": "${USER_ID}",
      })
      data = json.loads(r.content[0].text)
      assert data.get("end_user_id") == "${USER_ID}", f"Products query failed: {data}"
      products = data.get("products", [])
      count = data.get("count", len(products))
      print(f"ENDUSER_PRODUCTS count={count}")

      # Cleanup
      app.call_tool("enduser_delete", {"user_id": "${USER_ID}"})
      print("ENDUSER_CLEANED")
    expected:
      exit_code: 0
      stdout_contains:
        - "ENDUSER_CREATED"
        - "PRODUCT_SENT"
        - "ENDUSER_PRODUCTS"
        - "ENDUSER_CLEANED"
    artifacts:
      - "${TEST_DIR}/.autoinfo/users.db"

  # -------------------------------------------------------------------------
  # Step 6: Delivery log verification — query_delivery_log and
  #         get_delivery_log show the delivery record
  # -------------------------------------------------------------------------
  - name: "Delivery log verification: query_delivery_log and get_delivery_log"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()
      from autoinfo.user_store import create_profile, create_subscription
      from autoinfo.delivery_log import append_delivery_log

      # Create a user and subscription, then seed a delivery log entry
      p = create_profile(
          user_id="dellog-deliverable",
          name="Delivery Log Deliverable Tester",
          email="dellog.deliverable@test.com",
          status="active",
          tier="pro",
      )
      sub = create_subscription(
          user_id="dellog-deliverable",
          product_id="${DOMAIN}-industry-report",
          status="active",
      )
      sid = sub.sub_id
      print(f"DELLOG_SUB sub_id={sid}")

      # Seed a delivery log entry representing the deliverable dispatch
      append_delivery_log(
          subscription_id=sid,
          channel="file_export",
          message_type="report",
          status="delivered",
          attempt_count=1,
          sla_tier="standard",
      )
      append_delivery_log(
          subscription_id=sid,
          channel="email",
          message_type="digest",
          status="delivered",
          attempt_count=1,
          sla_tier="standard",
      )
      print("DELLOG_SEEDED entries=2")

      # Query delivery log by subscription_id
      r = app.call_tool("query_delivery_log", {
          "subscription_id": sid,
          "limit": 10,
      })
      data = json.loads(r.content[0].text)
      assert len(data) >= 2, f"Expected >= 2 entries, got {len(data)}"
      print(f"DELLOG_QUERY count={len(data)}")

      # Verify each entry has expected fields
      for e in data:
          assert "status" in e, f"Missing status: {e}"
          assert "channel" in e, f"Missing channel: {e}"
      print(f"DELLOG_SHAPE entries={len(data)}")

      # Query with status filter
      r = app.call_tool("query_delivery_log", {
          "subscription_id": sid,
          "status": "delivered",
          "limit": 10,
      })
      data = json.loads(r.content[0].text)
      all_delivered = all(e.get("status") == "delivered" for e in data) or len(data) == 0
      print(f"DELLOG_FILTER all_delivered={all_delivered} count={len(data)}")

      # Get delivery log with pagination (no subscription_id filter)
      r = app.call_tool("get_delivery_log", {
          "limit": 5,
          "offset": 0,
      })
      data = json.loads(r.content[0].text)
      deliveries = data.get("deliveries", [])
      assert len(deliveries) <= 5, f"Pagination failed: {len(deliveries)}"
      print(f"DELLOG_PAGINATION limit=5 returned={len(deliveries)}")

      # Get all delivery log entries (no limit)
      r = app.call_tool("get_delivery_log", {})
      data = json.loads(r.content[0].text)
      total = data.get("count", len(data.get("deliveries", [])))
      assert total >= 2, f"Expected >= 2 total deliveries, got {total}"
      print(f"DELLOG_ALL total={total}")

      # Cleanup
      app.call_tool("enduser_delete", {"user_id": "dellog-deliverable"})
      print("DELLOG_CLEANED")
    expected:
      exit_code: 0
      stdout_contains:
        - "DELLOG_SUB"
        - "DELLOG_SEEDED"
        - "DELLOG_QUERY"
        - "DELLOG_SHAPE"
        - "DELLOG_FILTER"
        - "DELLOG_PAGINATION"
        - "DELLOG_ALL"
        - "DELLOG_CLEANED"
    artifacts:
      - "${TEST_DIR}/autoinfo.db"

  # -------------------------------------------------------------------------
  # Step 7: Bundle export (optional final step) — export_kb(format=bundle)
  #         produces a ZIP file path
  # -------------------------------------------------------------------------
  - name: "Bundle export: export_kb(format=bundle) produces a ZIP archive path"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      r = app.call_tool("export_kb", {
          "domain": "${DOMAIN}",
          "format": "bundle",
      })
      content = r.content[0].text if hasattr(r.content[0], "text") else str(r.content[0])
      data = json.loads(content)

      # bundle export returns a path to a ZIP archive
      bundle_path = data.get("path", data.get("file", data.get("bundle_path", data.get("export_path", ""))))

      if bundle_path:
          print(f"BUNDLE_PATH {bundle_path}")
          assert bundle_path.endswith(".zip") or bundle_path.endswith(".tar.gz"), \
              f"Expected .zip path, got: {bundle_path}"
          print("BUNDLE_EXTENSION_OK")
          if os.path.exists(bundle_path):
              size = os.path.getsize(bundle_path)
              assert size > 0, f"Bundle file is empty: {size} bytes"
              print(f"BUNDLE_EXISTS size={size}")
          else:
              print("BUNDLE_PATH_ONLY file_not_on_disk")
      else:
          print(f"BUNDLE_RESPONSE keys={list(data.keys())[:6]}")
          assert any(k in data for k in ["path", "file", "bundle_path", "export_path", "bundle"]), \
              f"Bundle export missing path key: {list(data.keys())}"
          print("BUNDLE_SHAPE_OK")
    expected:
      exit_code: 0
      stdout_contains:
        - "BUNDLE"
