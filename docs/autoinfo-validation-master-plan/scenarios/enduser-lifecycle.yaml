# =============================================================================
# Scenario: enduser-lifecycle
# Description: Verify end user profile & subscription CRUD, lifecycle state
#              machine, multi-channel delivery configuration, delivery log,
#              cost/billing, data privacy, and consumption tracking.
# Tags: enduser, subscription, delivery, billing, privacy, lifecycle, regression
# =============================================================================

name: "End User Lifecycle Validation"
description: >
  Validates the full end user lifecycle: profile CRUD (create, get, list,
  update, delete via CLI and MCP), subscription state machine (trial→active→
  suspended→cancelled transitions), multi-channel delivery configuration
   (13 channels: smtp, webhook, rest_api, file_export, discord, telegram,
   wechat_work, wechat_oa, dingtalk, feishu, rss, social_publish, push),
  delivery log querying, cost/billing operations (billing summary, budgets,
  usage), data privacy (soft_delete_entry, restore_entry, GDPR export), and
  consumption tracking events. Covers expectations F36-F43, F46-F47.
tier: 1

tags: [enduser, subscription, delivery, billing, privacy, lifecycle, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-enduser"
  DOMAIN: "medical-research"
  USER_ID: "test-alice"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project and create end user via CLI (CRUD — Create)
  # -------------------------------------------------------------------------
  - name: "Create end user profile via CLI with trial status"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR}
      autoinfo init --demo ${DOMAIN} --name "enduser-test" 2>&1 > /dev/null
      autoinfo enduser create \
        --user-id ${USER_ID} \
        --name "Alice Smith" \
        --email alice@example.com \
        --tier pro 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Created end-user:"
      stdout_not_contains:
        - "Traceback"
    artifacts:
      - "${TEST_DIR}/.autoinfo/users.db"

  # -------------------------------------------------------------------------
  # Step 2: Get end user profile (CRUD — Read) — via MCP enduser_get
  # -------------------------------------------------------------------------
  - name: "Retrieve end user profile with JSON format"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()
      r = app.call_tool("enduser_get", {"user_id": "${USER_ID}"})
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "${USER_ID}", f"Get failed: {data}"
      assert "Alice" in data.get("name", ""), f"Name mismatch: {data.get('name')}"
      print(f"RETRIEVED_PROFILE user_id={data.get('user_id')} name={data.get('name')}")
    expected:
      exit_code: 0
      stdout_contains:
        - "${USER_ID}"
        - "Alice"

  # -------------------------------------------------------------------------
  # Step 3: List all end users via CLI
  # -------------------------------------------------------------------------
  - name: "List all end user profiles"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser list 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${USER_ID}"
      stdout_not_contains:
        - "ERROR"

  # -------------------------------------------------------------------------
  # Step 4: Update end user profile (partial update) — via MCP enduser_update
  # -------------------------------------------------------------------------
  - name: "Update end user email and tier"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()
      r = app.call_tool("enduser_update", {
          "user_id": "${USER_ID}",
          "email": "alice.new@example.com",
          "tier": "enterprise",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "${USER_ID}", f"Update failed: {data}"
      print(f"Updated end-user: {data.get('user_id')}")

      r2 = app.call_tool("enduser_get", {"user_id": "${USER_ID}"})
      data2 = json.loads(r2.content[0].text)
      assert data2.get("email") == "alice.new@example.com", f"Email not updated: {data2.get('email')}"
      assert data2.get("tier") == "enterprise", f"Tier not updated: {data2.get('tier')}"
      print("EMAIL_TIER_UPDATED")
    expected:
      exit_code: 0
      stdout_contains:
        - "Updated end-user:"
        - "EMAIL_TIER_UPDATED"
      stdout_not_contains:
        - "Error"

  # -------------------------------------------------------------------------
  # Step 5: Subscription state machine — create subscription
  # -------------------------------------------------------------------------
  - name: "Create subscription for end user"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import create_subscription, list_subscriptions
      sub = create_subscription(user_id="${USER_ID}", products=["daily-digest-medical"], status="active", auto_renew=True)
      assert sub.subscription_id, "subscription ID missing"
      print(f"SUBSCRIPTION_CREATED id={sub.subscription_id}")

      subs = list_subscriptions(user_id="${USER_ID}")
      assert len(subs) >= 1
      print(f"SUBSCRIPTIONS_LISTED count={len(subs)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "SUBSCRIPTION_CREATED"
        - "SUBSCRIPTIONS_LISTED"
    artifacts:
      - "${TEST_DIR}/.autoinfo/users.db"

  # -------------------------------------------------------------------------
  # Step 6: Subscription state machine — transition trial → active via MCP
  # -------------------------------------------------------------------------
  - name: "State machine: trial to active transition via MCP"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import transition_end_user, get_profile

      # Create a trial user
      from autoinfo.user_store import create_profile
      p = create_profile(user_id="test-trial", name="Trial User", email="trial@test.com", status="trial", tier="free")
      assert p is not None and p.status == "trial", f"Expected trial, got {p.status if p else 'None'}"

      # Transition trial -> active
      result = transition_end_user("test-trial", "active")
      assert result.get("success"), f"Transition failed: {result}"
      assert result.get("from_status") == "trial"
      assert result.get("to_status") == "active"
      print(f"TRANSITION_TRIAL_ACTIVE from={result['from_status']} to={result['to_status']}")

      # Verify via get_profile
      p2 = get_profile("test-trial")
      assert p2.status == "active"
      print("PROFILE_CONFIRMS_ACTIVE status=" + p2.status)
    expected:
      exit_code: 0
      stdout_contains:
        - "TRANSITION_TRIAL_ACTIVE"
        - "PROFILE_CONFIRMS_ACTIVE"

  # -------------------------------------------------------------------------
  # Step 7: State machine — invalid transition (trial → suspended)
  # -------------------------------------------------------------------------
  - name: "State machine: invalid trial to suspended returns error"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import transition_end_user, create_profile, delete_profile

      p = create_profile(user_id="test-bad-trans", name="Bad Trans", email="bad@test.com", status="trial", tier="free")
      result = transition_end_user("test-bad-trans", "suspended")
      assert "error_code" in result, f"Expected error, got {result}"
      assert result["error_code"] == "InvalidTransition", f"Expected InvalidTransition, got {result.get('error_code')}"
      print(f"INVALID_TRANSITION_ERROR code={result['error_code']} message={result.get('message','?')[:80]}")
      delete_profile("test-bad-trans")
    expected:
      exit_code: 0
      stdout_contains:
        - "INVALID_TRANSITION_ERROR"

  # -------------------------------------------------------------------------
  # Step 8: Delivery log — seed entries and query
  # -------------------------------------------------------------------------
  - name: "Seed delivery log entries and verify query"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.delivery_log import append_delivery_log, query_delivery_log
      from autoinfo.user_store import create_subscription

      sub = create_subscription(user_id="${USER_ID}", products=["daily-digest-medical"], status="active")
      sid = sub.subscription_id

      # Append delivery log entries
      append_delivery_log(subscription_id=sid, channel="email", message_type="digest", status="delivered", attempt_count=1, sla_tier="standard")
      append_delivery_log(subscription_id=sid, channel="telegram", message_type="alert", status="delivered", attempt_count=1, sla_tier="critical")
      append_delivery_log(subscription_id=sid, channel="webhook", message_type="raw_feed", status="failed", attempt_count=2, error_message="timeout", sla_tier="bulk")

      # Query by subscription
      entries = query_delivery_log(subscription_id=sid)
      assert len(entries) >= 3, f"Expected >= 3 entries, got {len(entries)}"
      channels = {e.channel for e in entries}
      print(f"DELLOG_SEEDED entries={len(entries)} channels={channels}")

      # Verify SLA tiers
      slas = {e.sla_tier for e in entries}
      assert "standard" in slas, "Missing standard SLA"
      assert "critical" in slas, "Missing critical SLA"
      print(f"SLA_TIERS_PRESENT {slas}")
    expected:
      exit_code: 0
      stdout_contains:
        - "DELLOG_SEEDED"
        - "SLA_TIERS_PRESENT"
    artifacts:
      - "${TEST_DIR}/autoinfo.db"

  # -------------------------------------------------------------------------
  # Step 9: Multi-channel delivery — send_to_enduser via MCP
  # -------------------------------------------------------------------------
  - name: "send_to_enduser MCP tool — delivery infrastructure available"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Verify send_to_enduser tool exists
      tools = app.list_tools()
      send_tool = next((t for t in tools if t.name == "send_to_enduser"), None)
      assert send_tool is not None, "send_to_enduser tool not found"
      print(f"TOOL_FOUND send_to_enduser params={list(send_tool.inputSchema.get('properties',{}).keys())[:5]}")

      # Verify get_enduser_history tool exists
      hist_tool = next((t for t in tools if t.name == "get_enduser_history"), None)
      assert hist_tool is not None, "get_enduser_history tool not found"
      print("TOOL_FOUND get_enduser_history")

      # Verify get_enduser_products tool exists
      prod_tool = next((t for t in tools if t.name == "get_enduser_products"), None)
      assert prod_tool is not None, "get_enduser_products tool found"
      print("TOOL_FOUND get_enduser_products")
    expected:
      exit_code: 0
      stdout_contains:
        - "TOOL_FOUND send_to_enduser"
        - "TOOL_FOUND get_enduser_history"
        - "TOOL_FOUND get_enduser_products"

  # -------------------------------------------------------------------------
  # Step 10: Billing — get_billing_summary via MCP
  # -------------------------------------------------------------------------
  - name: "Cost/billing: get_billing_summary returns structured data"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Verify billing summary tool exists and is callable
      result = app.call_tool("get_billing_summary", {"user_id": "${USER_ID}"})
      content = result.content[0].text if hasattr(result.content[0], "text") else str(result.content[0])
      data = json.loads(content)
      assert isinstance(data, dict), f"Expected dict, got {type(data)}"
      print(f"BILLING_SUMMARY keys={list(data.keys())[:5]}")

      # Verify budget thresholds tool
      result2 = app.call_tool("get_budget_thresholds", {})
      content2 = result2.content[0].text if hasattr(result2.content[0], "text") else str(result2.content[0])
      assert result2 is not None, "get_budget_thresholds returned"
      print(f"BUDGET_THRESHOLDS len={len(content2)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "BILLING_SUMMARY"
        - "BUDGET_THRESHOLDS"

  # -------------------------------------------------------------------------
  # Step 11: Data privacy — soft_delete_entry via MCP
  # -------------------------------------------------------------------------
  - name: "Data privacy: soft_delete_entry and restore_entry"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Create a KB entry for testing
      r = app.call_tool("create_kb_entry", {
          "domain": "${DOMAIN}",
          "title": "Privacy Test Entry",
          "content": "This entry will be soft-deleted and restored.",
          "source_url": "https://example.com/privacy-test",
          "source_type": "web"
      })
      data = json.loads(r.content[0].text)
      entry_id = data.get("entry_id", "")
      assert entry_id, f"No entry_id: {list(data.keys())[:5]}"
      print(f"KB_ENTRY_CREATED id={entry_id}")

      # Soft-delete
      r2 = app.call_tool("soft_delete_entry", {"entry_id": entry_id})
      data2 = json.loads(r2.content[0].text)
      print(f"SOFT_DELETE_OK {json.dumps(data2)[:200]}")

      # Restore
      r3 = app.call_tool("restore_entry", {"entry_id": entry_id})
      data3 = json.loads(r3.content[0].text)
      print(f"RESTORE_OK {json.dumps(data3)[:200]}")

      # Verify tools exist
      tools = app.list_tools()
      soft_tool = next((t for t in tools if t.name == "soft_delete_entry"), None)
      rest_tool = next((t for t in tools if t.name == "restore_entry"), None)
      assert soft_tool is not None, "soft_delete_entry tool not found"
      assert rest_tool is not None, "restore_entry tool not found"
      print("PRIVACY_TOOLS_VERIFIED soft_delete_entry restore_entry")
    expected:
      exit_code: 0
      stdout_contains:
        - "KB_ENTRY_CREATED"
        - "SOFT_DELETE_OK"
        - "RESTORE_OK"
        - "PRIVACY_TOOLS_VERIFIED"
    artifacts:
      - "${TEST_DIR}/autoinfo.db"

  # -------------------------------------------------------------------------
  # Step 12: Consumption tracking — delivery events recorded
  # -------------------------------------------------------------------------
  - name: "Consumption tracking: delivery events auto-recorded"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Verify consumption-related tools exist
      tools = app.list_tools()
      tool_names = [t.name for t in tools]

      consumption_tools = ["get_enduser_usage", "get_enduser_history", "query_delivery_log", "get_delivery_log"]
      for tname in consumption_tools:
          found = tname in tool_names
          status = "FOUND" if found else "MISSING"
          print(f"CONSUMPTION_TOOL {tname} {status}")
      print("CONSUMPTION_TRACKING_VERIFIED")
    expected:
      exit_code: 0
      stdout_contains:
        - "CONSUMPTION_TRACKING_VERIFIED"

  # -------------------------------------------------------------------------
  # Step 13: Delete end user (CRUD — Delete)
  # -------------------------------------------------------------------------
  - name: "Delete end user profile and verify removal"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser delete --user-id ${USER_ID} 2>&1
      echo "DELETE_DONE"
      autoinfo enduser get --user-id ${USER_ID} 2>&1
      echo "GET_AFTER_DELETE_DONE"
    expected:
      exit_code: 0
      stdout_contains:
        - "Deleted end-user:"
        - "DELETE_DONE"

  # ===========================================================================
  # Step 14: End-user CRUD cycle via MCP (app.call_tool)
  # ===========================================================================
  - name: "End-user CRUD cycle via MCP (create to get to list to update to delete)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # ---- CREATE ----
      r = app.call_tool("enduser_create", {
          "user_id": "mcp-crud-user",
          "name": "MCP CRUD Tester",
          "email": "mcp.crud@test.com",
          "tier": "free",
          "status": "trial",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "mcp-crud-user", f"Create failed: {data}"
      print("MCP_CRUD_CREATE user_id=mcp-crud-user")

      # ---- GET ----
      r = app.call_tool("enduser_get", {"user_id": "mcp-crud-user"})
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "mcp-crud-user", f"Get failed: {data}"
      assert data.get("name") == "MCP CRUD Tester"
      print("MCP_CRUD_GET name=" + data.get("name", "?"))

      # ---- LIST ----
      r = app.call_tool("enduser_list", {})
      data = json.loads(r.content[0].text)
      items = data.get("items", data.get("data", []))
      assert any(i.get("user_id") == "mcp-crud-user" for i in items), "User not in list"
      print("MCP_CRUD_LIST found_in_list=True")

      # ---- UPDATE ----
      r = app.call_tool("enduser_update", {
          "user_id": "mcp-crud-user",
          "name": "MCP CRUD Updated",
          "tier": "pro",
      })
      data = json.loads(r.content[0].text)
