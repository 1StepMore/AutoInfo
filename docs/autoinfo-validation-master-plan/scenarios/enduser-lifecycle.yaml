# =============================================================================
# Scenario: enduser-lifecycle
# Description: Verify end user profile & subscription CRUD, lifecycle state
#              machine, multi-channel delivery configuration, delivery log,
#              cost/billing, data privacy, and consumption tracking.
# Tags: enduser, subscription, delivery, billing, privacy, lifecycle, regression
# =============================================================================

name: "End User Lifecycle Validation"
description: >
  Validates the full end user lifecycle: profile CRUD (create, get, list,
  update, delete via CLI and MCP), subscription state machine (trial→active→
  suspended→cancelled transitions), multi-channel delivery configuration
  (12 channels: smtp, webhook, rest_api, file_export, discord, telegram,
  wechat_work, wechat_oa, dingtalk, feishu, rss, social_publish),
  delivery log querying, cost/billing operations (billing summary, budgets,
  usage), data privacy (soft_delete_entry, restore_entry, GDPR export), and
  consumption tracking events. Covers expectations F36-F43, F46-F47.

tags: [enduser, subscription, delivery, billing, privacy, lifecycle, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-enduser"
  DOMAIN: "medical-research"
  USER_ID: "test-alice"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project and create end user via CLI (CRUD — Create)
  # -------------------------------------------------------------------------
  - name: "Create end user profile via CLI with trial status"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR}
      autoinfo init --demo ${DOMAIN} --name "enduser-test" 2>&1 > /dev/null
      autoinfo enduser create \
        --user-id ${USER_ID} \
        --name "Alice Smith" \
        --email alice@example.com \
        --tier pro 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"
    artifacts:
      - "${TEST_DIR}/.autoinfo/users.db"

  # -------------------------------------------------------------------------
  # Step 2: Get end user profile via CLI (CRUD — Read)
  # -------------------------------------------------------------------------
  - name: "Retrieve end user profile via CLI with JSON format"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser get --user-id ${USER_ID} --json 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${USER_ID}"
        - "Alice"

  # -------------------------------------------------------------------------
  # Step 3: List all end users via CLI
  # -------------------------------------------------------------------------
  - name: "List all end user profiles"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser list 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${USER_ID}"
      stdout_not_contains:
        - "ERROR"

  # -------------------------------------------------------------------------
  # Step 4: Update end user profile (partial update)
  # -------------------------------------------------------------------------
  - name: "Update end user email and tier"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser update --user-id ${USER_ID} --email alice.new@example.com --tier enterprise 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
    post_checks:
      - description: "Email and tier updated in profile"
        command: |
          cd ${TEST_DIR} && autoinfo enduser get --user-id ${USER_ID} --json 2>&1 | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('email') == 'alice.new@example.com', f'Email not updated: {data.get(\"email\")}'
          assert data.get('tier') == 'enterprise', f'Tier not updated: {data.get(\"tier\")}'
          print('PASS: email and tier updated')
          "
        expected_stdout:
          - "PASS: email and tier updated"

  # -------------------------------------------------------------------------
  # Step 5: Subscription state machine — create subscription
  # -------------------------------------------------------------------------
  - name: "Create subscription for end user"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import create_subscription, list_subscriptions
      sub = create_subscription(user_id="${USER_ID}", product_id="daily-digest-medical", status="active", auto_renew=True)
      assert sub.sub_id, "subscription ID missing"
      print(f"PASS: subscription created id={sub.sub_id}")

      subs = list_subscriptions(user_id="${USER_ID}")
      assert len(subs) >= 1
      print(f"PASS: list_subscriptions count={len(subs)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: subscription created"
        - "PASS: list_subscriptions"

  # -------------------------------------------------------------------------
  # Step 6: Subscription state machine — transition trial → active via MCP
  # -------------------------------------------------------------------------
  - name: "State machine: trial → active transition via MCP"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import transition_end_user, get_profile

      # Create a trial user
      from autoinfo.user_store import create_profile
      p = create_profile(user_id="test-trial", name="Trial User", email="trial@test.com", status="trial", tier="free")
      assert p is not None and p.status == "trial", f"Expected trial, got {p.status if p else 'None'}"

      # Transition trial → active
      result = transition_end_user("test-trial", "active")
      assert result.get("success"), f"Transition failed: {result}"
      assert result.get("from_status") == "trial"
      assert result.get("to_status") == "active"
      print(f"PASS: trial→active transition OK from={result['from_status']} to={result['to_status']}")

      # Verify via get_profile
      p2 = get_profile("test-trial")
      assert p2.status == "active"
      print("PASS: get_profile confirms active status")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: trial→active transition OK"

  # -------------------------------------------------------------------------
  # Step 7: State machine — invalid transition (trial → suspended)
  # -------------------------------------------------------------------------
  - name: "State machine: invalid trial → suspended returns error"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.user_store import transition_end_user, create_profile, delete_profile

      p = create_profile(user_id="test-bad-trans", name="Bad Trans", email="bad@test.com", status="trial", tier="free")
      result = transition_end_user("test-bad-trans", "suspended")
      assert "error_code" in result, f"Expected error, got {result}"
      assert result["error_code"] == "InvalidTransition", f"Expected InvalidTransition, got {result.get('error_code')}"
      print(f"PASS: InvalidTransition error: {result.get('message','?')[:80]}")
      delete_profile("test-bad-trans")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: InvalidTransition error"

  # -------------------------------------------------------------------------
  # Step 8: Delivery log — seed entries and query
  # -------------------------------------------------------------------------
  - name: "Seed delivery log entries and verify query"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.delivery_log import append_delivery_log, query_delivery_log
      from autoinfo.user_store import create_subscription

      sub = create_subscription(user_id="${USER_ID}", product_id="daily-digest-medical", status="active")
      sid = sub.sub_id

      # Append delivery log entries
      append_delivery_log(subscription_id=sid, channel="email", message_type="digest", status="delivered", attempt_count=1, sla_tier="standard")
      append_delivery_log(subscription_id=sid, channel="telegram", message_type="alert", status="delivered", attempt_count=1, sla_tier="critical")
      append_delivery_log(subscription_id=sid, channel="webhook", message_type="raw_feed", status="failed", attempt_count=2, error_message="timeout", sla_tier="bulk")

      # Query by subscription
      entries = query_delivery_log(subscription_id=sid)
      assert len(entries) >= 3, f"Expected >= 3 entries, got {len(entries)}"
      channels = {e.channel for e in entries}
      print(f"PASS: delivery log has {len(entries)} entries across channels {channels}")

      # Verify SLA tiers
      slas = {e.sla_tier for e in entries}
      assert "standard" in slas, "Missing standard SLA"
      assert "critical" in slas, "Missing critical SLA"
      print(f"PASS: SLA tiers present: {slas}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: delivery log has"
        - "PASS: SLA tiers present"

  # -------------------------------------------------------------------------
  # Step 9: Multi-channel delivery — send_to_enduser via MCP
  # -------------------------------------------------------------------------
  - name: "send_to_enduser MCP tool — delivery infrastructure available"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Verify send_to_enduser tool exists
      tools = app.list_tools()()
      send_tool = next((t for t in tools if t.name == "send_to_enduser"), None)
      assert send_tool is not None, "send_to_enduser tool not found"
      print(f"PASS: send_to_enduser tool found, params={list(send_tool.inputSchema.get('properties',{}).keys())[:5]}")

      # Verify get_enduser_history tool exists
      hist_tool = next((t for t in tools if t.name == "get_enduser_history"), None)
      assert hist_tool is not None, "get_enduser_history tool not found"
      print("PASS: get_enduser_history tool found")

      # Verify get_enduser_products tool exists
      prod_tool = next((t for t in tools if t.name == "get_enduser_products"), None)
      assert prod_tool is not None, "get_enduser_products tool found"
      print("PASS: get_enduser_products tool found")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: send_to_enduser tool found"
        - "PASS: get_enduser_history tool found"
        - "PASS: get_enduser_products tool found"

  # -------------------------------------------------------------------------
  # Step 10: Billing — get_billing_summary via MCP
  # -------------------------------------------------------------------------
  - name: "Cost/billing: get_billing_summary returns structured data"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Verify billing summary tool exists and is callable
      result = app.call_tool("get_billing_summary", {"user_id": "${USER_ID}"})
      content = result.content[0].text if hasattr(result.content[0], "text") else str(result.content[0])
      data = json.loads(content)
      assert isinstance(data, dict), f"Expected dict, got {type(data)}"
      print(f"PASS: get_billing_summary returned keys={list(data.keys())[:5]}")

      # Verify budget thresholds tool
      result2 = app.call_tool("get_budget_thresholds", {})
      content2 = result2.content[0].text if hasattr(result2.content[0], "text") else str(result2.content[0])
      print(f"PASS: get_budget_thresholds response len={len(content2)}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: get_billing_summary"
        - "PASS: get_budget_thresholds"

  # -------------------------------------------------------------------------
  # Step 11: Data privacy — soft_delete_entry via MCP
  # -------------------------------------------------------------------------
  - name: "Data privacy: soft_delete_entry and restore_entry"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create a KB entry for testing
      r = app.call_tool("create_kb_entry", {
          "domain": "${DOMAIN}",
          "title": "Privacy Test Entry",
          "content": "This entry will be soft-deleted and restored.",
          "source_url": "https://example.com/privacy-test",
          "source_type": "web",
          "source_platform": "test"
      })
      data = json.loads(r.content[0].text)
      entry_id = data.get("entry_id", "")
      assert entry_id, f"No entry_id: {list(data.keys())[:5]}"
      print(f"PASS: KB entry created: {entry_id}")

      # Soft-delete
      r2 = app.call_tool("soft_delete_entry", {"entry_id": entry_id})
      data2 = json.loads(r2.content[0].text)
      print(f"PASS: soft_delete response: {json.dumps(data2)[:200]}")

      # Restore
      r3 = app.call_tool("restore_entry", {"entry_id": entry_id})
      data3 = json.loads(r3.content[0].text)
      print(f"PASS: restore response: {json.dumps(data3)[:200]}")

      # Verify tools exist
      tools = app.list_tools()()
      soft_tool = next((t for t in tools if t.name == "soft_delete_entry"), None)
      rest_tool = next((t for t in tools if t.name == "restore_entry"), None)
      assert soft_tool is not None, "soft_delete_entry tool not found"
      assert rest_tool is not None, "restore_entry tool not found"
      print("PASS: soft_delete_entry and restore_entry tools verified")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: soft_delete_entry and restore_entry tools verified"

  # -------------------------------------------------------------------------
  # Step 12: Consumption tracking — delivery events recorded
  # -------------------------------------------------------------------------
  - name: "Consumption tracking: delivery events auto-recorded"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Verify consumption-related tools exist
      tools = app.list_tools()()
      tool_names = [t.name for t in tools]

      # Check for consumption/usage-related tools
      consumption_tools = ["get_enduser_usage", "get_enduser_history", "query_delivery_log", "get_delivery_log"]
      for tname in consumption_tools:
          found = tname in tool_names
          if found:
              print(f"PASS: {tname} tool found")
          else:
              print(f"WARN: {tname} tool not found in registry")
      print("PASS: consumption tracking tools verified")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: consumption tracking tools verified"

  # -------------------------------------------------------------------------
  # Step 13: Delete end user (CRUD — Delete)
  # -------------------------------------------------------------------------
  - name: "Delete end user profile and verify removal"
    tool: bash
    command: |
      cd ${TEST_DIR}
      autoinfo enduser delete --user-id ${USER_ID} 2>&1
      echo "DELETE_EXIT:$?"
      autoinfo enduser get --user-id ${USER_ID} 2>&1
      echo "GET_EXIT:$?"
    expected:
      exit_code: 0
      stdout_contains:
        - "DELETE_EXIT:0"

  # ===========================================================================
  # Step 14: End-user CRUD cycle via MCP (app.call_tool)
  # ===========================================================================
  - name: "End-user CRUD cycle via MCP (create → get → list → update → delete)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # ---- CREATE ----
      r = app.call_tool("enduser_create", {
          "user_id": "mcp-crud-user",
          "name": "MCP CRUD Tester",
          "email": "mcp.crud@test.com",
          "tier": "free",
          "status": "trial",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "mcp-crud-user", f"Create failed: {data}"
      print("PASS:MCP-CRUD-CREATE")

      # ---- GET ----
      r = app.call_tool("enduser_get", {"user_id": "mcp-crud-user"})
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "mcp-crud-user", f"Get failed: {data}"
      assert data.get("name") == "MCP CRUD Tester"
      print("PASS:MCP-CRUD-GET")

      # ---- LIST ----
      r = app.call_tool("enduser_list", {})
      data = json.loads(r.content[0].text)
      items = data.get("items", data.get("data", []))
      assert any(i.get("user_id") == "mcp-crud-user" for i in items), "User not in list"
      print("PASS:MCP-CRUD-LIST")

      # ---- UPDATE ----
      r = app.call_tool("enduser_update", {
          "user_id": "mcp-crud-user",
          "name": "MCP CRUD Updated",
          "tier": "pro",
      })
      data = json.loads(r.content[0].text)
      assert data.get("name") == "MCP CRUD Updated", f"Update name failed: {data}"
      assert data.get("tier") == "pro", f"Update tier failed: {data}"
      print("PASS:MCP-CRUD-UPDATE")

      # ---- DELETE ----
      r = app.call_tool("enduser_delete", {"user_id": "mcp-crud-user"})
      data = json.loads(r.content[0].text)
      assert data.get("deleted") == True, f"Delete failed: {data}"
      print("PASS:MCP-CRUD-DELETE")

      # ---- GET after delete (should return error) ----
      r = app.call_tool("enduser_get", {"user_id": "mcp-crud-user"})
      data = json.loads(r.content[0].text)
      assert data.get("error_code") is not None, f"Get after delete should fail: {data}"
      print("PASS:MCP-CRUD-DELETE-VERIFY")

      print("PASS:MCP-ENDUSER-CRUD-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:MCP-CRUD-CREATE"
        - "PASS:MCP-CRUD-GET"
        - "PASS:MCP-CRUD-LIST"
        - "PASS:MCP-CRUD-UPDATE"
        - "PASS:MCP-CRUD-DELETE"
        - "PASS:MCP-CRUD-DELETE-VERIFY"
        - "PASS:MCP-ENDUSER-CRUD-COMPLETE"

  # ===========================================================================
  # Step 15: Trial lifecycle via MCP (activate_trial + check_trial_expiry)
  # ===========================================================================
  - name: "Trial lifecycle via MCP (activate_trial → check_trial_expiry)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create a fresh trial user
      r = app.call_tool("enduser_create", {
          "user_id": "trial-mcp-user",
          "name": "Trial MCP Tester",
          "email": "trial.mcp@test.com",
          "tier": "free",
          "status": "active",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "trial-mcp-user"
      print("PASS:TRIAL-USER-CREATED")

      # Activate trial with custom days
      r = app.call_tool("activate_trial", {
          "end_user_id": "trial-mcp-user",
          "days": 30,
      })
      data = json.loads(r.content[0].text)
      # activate_trial should return success with trial info
      print(f"PASS:TRIAL-ACTIVATED keys={list(data.keys())[:8]}")

      # Check trial expiry
      r = app.call_tool("check_trial_expiry", {
          "end_user_id": "trial-mcp-user",
      })
      data = json.loads(r.content[0].text)
      # Should have days_remaining, status, trial_started_at, trial_days
      assert "days_remaining" in data, f"Missing days_remaining: {list(data.keys())[:8]}"
      assert "status" in data, f"Missing status: {list(data.keys())}"
      remaining = data["days_remaining"]
      assert remaining > 0, f"Expected positive days_remaining, got {remaining}"
      assert data.get("trial_days") == 30 or data.get("trial_days") is not None, f"trial_days: {data.get('trial_days')}"
      print(f"PASS:TRIAL-EXPIRY-CHECK days_remaining={remaining} status={data.get('status')} trial_days={data.get('trial_days')}")

      # Cleanup
      r = app.call_tool("enduser_delete", {"user_id": "trial-mcp-user"})
      print("PASS:TRIAL-USER-CLEANED")

      print("PASS:MCP-TRIAL-LIFECYCLE-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:TRIAL-USER-CREATED"
        - "PASS:TRIAL-ACTIVATED"
        - "PASS:TRIAL-EXPIRY-CHECK"
        - "PASS:TRIAL-USER-CLEANED"
        - "PASS:MCP-TRIAL-LIFECYCLE-COMPLETE"

  # ===========================================================================
  # Step 16: Delivery preferences via MCP (update_preferences + get_preferences)
  # ===========================================================================
  - name: "Delivery preferences via MCP (update → get → verify merge)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create a user to test preferences
      r = app.call_tool("enduser_create", {
          "user_id": "prefs-mcp-user",
          "name": "Prefs MCP Tester",
          "email": "prefs.mcp@test.com",
          "tier": "free",
          "status": "trial",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "prefs-mcp-user"
      print("PASS:PREFS-USER-CREATED")

      # Set delivery preferences
      r = app.call_tool("update_preferences", {
          "end_user_id": "prefs-mcp-user",
          "preferences": {
              "format": "markdown",
              "delivery_channel": "email",
              "timezone": "UTC",
              "max_items": 50,
              "language": "en",
          },
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:PREFS-UPDATED keys={list(data.keys())[:8]}")

      # Get preferences and verify
      r = app.call_tool("get_preferences", {
          "end_user_id": "prefs-mcp-user",
      })
      data = json.loads(r.content[0].text)
      prefs = data.get("preferences", data)
      assert prefs.get("format") == "markdown", f"format: {prefs.get('format')}"
      assert prefs.get("delivery_channel") == "email", f"channel: {prefs.get('delivery_channel')}"
      assert prefs.get("max_items") == 50, f"max_items: {prefs.get('max_items')}"
      print(f"PASS:PREFS-VERIFIED format={prefs.get('format')} channel={prefs.get('delivery_channel')} max_items={prefs.get('max_items')}")

      # Merge additional preferences (partial update)
      r = app.call_tool("update_preferences", {
          "end_user_id": "prefs-mcp-user",
          "preferences": {
              "timezone": "Asia/Shanghai",
              "digest_frequency": "weekly",
          },
      })
      data = json.loads(r.content[0].text)
      print("PASS:PREFS-MERGED")

      # Verify merged preferences retain originals
      r = app.call_tool("get_preferences", {
          "end_user_id": "prefs-mcp-user",
      })
      data = json.loads(r.content[0].text)
      prefs = data.get("preferences", data)
      assert prefs.get("format") == "markdown", f"format lost: {prefs.get('format')}"
      assert prefs.get("timezone") == "Asia/Shanghai", f"timezone: {prefs.get('timezone')}"
      assert prefs.get("digest_frequency") == "weekly", f"frequency: {prefs.get('digest_frequency')}"
      print(f"PASS:PREFS-MERGE-VERIFIED timezone={prefs.get('timezone')} freq={prefs.get('digest_frequency')}")

      # Cleanup
      r = app.call_tool("enduser_delete", {"user_id": "prefs-mcp-user"})
      print("PASS:PREFS-USER-CLEANED")

      print("PASS:MCP-PREFERENCES-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:PREFS-USER-CREATED"
        - "PASS:PREFS-UPDATED"
        - "PASS:PREFS-VERIFIED"
        - "PASS:PREFS-MERGED"
        - "PASS:PREFS-MERGE-VERIFIED"
        - "PASS:PREFS-USER-CLEANED"
        - "PASS:MCP-PREFERENCES-COMPLETE"

  # ===========================================================================
  # Step 17: Subscription status via MCP
  # ===========================================================================
  - name: "Subscription status via MCP (get_subscription_status)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create a user
      r = app.call_tool("enduser_create", {
          "user_id": "sub-status-user",
          "name": "Sub Status Tester",
          "email": "sub.status@test.com",
          "tier": "pro",
          "status": "active",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "sub-status-user"
      print("PASS:SUB-USER-CREATED")

      # Get subscription status
      r = app.call_tool("get_subscription_status", {
          "end_user_id": "sub-status-user",
      })
      data = json.loads(r.content[0].text)
      # Returns profile_status, plan, stripe_status, customer_id
      print(f"PASS:SUB-STATUS keys={list(data.keys())[:8]}")
      # Verify basic fields exist
      assert "profile_status" in data or "plan" in data or "user_id" in data, f"Unexpected response: {data}"
      print(f"PASS:SUB-STATUS-SHAPE profile_status={data.get('profile_status','?')} plan={data.get('plan','?')}")

      # Cleanup
      r = app.call_tool("enduser_delete", {"user_id": "sub-status-user"})
      print("PASS:SUB-USER-CLEANED")

      print("PASS:MCP-SUBSCRIPTION-STATUS-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:SUB-USER-CREATED"
        - "PASS:SUB-STATUS keys="
        - "PASS:SUB-STATUS-SHAPE"
        - "PASS:SUB-USER-CLEANED"
        - "PASS:MCP-SUBSCRIPTION-STATUS-COMPLETE"

  # ===========================================================================
  # Step 18: End-user products listing via MCP
  # ===========================================================================
  - name: "End-user products listing via MCP (get_enduser_products)"
    tool: python
    command: |
