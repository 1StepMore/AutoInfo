# NOTE (2026-10-05): the renanzai40/*_BackUp mirrors must NOT carry this file.
# They are dormant snapshots of this repo; Dependabot running there only produced
# noise (stale bound-widening PRs), so the file was removed from the mirrors on
# 2026-10-05. Keep it out of any future "sync CI config from origin" pass.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # `update-types: ["version-update:semver-major"]` does NOT block these two:
      # it does not match a pip *constraint* widening, so mcp<2-><3 (#490) and
      # pytest<9-><10 (#489) both opened through it. Leave `update-types` off.
      # An `ignore` with no `update-types` also suppresses *security* updates for
      # the dependency; Dependabot alerts still fire, so handle those by hand.
      - dependency-name: "mcp"          # mcp 3.x drops Server.list_tools -> server.py:7980 (#245)
      - dependency-name: "pytest"       # pytest 9.x drops EncodedFile.getvalue -> caplog tests (#211)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
