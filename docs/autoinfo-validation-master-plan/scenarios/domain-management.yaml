# =============================================================================
# Scenario: domain-management
# Description: Verify domain add/remove/list operations
# Tags: domain, management, regression, cli
# =============================================================================

name: "Domain Management"
description: >
  Tests domain add, list, show, remove, activate, and deactivate commands.
  Also verifies error handling for invalid domains and duplicate additions.
  Requires a project already initialized.

tier: 1
tags: [domain, management, regression, cli]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-domain"
  DOMAIN: "medical-research"
  NEW_DOMAIN: "test-validation-domain"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for domain management tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "domain-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"

  # -------------------------------------------------------------------------
  # Step 2: List domains after init
  # -------------------------------------------------------------------------
  - name: "List configured domains"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain list 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${DOMAIN}"
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: Add a new domain
  # -------------------------------------------------------------------------
  - name: "Add a new domain"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain add --name "${NEW_DOMAIN}" --description "Validation test domain" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "added"
        - "${NEW_DOMAIN}"
      stdout_not_contains:
        - "Error"

  # -------------------------------------------------------------------------
  # Step 4: Duplicate domain add (idempotent)
  # -------------------------------------------------------------------------
  - name: "Duplicate domain add should be idempotent"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain add --name "${NEW_DOMAIN}" --description "Duplicate attempt" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "already exists"
        - "skipped"

  # -------------------------------------------------------------------------
  # Step 5: Show domain details
  # -------------------------------------------------------------------------
  - name: "Show domain details"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain show --name "${NEW_DOMAIN}" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${NEW_DOMAIN}"
      stdout_not_contains:
        - "Error"

  # -------------------------------------------------------------------------
  # Step 6: Remove the test domain
  # -------------------------------------------------------------------------
  - name: "Remove test domain"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain remove --name "${NEW_DOMAIN}" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "removed"
        - "${NEW_DOMAIN}"

  # -------------------------------------------------------------------------
  # Step 7: Remove non-existent domain (should fail gracefully)
  # -------------------------------------------------------------------------
  - name: "Remove non-existent domain should error"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain remove --name "nonexistent-domain" 2>&1
    expected:
      exit_code: 1
      stdout_contains:
        - "not configured"

  # -------------------------------------------------------------------------
  # Step 8: List domains (as JSON)
  # -------------------------------------------------------------------------
  - name: "List domains as JSON"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo domain list --json 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "${DOMAIN}"
