name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install ".[dev]"
      - name: Ruff on changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files - skipping ruff."
          else
            ruff check "${FILES[@]}"
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    # Non-blocking while 27 pre-existing baseline failures are triaged in #117.
    # Flip to required once the baseline is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango-1.0-0
      - name: Install package
        run: pip install -e ".[dev,video]"
      - name: Run test suite
        run: pytest -q
