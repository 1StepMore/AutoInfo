                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()

      # Get health for all channels
      r = app.call_tool("get_channel_health", {})
      data = json.loads(r.content[0].text)
      assert isinstance(data, list), f"Expected list, got {type(data)}"
      print(f"CHANNEL_HEALTH_ALL count={len(data)}")

      expected_channels = {
          "smtp", "webhook", "rest_api", "file_export",
          "discord", "telegram", "wechat_oa", "wechat_work",
          "dingtalk", "feishu", "rss",
      }
      found_channels = set()
      for entry in data:
          ch = entry.get("channel", "")
          if ch:
              found_channels.add(ch)
          assert "healthy" in entry, f"Missing healthy in {ch}"
          assert "channel" in entry, f"Missing channel: {entry}"
          print(f"  CHANNEL: {ch:20s} healthy={entry.get('healthy')} latency={entry.get('latency_ms', 0)}ms")

      print(f"CHANNEL_FOUND_COUNT {len(found_channels)}/{len(expected_channels)}")
      missing = expected_channels - found_channels
      if missing:
          print(f"CHANNEL_MISSING {missing}")
          # Exit gracefully even if some channels are missing

      # Get health for a single channel
      r = app.call_tool("get_channel_health", {"channel_name": "webhook"})
      data = json.loads(r.content[0].text)
      assert isinstance(data, list) and len(data) == 1, f"Expected single result: {data}"
      assert data[0].get("channel") == "webhook", f"Expected webhook: {data[0]}"
      print(f"CHANNEL_SINGLE channel={data[0].get('channel')} healthy={data[0].get('healthy')}")

      # Get health for unknown channel
      r = app.call_tool("get_channel_health", {"channel_name": "nonexistent_channel_xyz"})
      data = json.loads(r.content[0].text)
      assert isinstance(data, list), f"Expected list: {data}"
      if len(data) > 0:
          assert data[0].get("healthy") == False, f"Expected unhealthy for unknown: {data[0]}"
      print("CHANNEL_UNKNOWN_HANDLED")

      print("MCP_CHANNEL_HEALTH_COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "CHANNEL_HEALTH_ALL"
        - "CHANNEL_FOUND_COUNT"
        - "CHANNEL_SINGLE"
        - "CHANNEL_UNKNOWN_HANDLED"
        - "MCP_CHANNEL_HEALTH_COMPLETE"

