<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoInfo Storefront{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .empty-state { padding: 4rem 1rem; text-align: center; color: var(--bs-secondary-color); }
    .meta-grid dt { width: 12rem; font-weight: 600; }
    .meta-grid dd { margin-bottom: 0.25rem; }
    .price-card { transition: transform 0.12s, box-shadow 0.12s; }
    .price-card:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.12); }
    .price-card .price-amount { font-size: 2.25rem; font-weight: 700; }
    .price-card .price-period { color: var(--bs-secondary-color); font-size: .9rem; }
    .product-icon { font-size: 1.5rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/storefront">
        <i class="bi bi-shop text-primary me-1"></i>AutoInfo Storefront
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#storefrontNav" aria-controls="storefrontNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="storefrontNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% block nav_catalog %}{% endblock %}" href="/storefront/products">
              <i class="bi bi-grid-3x3-gap me-1"></i>Catalog
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-sm btn-outline-secondary" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Toggle dark mode">
            <i class="bi bi-circle-half"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    "use strict";
    const toggle = document.getElementById("themeToggle");
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-bs-theme", theme);
      localStorage.setItem("autoinfo-theme", theme);
      if (toggle) {
        toggle.innerHTML = theme === "dark"
          ? '<i class="bi bi-sun-fill"></i>'
          : '<i class="bi bi-moon-fill"></i>';
      }
    }
    (function initTheme() {
      const saved = localStorage.getItem("autoinfo-theme");
      if (saved) { applyTheme(saved); }
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        applyTheme("dark");
      }
    })();
    if (toggle) {
      toggle.addEventListener("click", function () {
        const cur = document.documentElement.getAttribute("data-bs-theme") || "light";
        applyTheme(cur === "dark" ? "light" : "dark");
      });
    }
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
