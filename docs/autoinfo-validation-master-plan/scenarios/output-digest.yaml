# =============================================================================
# Scenario: output-digest
# Description: Verify digest generation (markdown, html, agent formats)
# Tags: output, digest, regression, cli
# =============================================================================

name: "Output Digest Generation"
tier: 2
description: >
  Tests digest generation in markdown, HTML, and agent JSON-LD formats.
  Requires a project initialized with a demo domain and AUTOINFO_LLM_API_KEY.

tags: [output, digest, regression, cli]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-digest"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project (prerequisite) — tier 1
  # -------------------------------------------------------------------------
  - name: "Initialize project for digest tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "digest-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
      stdout_not_contains:
        - "Traceback"
      artifacts:
        - ".autoinfo/config.yaml:!"
        - "knowledge/01-Raw"

  # -------------------------------------------------------------------------
  # Step 2: Generate digest — markdown format
  # -------------------------------------------------------------------------
  - name: "Generate digest in markdown format"
    tool: bash
    env_required:
      - AUTOINFO_LLM_API_KEY
    command: |
      cd ${TEST_DIR} && autoinfo output digest --domain ${DOMAIN} --period week --format markdown 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: Generate digest — HTML format
  # -------------------------------------------------------------------------
  - name: "Generate digest in HTML format"
    tool: bash
    env_required:
      - AUTOINFO_LLM_API_KEY
    command: |
      cd ${TEST_DIR} && autoinfo output digest --domain ${DOMAIN} --period week --format html 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 4: Generate digest — agent format (JSON-LD)
  # -------------------------------------------------------------------------
  - name: "Generate digest in agent format (JSON-LD)"
    tool: bash
    env_required:
      - AUTOINFO_LLM_API_KEY
    command: |
      cd ${TEST_DIR} && autoinfo output digest --domain ${DOMAIN} --period week --format agent 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 5: Invalid format should error
  # -------------------------------------------------------------------------
  - name: "Invalid digest format should error"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo output digest --domain ${DOMAIN} --format nonexistent 2>&1
    expected:
      exit_code: 2
      stdout_contains:
        - "Error"
        - "nonexistent"
      stdout_not_contains:
        - "Traceback"
