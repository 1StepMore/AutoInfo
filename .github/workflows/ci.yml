name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install ".[dev]"
      # Secret scan — the gitleaks pre-commit hook only runs where a developer
      # ran `pre-commit install`, so CI had no secret scanning at all (an
      # earlier comment falsely claimed coverage.yml ran it). Scans the
      # PR/push commit range with the same pinned gitleaks release as
      # .pre-commit-config.yaml, so a committed key is caught before merge.
      - name: Secret scan (gitleaks)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="$BASE..HEAD"
      # Fast feedback on the PR's own diff.
      - name: Ruff on changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          # --diff-filter=d skips deletions: a removed module (e.g. the
          # untracked .omo/ tree) is not a readable target, and passing it on
          # makes ruff/mypy abort with E902 / "Cannot read file".
          mapfile -t FILES < <(git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files - skipping ruff."
            exit 0
          fi
          # Baseline-aware: this gate catches NEW errors without blocking a
          # legitimate touch of a file that already carries lint debt (a
          # 269-file PR failed here on 37 pre-existing errors). Run the SAME
          # ruff over the SAME file list on the merge-base tree and on HEAD,
          # then fail only for a (file, rule) whose head COUNT exceeds its
          # base COUNT -- a rule absent at base counts 0, which covers newly
          # added files. Totals are never compared: a total would let a new
          # failure hide behind an older one healing (tests/TRIAGE.md).
          BASE_TREE="$RUNNER_TEMP/autoinfo-ruff-base"
          git worktree add --detach "$BASE_TREE" "$BASE"
          [ -d "$BASE_TREE" ] || { echo "ERROR: base worktree $BASE_TREE missing"; exit 1; }
          # ruff concise lines are "path:line:col: CODE message"; key = "path CODE".
          collect_ruff() {
            local dir="$1"; shift
            local -a present=()
            local f
            for f in "$@"; do
              [ -f "$dir/$f" ] && present+=("$f")
            done
            [ "${#present[@]}" -eq 0 ] && return 0
            ( cd "$dir" && ruff check --output-format=concise "${present[@]}" 2>/dev/null || true ) \
              | sed -nE 's/^([^:]+):[0-9]+:[0-9]+: ([A-Z]+[0-9]+) .*/\1 \2/p'
          }
          {
            collect_ruff "$BASE_TREE" "${FILES[@]}" | sed 's/^/b\t/'
            collect_ruff . "${FILES[@]}" | sed 's/^/h\t/'
          } | awk -F'\t' '
            { key=$0; sub(/^[^\t]*\t/, "", key); if ($1=="b") b[key]++; else h[key]++ }
            END {
              for (k in b) keys[k]=1
              for (k in h) keys[k]=1
              for (k in keys) printf "%s\t%d\t%d\n", k, (k in h?h[k]:0), (k in b?b[k]:0)
            }
          ' | LC_ALL=C sort -t$'\t' -k1,1 > "$RUNNER_TEMP/ruff-counts.txt"
          REGRESSIONS="$(awk -F'\t' '$2 > $3' "$RUNNER_TEMP/ruff-counts.txt")"
          if [ -n "$REGRESSIONS" ]; then
            echo "Ruff found NEW errors relative to $BASE (head count > merge-base count):"
            printf '%s\n' "$REGRESSIONS" | awk -F'\t' '{ printf "  NEW: %s (head %d vs base %d)\n", $1, $2, $3 }'
            exit 1
          fi
          echo "Ruff: no new errors vs $BASE."
      - name: Ruff gate on source
        run: ruff check --select E9,F --output-format=github src/
      # Full-src ruff: informational drift surface for the whole tree.
      # The dev extra pins ruff==0.16.8 so this number is reproducible and
      # comparable between local runs and CI. Under that pin: 287 pre-existing
      # errors across the tree (E501×141, I001×55, F401×46, N803×11, F841×11,
      # W292×6, F821×6, N806×4, N817×3, N802×2, F541×1, F811×1;
      # line-length=100). Informational only — changed-files ruff (above) is
      # the required gate. Cleanup is a separate tracked work item; if the
      # count moves, update it here AND in pyproject.toml's per-file-ignores
      # note. Do not re-range the pin.
      - name: Ruff on full source
        run: ruff check src/ tests/
        continue-on-error: true

  mypy-changed-files:
    name: Mypy (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]" types-PyYAML types-python-dateutil
      - name: Mypy on changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          # --diff-filter=d skips deletions: a removed module (e.g. the
          # untracked .omo/ tree) is not a readable target, and passing it on
          # makes ruff/mypy abort with E902 / "Cannot read file".
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.py')
          # Scope: src/ only. The declared strict target is src/autoinfo — the
          # full-tree step below runs `mypy src/` and requires it clean. Tests
          # are held to strict typing by no other gate, so including them here
          # made any PR touching an untyped test file fail: the 272-commit
          # sync reported 205 newly added test annotations as new debt, none
          # of it in src/.
          FILES=()
          for f in "${CHANGED[@]}"; do
            [[ "$f" == src/* ]] && FILES+=("$f")
          done
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed src/ Python files - skipping mypy."
            exit 0
          fi
          # Baseline-aware: a legitimate touch of a file carrying pre-existing
          # type debt must not fail this gate; only errors NEW relative to the
          # merge-base do (a 269-file PR failed here on 759 pre-existing
          # errors, 0 of them in src/). Run the SAME mypy over the SAME file
          # list on the merge-base tree and on HEAD, then fail only for a
          # (file, code) whose head COUNT exceeds its base COUNT -- absent at
          # base counts 0, which covers newly added files. Totals are never
          # compared: a total would let a new failure hide behind an older one
          # healing (tests/TRIAGE.md).
          BASE_TREE="$RUNNER_TEMP/autoinfo-mypy-base"
          git worktree add --detach "$BASE_TREE" "$BASE"
          [ -d "$BASE_TREE" ] || { echo "ERROR: base worktree $BASE_TREE missing"; exit 1; }
          # mypy lines are "path:line: error: message [code]"; key = "path code".
          collect_mypy() {
            local dir="$1"; shift
            local -a present=()
            local f
            for f in "$@"; do
              [ -f "$dir/$f" ] && present+=("$f")
            done
            [ "${#present[@]}" -eq 0 ] && return 0
            ( cd "$dir" && mypy --follow-imports=silent "${present[@]}" 2>/dev/null || true ) \
              | sed -nE 's/^([^:]+):[0-9]+: error: .* \[([a-zA-Z0-9_-]+)\]$/\1 \2/p'
          }
          {
            collect_mypy "$BASE_TREE" "${FILES[@]}" | sed 's/^/b\t/'
            collect_mypy . "${FILES[@]}" | sed 's/^/h\t/'
          } | awk -F'\t' '
            { key=$0; sub(/^[^\t]*\t/, "", key); if ($1=="b") b[key]++; else h[key]++ }
            END {
              for (k in b) keys[k]=1
              for (k in h) keys[k]=1
              for (k in keys) printf "%s\t%d\t%d\n", k, (k in h?h[k]:0), (k in b?b[k]:0)
            }
          ' | LC_ALL=C sort -t$'\t' -k1,1 > "$RUNNER_TEMP/mypy-counts.txt"
          REGRESSIONS="$(awk -F'\t' '$2 > $3' "$RUNNER_TEMP/mypy-counts.txt")"
          if [ -n "$REGRESSIONS" ]; then
            echo "Mypy found NEW errors relative to $BASE (head count > merge-base count):"
            printf '%s\n' "$REGRESSIONS" | awk -F'\t' '{ printf "  NEW: %s (head %d vs base %d)\n", $1, $2, $3 }'
            exit 1
          fi
          echo "Mypy: no new errors vs $BASE."
      # Full-tree strict mypy — the recursion guard. The changed-files step
      # above runs with --follow-imports=silent, so it cannot see the damage a
      # change here does to a module it imports: a wrong signature, a widened
      # return type or a removed re-export stays invisible until someone edits
      # the victim file, and by then the cause is buried. This step closes
      # that hole. The tree is fully clean (strict, 0 errors across
      # src/autoinfo) as of the 192-error debt paydown, so any error reported
      # here is new and must be fixed, not budgeted. It runs inside the
      # existing job rather than a new one because "Mypy (changed files)" is a
      # required status check name in GOVERNANCE.md — a new job would need
      # branch-protection surgery for no extra signal.
      - name: Mypy on full source
        run: mypy src/

  test:
    name: Test suite (fast subset)
    runs-on: ubuntu-latest
    env:
      # rich/typer render --help with ANSI escapes that split double-dash
      # flags (e.g. "--domain" -> "-" + "-domain") when it detects a CI
      # terminal (GITHUB_ACTIONS=true). TERM=dumb forces plain output so
      # help-substring assertions pass identically to local runs.
      TERM: dumb
    # Required job (was continue-on-error in #116). The suite carries a known
    # red budget; its single authority is tests/TRIAGE.md §Authoritative
    # known-red budget. Read that section before treating red CI as a
    # regression — this file must never restate the budget itself.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpango for weasyprint-adjacent PDF tests; ffmpeg is skip-gated
          # and video tests skip via the PIL importorskip in conftest.
          sudo apt-get install -y libpango-1.0-0
      - name: Install package
        run: pip install -e ".[dev,ebook]"
      - name: Run fast test subset
        run: |
          set -o pipefail
          pytest -m "not real_api" -q 2>&1 | tee pytest-output.log
      - name: Append triage pointer on failure
        if: failure()
        run: |
          {
            echo ""
            echo "=== Failure triage pointer ==="
            echo "See tests/TRIAGE.md for the documented failure table."
          } >> pytest-output.log
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest-output.log
          retention-days: 7

  # #347: regression scenarios must be runnable as-is in a clean checkout +
  # standard venv (CI can run all). This job is the portability proof: every
  # scenario command now uses bare `python3` (resolved via the installed
  # package), and a fresh venv here contains NO dev-machine paths — if a
  # scenario hardcodes one, this job turns RED even though it passes on the
  # author's box.
  scenario-portability:
    name: Scenario portability
    runs-on: ubuntu-latest
    env:
      # rich/typer render --help with ANSI escapes that split double-dash
      # flags when they detect a CI terminal (GITHUB_ACTIONS=true). TERM=dumb
      # forces plain output so CLI help-substring assertions in scenario
      # steps behave identically to local runs (same as the test job).
      TERM: dumb
    steps:
      # fetch-depth: 0 — the smart-skip `_code_changed` helper and the
      # scenario runner both need git history (git diff against the base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Editable install: bare `python3` in the scenario commands must resolve
      # the autoinfo package through the standard interpreter on PATH — no
      # absolute venv path, exactly what #347 fixes.
      - name: Install package
        run: pip install -e ".[dev,ebook]"
      - name: Guard test — no dev-machine absolute paths in scenarios
        run: pytest tests/validation/test_no_dev_abs_paths.py -q
      # #381: enumerate the keyless/networkless subset at RUNTIME (via
      # load_scenarios() — never a hardcoded list or count) and run every
      # candidate through a real server.call_tool dispatch. The candidate set,
      # exclusions and per-scenario results all live in
      # scripts/scenario_portability_gate.py. Any non-passing candidate must be
      # in that script's committed known-red baseline, and a baseline entry
      # that starts passing fails this step too — so the baseline can never
      # grow silently.
      - name: "Run keyless scenario subset (runtime-enumerated)"
        run: python3 scripts/scenario_portability_gate.py
      - name: Full scenario library parses
        run: |
          python3 -c "from autoinfo.mcp.validation import load_scenarios; print(len(load_scenarios()))"
