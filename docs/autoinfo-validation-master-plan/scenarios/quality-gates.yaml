# =============================================================================
# Scenario: quality-gates
# Description: Verify quality gates G1-G5 and gate configuration tools
# Tags: quality, gates, regression, python
# =============================================================================

name: "Quality Gates Validation"
tier: 1
description: >
  Tests quality gates G1 (source authority tier check), G2 (dedup),
  G3 (relevance scoring), and gate configuration (get_gate_config,
  set_gate_config). Tests G0 schema integrity via CLI process with
  valid/invalid items. SKIPs G4 (factual consistency) and G5
  (translation accuracy) as they require a real LLM key.

tags: [quality, gates, regression, python, g1, g2, g3, g0]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-quality-gates"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project with domain (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for quality gate tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "quality-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
      stdout_not_contains:
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/.autoinfo/config.yaml:!"
        - "${TEST_DIR}/.autoinfo/knowledge/01-Raw"

  # -------------------------------------------------------------------------
  # Step 2: G1 Source Authority — Tier 1 passes unflagged
  # -------------------------------------------------------------------------
  - name: "G1: Tier 1 source passes unflagged"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G1SourceAuthority
      from autoinfo.models import Item

      item = Item(id='g1-1', source_name='pubmed', source_type='pubmed',
                  source_url='https://pubmed.ncbi.nlm.nih.gov/1',
                  title='Test', content='test',
                  collected_at='2026-07-20', quality_tier=1)
      result = G1SourceAuthority().check(item, {'quality_tier': 1})
      assert result.passed is True, 'expected passed=True, got ' + str(result.passed)
      assert result.flagged is False, 'expected flagged=False, got ' + str(result.flagged)
      assert result.details['source_score'] == 90.0, 'expected source_score=90.0, got ' + str(result.details['source_score'])
      print('G1 tier1: passed=' + str(result.passed) + ' flagged=' + str(result.flagged) +
            ' source_score=' + str(result.details['source_score']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1 tier1: passed=True flagged=False source_score=90.0"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: G1 Source Authority — Tier 3+ flagged advisory
  # -------------------------------------------------------------------------
  - name: "G1: Tier 3 source flagged (advisory, not blocked)"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G1SourceAuthority
      from autoinfo.models import Item

      item = Item(id='g1-2', source_name='blog', source_type='web',
                  source_url='https://example.com/blog',
                  title='Test', content='test',
                  collected_at='2026-07-20', quality_tier=3)
      result = G1SourceAuthority().check(item, {'quality_tier': 3})
      assert result.flagged is True, 'expected flagged=True for tier 3, got ' + str(result.flagged)
      assert result.passed is True, 'tier 3 advisory should still pass, got ' + str(result.passed)
      assert result.details['source_score'] == 50.0, 'expected source_score=50.0, got ' + str(result.details['source_score'])
      print('G1 tier3: passed=' + str(result.passed) + ' flagged=' + str(result.flagged) +
            ' source_score=' + str(result.details['source_score']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1 tier3: passed=True flagged=True source_score=50.0"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 4: G2 Dedup — exact URL match
  # -------------------------------------------------------------------------
  - name: "G2: Exact URL match dedup"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item, KBEntry

      checker = DedupChecker()
      item = Item(id='dup-1', source_name='pubmed', source_type='pubmed',
                  source_url='https://doi.org/10.1234/test',
                  title='Dup Article', content='same content',
                  collected_at='2026-07-20')
      existing = [KBEntry(entry_id='kb-1', title='Dup Article', domain='${DOMAIN}',
                          source_url='https://doi.org/10.1234/test',
                          collected_at='2026-07-19')]
      result = checker.check(item, existing)
      assert result['is_duplicate'] is True, 'expected duplicate, got ' + str(result)
      assert result['matched_by'] == 'url', 'expected matched_by=url, got ' + str(result)
      print('G2 url-match: is_duplicate=' + str(result['is_duplicate']) +
            ' matched_by=' + str(result['matched_by']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G2 url-match: is_duplicate=True matched_by=url"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 5: G2 Dedup — unique URL passes
  # -------------------------------------------------------------------------
  - name: "G2: Unique URL passes dedup"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item, KBEntry

      checker = DedupChecker()
      item = Item(id='unique-1', source_name='pubmed', source_type='pubmed',
                  source_url='https://doi.org/10.9999/unique',
                  title='Unique Article', content='different',
                  collected_at='2026-07-20')
      existing = [KBEntry(entry_id='kb-1', title='Weather forecast for tomorrow',
                          domain='${DOMAIN}',
                          source_url='https://doi.org/10.1234/other',
                          collected_at='2026-07-19')]
      result = checker.check(item, existing)
      assert result['is_duplicate'] is False, 'expected unique, got ' + str(result)
      print('G2 unique-url: is_duplicate=' + str(result['is_duplicate']) +
            ' matched_by=' + str(result['matched_by']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G2 unique-url: is_duplicate=False matched_by="
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 6: G2 Dedup — empty source_url handled gracefully
  # -------------------------------------------------------------------------
  - name: "G2: Empty source_url does not crash"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item, KBEntry

      checker = DedupChecker()
      item = Item(id='no-url', source_name='pubmed', source_type='pubmed',
                  source_url='', title='No URL', content='test',
                  collected_at='2026-07-20')
      existing = [KBEntry(entry_id='kb-1', title='Weather forecast for tomorrow',
                          domain='${DOMAIN}', source_url='https://example.com',
                          collected_at='2026-07-19')]
      result = checker.check(item, existing)
      assert result['is_duplicate'] is False, 'empty source_url should not match, got ' + str(result)
      print('G2 empty-url: is_duplicate=' + str(result['is_duplicate']) +
            ' matched_by=' + str(result['matched_by']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G2 empty-url: is_duplicate=False matched_by="
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 7: G3 Relevance — score in 0-100 range (lexical scoring, no LLM)
  # -------------------------------------------------------------------------
  - name: "G3: Relevance score within 0-100 range"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G3RelevanceScoring
      from autoinfo.models import Item

      item = Item(id='g3-1', source_name='pubmed', source_type='pubmed',
                  source_url='https://example.com/g3-1',
                  title='IVF treatment outcomes in 2026',
                  content='This paper discusses IVF embryo implantation success rates...',
                  collected_at='2026-07-20')
      result = G3RelevanceScoring().check(item, ['IVF', 'embryo', 'implantation'])
      assert 0 <= result.score <= 100, 'score ' + str(result.score) + ' out of 0-100 range'
      assert result.details['scoring_method'] == 'lexical', 'expected lexical scoring, got ' + str(result.details.get('scoring_method'))
      print('G3 relevance score: ' + str(result.score) + ' method=' + str(result.details['scoring_method']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G3 relevance score: 100.0 method=lexical"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 8: G3 Relevance — higher keyword overlap = higher score
  # -------------------------------------------------------------------------
  - name: "G3: Higher keyword overlap scores higher"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G3RelevanceScoring
      from autoinfo.models import Item

      item_high = Item(id='g3-hi', source_name='pubmed', source_type='pubmed',
                       source_url='https://example.com/g3-hi',
                       title='IVF embryo implantation study 2026',
                       content='IVF embryo implantation research findings...',
                       collected_at='2026-07-20')
      item_low = Item(id='g3-lo', source_name='pubmed', source_type='pubmed',
                      source_url='https://example.com/g3-lo',
                      title='Cooking recipes',
                      content='How to make pasta carbonara...',
                      collected_at='2026-07-20')
      result_high = G3RelevanceScoring().check(item_high, ['IVF', 'embryo', 'implantation'])
      result_low = G3RelevanceScoring().check(item_low, ['IVF', 'embryo', 'implantation'])
      assert result_high.score > result_low.score, \
          'expected high(' + str(result_high.score) + ') > low(' + str(result_low.score) + ')'
      print('G3 relevance ranking: high=' + str(result_high.score) +
            ' low=' + str(result_low.score))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G3 relevance ranking: high=100.0 low=0.0"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 9: Gate config — set then get default gate configuration via MCP
  # -------------------------------------------------------------------------
  - name: "Get default gate configuration via MCP"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      import asyncio, json
      from autoinfo.mcp.server import call_tool

      set_list = asyncio.run(call_tool('set_gate_config', {
          'domain': '${DOMAIN}', 'gate': 'G1',
          'config': {'action': 'flag', 'category': 'soft'},
      }))
      set_body = json.loads(set_list[0].text)
      assert set_body.get('success') is True, 'set_gate_config failed: ' + str(set_body)
      assert set_body['data'].get('updated') is True, 'expected updated=True, got ' + str(set_body['data'])

      get_list = asyncio.run(call_tool('get_gate_config', {
          'domain': '${DOMAIN}', 'gate': 'G1',
      }))
      body = json.loads(get_list[0].text)
      assert body.get('success') is True, 'get_gate_config failed: ' + str(body)
      data = body.get('data', {})
      assert data.get('gate') == 'G1', 'expected gate G1, got ' + str(data.get('gate'))
      assert data.get('gate_type') == 'quality', 'expected gate_type quality, got ' + str(data.get('gate_type'))
      print('get_gate_config: domain=' + str(data.get('domain')) +
            ' gate=' + str(data.get('gate')) +
            ' gate_type=' + str(data.get('gate_type')))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "get_gate_config: domain=medical-research gate=G1 gate_type=quality"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 10: Gate config — error on invalid gate name
  # -------------------------------------------------------------------------
  - name: "Gate config with invalid gate name should handle gracefully"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      import asyncio, json
      from autoinfo.mcp.server import call_tool

      result_list = asyncio.run(call_tool('get_gate_config', {
          'domain': '${DOMAIN}', 'gate': 'nonexistent_gate',
      }))
      body = json.loads(result_list[0].text)
      assert body.get('success') is False, 'expected failure envelope, got ' + str(body)
      code = body.get('error_code') or (body.get('error') or {}).get('code')
      assert code == 'GateNotFound', 'expected GateNotFound, got ' + str(code)
      print('invalid gate rejected: success=' + str(body.get('success')) +
            ' error_code=' + str(code))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "invalid gate rejected: success=False error_code=GateNotFound"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 11: G2 Dedup — empty existing list passes
  # -------------------------------------------------------------------------
  - name: "G2: Empty existing list — not a duplicate"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.dedup import DedupChecker
      from autoinfo.models import Item

      checker = DedupChecker()
      item = Item(id='fresh-1', source_name='pubmed', source_type='pubmed',
                  source_url='https://doi.org/10.1234/fresh',
                  title='Fresh Article', content='new content',
                  collected_at='2026-07-20')
      result = checker.check(item, [])
      assert result['is_duplicate'] is False, 'empty existing should not match, got ' + str(result)
      print('G2 empty-existing: is_duplicate=' + str(result['is_duplicate']) +
            ' matched_by=' + str(result['matched_by']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G2 empty-existing: is_duplicate=False matched_by="
      stdout_not_contains:
        - "Traceback"

  # =========================================================================
  # G1 Extension: E9 source_score verification  [added 2026-08-02 — e-features]
  # 唯一修改：追加 E9/E10 到 quality-gates.yaml 末尾
  # Code: src/autoinfo/quality.py:41-46 SOURCE_TIER_SCORE_MAP
  #       src/autoinfo/quality.py:245-253 source_score in G1SourceAuthority
  # =========================================================================

  - name: "G1-E9: SOURCE_TIER_SCORE_MAP tier ordering (tier1 > tier2 > tier3 > tier4)"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import SOURCE_TIER_SCORE_MAP

      s1 = SOURCE_TIER_SCORE_MAP[1]
      s2 = SOURCE_TIER_SCORE_MAP[2]
      s3 = SOURCE_TIER_SCORE_MAP[3]
      s4 = SOURCE_TIER_SCORE_MAP[4]

      for tier, score in [(1, s1), (2, s2), (3, s3), (4, s4)]:
          assert 0 <= score <= 100, 'tier' + str(tier) + ' score ' + str(score) + ' out of 0-100'

      assert s1 > s2 > s3 > s4, 'score order violated: ' + str((s1, s2, s3, s4))
      print('G1-E9 SOURCE_TIER_SCORE_MAP: tier1=' + str(s1) +
            ' tier2=' + str(s2) +
            ' tier3=' + str(s3) +
            ' tier4=' + str(s4))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1-E9 SOURCE_TIER_SCORE_MAP: tier1=90.0 tier2=70.0 tier3=50.0 tier4=30.0"
      stdout_not_contains:
        - "Traceback"

  - name: "G1-E9: source_score embedded in G1SourceAuthority result details"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G1SourceAuthority, SOURCE_TIER_SCORE_MAP
      from autoinfo.models import Item

      gate = G1SourceAuthority()
      scores = {}
      for tier in [1, 2, 3, 4]:
          item = Item(id='g1e9-' + str(tier), source_name='src' + str(tier),
                      source_type='web', source_url='https://example.com/src' + str(tier),
                      title='T', content='c', collected_at='2026-01-01',
                      quality_tier=tier)
          result = gate.check(item, {'quality_tier': tier})
          score = result.details.get('source_score')
          assert score is not None, 'tier ' + str(tier) + ': source_score missing'
          assert score == SOURCE_TIER_SCORE_MAP.get(tier), (
              'tier ' + str(tier) + ': expected ' + str(SOURCE_TIER_SCORE_MAP.get(tier)) +
              ', got ' + str(score)
          )
          scores[tier] = score
      print('G1-E9 source_score: tier1=' + str(scores[1]) +
            ' tier2=' + str(scores[2]) +
            ' tier3=' + str(scores[3]) +
            ' tier4=' + str(scores[4]))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1-E9 source_score: tier1=90.0 tier2=70.0 tier3=50.0 tier4=30.0"
      stdout_not_contains:
        - "Traceback"

  # =========================================================================
  # G1 Extension: E10 ToS compliance  [added 2026-08-02 — e-features]
  # Code: src/autoinfo/quality.py:305-474 G1TosCompliance
  #       src/autoinfo/quality.py:328-333 _TIER_TOS_MAP
  #       src/autoinfo/quality.py:1794-1890 D2FormatIntegrity.tos_delivery_check
  # =========================================================================

  - name: "G1-E10: G1TosCompliance — open/licensed pass, restricted/sensitive flagged"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import G1TosCompliance
      from autoinfo.models import Item

      gate = G1TosCompliance()

      # open -> passes
      r = gate.check(
          Item(id='tos-o', source_name='pubmed', source_type='pubmed',
               source_url='https://pubmed.ncbi.nlm.nih.gov/o',
               title='T', content='c', collected_at='2026-01-01', quality_tier=1),
          {'tos_classification': 'open', 'quality_tier': 1},
      )
      assert r.passed and not r.flagged and r.details.get('tos_compliant') is True
      print('G1-E10 open: passed=' + str(r.passed) + ' flagged=' + str(r.flagged) +
            ' tos_compliant=' + str(r.details['tos_compliant']))

      # licensed -> passes
      r = gate.check(
          Item(id='tos-l', source_name='ap', source_type='api',
               source_url='https://example.com/l',
               title='T', content='c', collected_at='2026-01-01', quality_tier=2),
          {'tos_classification': 'licensed', 'quality_tier': 2},
      )
      assert r.passed and not r.flagged and r.details.get('tos_compliant') is True
      print('G1-E10 licensed: passed=' + str(r.passed) + ' flagged=' + str(r.flagged) +
            ' tos_compliant=' + str(r.details['tos_compliant']))

      # restricted -> flagged advisory
      r = gate.check(
          Item(id='tos-r', source_name='blog', source_type='web',
               source_url='https://example.com/r',
               title='T', content='c', collected_at='2026-01-01', quality_tier=3),
          {'tos_classification': 'restricted', 'quality_tier': 3},
      )
      assert r.flagged and r.details.get('tos_compliant') is False
      assert 'compliance_warning' in r.details
      print('G1-E10 restricted: passed=' + str(r.passed) + ' flagged=' + str(r.flagged) +
            ' tos_compliant=' + str(r.details['tos_compliant']) +
            ' warning=' + str('compliance_warning' in r.details))

      # sensitive -> flagged advisory
      r = gate.check(
          Item(id='tos-s', source_name='private', source_type='web',
               source_url='https://example.com/s',
               title='T', content='c', collected_at='2026-01-01', quality_tier=4),
          {'tos_classification': 'sensitive', 'quality_tier': 4},
      )
      assert r.flagged and r.details.get('tos_compliant') is False
      assert 'compliance_warning' in r.details
      print('G1-E10 sensitive: passed=' + str(r.passed) + ' flagged=' + str(r.flagged) +
            ' tos_compliant=' + str(r.details['tos_compliant']) +
            ' warning=' + str('compliance_warning' in r.details))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1-E10 open: passed=True flagged=False tos_compliant=True"
        - "G1-E10 licensed: passed=True flagged=False tos_compliant=True"
        - "G1-E10 restricted: passed=True flagged=True tos_compliant=False warning=True"
        - "G1-E10 sensitive: passed=True flagged=True tos_compliant=False warning=True"
      stdout_not_contains:
        - "Traceback"

  - name: "G1-E10: D2FormatIntegrity.tos_delivery_check — RAW blocked, PROCESSED passes"
    tool: bash
    command: |
      cd ${TEST_DIR} && python3 -c "
      from autoinfo.quality import D2FormatIntegrity

      checker = D2FormatIntegrity()

      # RAW with restricted -> blocked
      r = checker.tos_delivery_check({
          'product_type': 'raw',
          'entries': [{'tos_classification': 'restricted', 'entry_id': 'x'}],
      })
      assert r.passed is False and r.details.get('tos_blocked') is True
      print('G1-E10 D2 raw: passed=' + str(r.passed) +
            ' tos_blocked=' + str(r.details['tos_blocked']))

      # PROCESSED with restricted -> passes with notice
      r = checker.tos_delivery_check({
          'product_type': 'processed',
          'entries': [{'tos_classification': 'restricted', 'entry_id': 'y'}],
      })
      assert r.passed is True and r.details.get('tos_compliance_notice') is True
      print('G1-E10 D2 processed: passed=' + str(r.passed) +
            ' tos_blocked=' + str(r.details['tos_blocked']) +
            ' tos_compliance_notice=' + str(r.details['tos_compliance_notice']))

      # No restricted -> clean
      r = checker.tos_delivery_check({
          'product_type': 'raw',
          'entries': [{'tos_classification': 'open', 'entry_id': 'z'}],
      })
      assert r.passed is True and r.details.get('tos_blocked') is False
      print('G1-E10 D2 clean: passed=' + str(r.passed) +
            ' tos_blocked=' + str(r.details['tos_blocked']))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "G1-E10 D2 raw: passed=False tos_blocked=True"
        - "G1-E10 D2 processed: passed=True tos_blocked=False tos_compliance_notice=True"
        - "G1-E10 D2 clean: passed=True tos_blocked=False"
      stdout_not_contains:
        - "Traceback"
