# Regression (AMD Radeon thinking-disable shape): the "disable thinking" request
# parameter must match the gateway's convention.
#
# Symptom: AutoInfo sent the Anthropic-style `thinking={"type":"disabled"}` to
# EVERY reasoning deployment. On a vLLM/SGLang-style gateway (AMD Radeon,
# base_url=https://developer.amd.com.cn/radeon/api/v1, provider `openai`) that
# is a hard 400 — `BadRequestError: "thinking" is not supported` — so every LLM
# path failed; measured on a real AC5 product-verdict prompt: 224.4s, 0 chars,
# finish_reason=length. The bare `{"enable_thinking": false}` those gateways do
# accept is silently IGNORED (reasoning_tokens stayed 45), so it is not a fix.
#
# Root cause: `_completion_request` (autoinfo/llm.py) hardcoded one shape for
# all gateways.
#
# Fix: one explicit per-gateway decision point, `thinking_disable_body` —
# base_url host → provider → documented default. DeepSeek-family and every
# unmapped gateway keep `thinking={"type":"disabled"}` byte-identically; mapped
# gateways get `chat_template_kwargs={"enable_thinking": False}`. A
# retry-on-BadRequest probe was considered and rejected: it would mask a real
# misconfiguration instead of failing loudly.
#
# Deterministic (requires_env: []): asserts the resolver and the real request
# payload built for BOTH gateways, plus that the judgment-gate re-enable
# (`disable_thinking=False`) still sends no disable body. litellm is stubbed, so
# no network call and no API key.
name: regression-thinking-disable-shape
description: "Regression (AMD Radeon): thinking-disable body is provider-aware — chat_template_kwargs on vLLM-style gateways, thinking:{type:disabled} unchanged elsewhere, judgment-gate re-enable intact"
category: edge_case
pyramid_layer: component
pipeline_stage: A2
user_level: B2.4
regression: true
regression_issue: "#amd-radeon-thinking-disable-shape"
requires_env: []
steps:
  - name: "resolver maps both conventions and falls back to the documented default"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.llm import (
          DEFAULT_THINKING_SHAPE,
          THINKING_DISABLE_BODIES,
          THINKING_SHAPE_ANTHROPIC,
          THINKING_SHAPE_CHAT_TEMPLATE,
          thinking_disable_body,
      )

      ANTHROPIC = {"thinking": {"type": "disabled"}}
      CHAT_TEMPLATE = {"chat_template_kwargs": {"enable_thinking": False}}

      assert DEFAULT_THINKING_SHAPE == THINKING_SHAPE_ANTHROPIC, "documented default changed"

      deepseek = thinking_disable_body("openai", "https://opencode.ai/zen/go/v1")
      assert deepseek == ANTHROPIC, f"deepseek-family shape regressed: {deepseek!r}"

      radeon = thinking_disable_body("openai", "https://developer.amd.com.cn/radeon/api/v1")
      assert radeon == CHAT_TEMPLATE, f"radeon gateway not mapped: {radeon!r}"

      unmapped = thinking_disable_body("openai", "https://api.example.com/v1")
      assert unmapped == ANTHROPIC, f"unmapped gateway regressed: {unmapped!r}"
      assert thinking_disable_body("openai", "") == ANTHROPIC, "empty base_url must use the default"

      declared = thinking_disable_body("vllm", "")
      assert declared == CHAT_TEMPLATE, f"provider-scoped declaration ignored: {declared!r}"

      noisy = thinking_disable_body("openai", "HTTPS://user@Developer.AMD.com.cn:443/radeon/api/v1")
      assert noisy == CHAT_TEMPLATE, f"host lookup is not scheme/port/case tolerant: {noisy!r}"

      body = thinking_disable_body("openai", "https://developer.amd.com.cn/radeon/api/v1")
      body["chat_template_kwargs"]["enable_thinking"] = True
      assert THINKING_DISABLE_BODIES[THINKING_SHAPE_CHAT_TEMPLATE] == CHAT_TEMPLATE, (
          "returned body aliases the shared registry"
      )
      print("SHAPE_MAP_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SHAPE_MAP_OK"]

  - name: "request payload carries the gateway-correct shape"
    kind: cli
    command: |-
      python3 -c '
      import json
      from unittest.mock import MagicMock, patch

      from autoinfo.config import Config, LLMConfig
      from autoinfo.llm import LLMExtractor, call_with_fallback

      def _extra_body(provider, base_url):
          cfg = Config(llm=LLMConfig(provider=provider, base_url=base_url, model="stub-model"))
          litellm = MagicMock()
          response = MagicMock()
          response.choices = [MagicMock()]
          response.choices[0].message.content = json.dumps({"ok": True})
          litellm.completion.return_value = response
          with patch.object(LLMExtractor, "_get_litellm", return_value=litellm):
              call_with_fallback(
                  messages=[{"role": "user", "content": "hi"}],
                  reasoning_model=True,
                  config=cfg,
              )
          return litellm.completion.call_args.kwargs.get("extra_body")

      deepseek = _extra_body("openai", "https://opencode.ai/zen/go/v1")
      assert deepseek == {"thinking": {"type": "disabled"}}, f"deepseek payload changed: {deepseek!r}"

      radeon = _extra_body("openai", "https://developer.amd.com.cn/radeon/api/v1")
      assert radeon == {"chat_template_kwargs": {"enable_thinking": False}}, (
          f"radeon payload wrong: {radeon!r}"
      )
      assert "thinking" not in radeon, f"anthropic param leaked to radeon: {radeon!r}"
      print("REQUEST_SHAPE_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["REQUEST_SHAPE_OK"]

  - name: "judgment-gate thinking re-enable wins over the disable on every gateway"
    kind: cli
    command: |-
      python3 -c '
      import json
      from unittest.mock import MagicMock, patch

      from autoinfo.config import Config, LLMConfig
      from autoinfo.llm import LLMExtractor, call_with_fallback

      def _extra_body(base_url, reasoning_model=True, **call_kwargs):
          cfg = Config(llm=LLMConfig(provider="openai", base_url=base_url, model="stub-model"))
          litellm = MagicMock()
          response = MagicMock()
          response.choices = [MagicMock()]
          response.choices[0].message.content = json.dumps({"ok": True})
          litellm.completion.return_value = response
          with patch.object(LLMExtractor, "_get_litellm", return_value=litellm):
              call_with_fallback(
                  messages=[{"role": "user", "content": "hi"}],
                  reasoning_model=reasoning_model,
                  config=cfg,
                  **call_kwargs,
              )
          return litellm.completion.call_args.kwargs.get("extra_body")

      for label, base_url in (
          ("radeon", "https://developer.amd.com.cn/radeon/api/v1"),
          ("deepseek", "https://opencode.ai/zen/go/v1"),
      ):
          sent = _extra_body(base_url, disable_thinking=False)
          assert sent is None, f"{label}: judgment gate re-enable sent a disable body: {sent!r}"

      not_reasoning = _extra_body(
          "https://developer.amd.com.cn/radeon/api/v1", reasoning_model=False
      )
      assert not_reasoning is None, f"non-reasoning model sent a disable body: {not_reasoning!r}"
      print("JUDGMENT_REENABLE_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["JUDGMENT_REENABLE_OK"]
