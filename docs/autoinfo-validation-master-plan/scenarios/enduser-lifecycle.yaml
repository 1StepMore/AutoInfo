  - name: "Push channel dispatch with graceful fallback"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.delivery import get_channel
      from autoinfo.delivery.push import PushDeliveryChannel
      # 1. get_channel("push") must return a PushDeliveryChannel
      ch = get_channel("push")
      assert isinstance(ch, PushDeliveryChannel), f"Expected PushDeliveryChannel, got {type(ch).__name__}"
      print("PUSH_CHANNEL_RESOLVED PushDeliveryChannel")
      # 2. Verify deliver() graceful when PUSH_ENDPOINT is unset
      from autoinfo.models import Product, ProductType
      product = Product(id="test-push", domain="${DOMAIN}", type=ProductType.PROCESSED, config={})
      payload = {"title": "test", "content": "push test", "url": ""}
      if not os.environ.get("PUSH_ENDPOINT"):
          result = ch.send(product, payload, [])
          assert result.status == "failed", f"Expected failed status without PUSH_ENDPOINT, got {result.status}"
          assert "No push endpoint" in (result.error or ""), f"Expected 'No push endpoint' error, got: {result.error}"
          print("PUSH_GRACEFUL_FAIL no_PUSH_ENDPOINT")
          # 3. Simulate delivery log entry for push
          from autoinfo.delivery_log import append_delivery_log, query_delivery_log
          log = append_delivery_log(subscription_id="test-push-sub", channel="push",
                                    message_type="digest", status="simulated",
                                    attempt_count=1, error_message="scenario test")
          assert log.channel == "push", f"Expected push channel in log, got {log.channel}"
          print(f"PUSH_DELIVERY_LOG log_id={log.log_id}")
          # 4. Query back and assert it exists
          results = query_delivery_log(subscription_id="test-push-sub", channel="push", limit=5)
          assert len(results) >= 1, "Expected at least 1 push log entry"
          print(f"PUSH_LOG_QUERY entries={len(results)}")
      else:
          print("PUSH_ENDPOINT_SET skipped_real_send")
      print("C5_PUSH_CHANNEL_VERIFIED")
    expected:
      exit_code: 0
      stdout_contains:
        - "PUSH_CHANNEL_RESOLVED"
        - "C5_PUSH_CHANNEL_VERIFIED"

