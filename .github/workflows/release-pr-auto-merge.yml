# Auto-merge release-please PRs (#275 follow-up)
#
# WHY THIS EXISTS
# GitHub's 2026-06-11 change requires manual approval before workflows run on
# PRs authored by `github-actions[bot]`. release-please opens its release PR as
# the bot, so all 6 required status checks concluded `action_required` with
# zero jobs, and the `main-protection` ruleset (which requires Lint, Mypy, the
# test subset, the coverage gate, the title check and DCO) could never be
# satisfied. Every release therefore stalled until a human clicked through the
# pending runs AND merged the PR.
#
# WHY `workflow_run` AND NOT A PR-EVENT TRIGGER
# The original version of this file listened on the privileged PR event, but
# that trigger NEVER fired for the release PR. release-please opens and updates
# the release PR using the default `GITHUB_TOKEN`, and GitHub does not create
# new workflow runs for events caused by that token — so the PR event simply
# never happened. Proof: release PR #411 (1.13.7) carried four
# runs stuck at conclusion `action_required`, `mergeStateStatus=BLOCKED`, no
# `autoMergeRequest`, and this workflow recorded ZERO runs for it, while a
# human-created PR (#410) did trigger it.
#
# `workflow_run` fires when a *named workflow completes*, and is not subject to
# the token-caused-event suppression in the same way — the run it observes is
# the `Release` workflow on main (which itself is user-caused). This workflow
# therefore triggers on completion of `Release` (see `.github/workflows/
# release-please.yml`, `name: Release`), re-reads the open release PR through
# the API, approves the blocked runs, enables auto-merge, and finally cuts the
# tag if the merge did not fire `Release`.
#
# SECURITY MODEL — read before widening anything
# This workflow holds `actions: write` + `contents: write` + `pull-requests:
# write`, so the gate below is the security boundary.
#
# 1. This workflow NEVER executes PR-supplied code: there is no checkout
#    action, no `uses:` and no `run:` of repo/PR code anywhere below. The only
#    inputs consumed are the PR's author, head branch and title, all read
#    through the `gh` API. Do not add a checkout or a `run` of repo/PR code to
#    this file without a full re-review.
# 2. The three eligibility gates (bot author, release-please branch prefix,
#    `chore(main): release ` title) are each required. An attacker would need
#    write access to this repository to open a branch named
#    `release-please--branches--...` and to spoof the bot author — at which
#    point they could merge directly and this workflow is moot.
# 3. Steps that act are individually guarded on the gate's output, so a
#    non-release completion exits having done nothing rather than falling
#    through.
#
# The required checks are NOT bypassed. This approves and waits for them, so
# the ruleset guarantee stays real; it only stops a human being the bottleneck.
#
# NOTE ON THE APPROVAL STEP: approving a workflow run requires `actions: write`.
# If the token in a given repository is not permitted to approve runs of other
# workflows, the step logs a warning and the PR still gets auto-merge enabled —
# a human approving the runs is then still enough to let it land.
#
# NOTE ON `GH_REPO`: because this job never checks out (security model note 1),
# there is no `.git` directory for `gh` to infer the repository from, so every
# `gh` command would abort with "fatal: not a git repository" and
# `set -euo pipefail` would turn that into a failed gate step. The job-level
# `GH_REPO` below supplies the repository context explicitly, without adding a
# checkout.
#
# NOTE ON TAG CREATION: `workflow_run` gives no PR number and its `head_branch`
# is `main`, so the PR is discovered through `gh pr list`. If the auto-merge is
# attributed to `GITHUB_TOKEN`, the resulting push to main does NOT create a
# `Release` workflow run, so the git tag / GitHub release would never be cut.
#
# WHY THE TAG CUT IS RECONCILED, NOT WAITED FOR (#494)
# The tag cut used to be a bounded poll inside the `workflow_run` job: enable
# auto-merge, then poll the PR for 30 min and dispatch `Release` on MERGED. That
# is a race this repo routinely loses. The poll starts when `Release` completes
# on main — before the release PR is green — and strict required-status policy
# means the PR usually needs another push, restarting the CI clock. Measured on
# 1.17.8: poll window 17:24:34-17:55:25, push at 17:44, merge at 18:10:58. The
# poll timed out 15m36s early; the tag was never cut; the manifest and
# `_version.py` had already moved to 1.17.8. Silent half-release, exit 0.
#
# No event can replace the poll: release-please's PR events never fire (see
# above) and a token-attributed merge fires no `push` either, so neither
# `pull_request` nor `push` can be used on the fast path. Hence the
# `reconcile-release-tag` job below, which compares the manifest version on the
# default branch against the published `v<version>` releases and dispatches
# `Release` when one is missing. That asks the API a question instead of waiting
# for a signal, so it is immune to the suppression above and idempotent once the
# tag exists. It reads the manifest at `ref=main` over the contents API —
# default-branch content, never PR-supplied — so it adds no checkout and
# preserves the security model below.
#
# The job is triggered three ways because no single one is sufficient. The gap is
# that a token-attributed release merge fires NO event at all, so the merge
# moment itself is invisible and any later signal is only a proxy for it:
#   - `push` to main: reliable for every human- or agent-authored push, which is
#     the common case, but silent for the token merge that needs the heal.
#   - `schedule`: covers the token-merge case, but cron is best-effort and was
#     measured dropping ~3 consecutive ticks — v1.17.9 sat untagged for ~33 min
#     until a manual dispatch, so the timer alone cannot be the safety net.
#   - `workflow_dispatch`: the deliberate manual backstop.
# The residual hole is narrow: if a token-attributed release merge is the
# repository's last event and cron happens to be skipping, a human dispatches.

name: Release PR auto-merge
on:
  workflow_run:
    # Must match the target workflow's `name:` in release-please.yml exactly.
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approve workflow runs blocked on bot approval (#275) + dispatch Release
  contents: write # enable auto-merge
  pull-requests: write

concurrency:
  group: release-pr-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Only react to a successful Release run; a failed run means there is no
    # fresh release PR to unblock.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # This job deliberately never checks out the repository (security model
      # note 1: no PR-supplied code is read or executed). Without a checkout
      # `gh` cannot infer the repository and dies with "fatal: not a git
      # repository", so GH_REPO supplies the context explicitly.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gate — discover and validate the release-please PR
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `workflow_run` carries no PR number and its head_branch is `main`,
          # so find the open release-please PR through the API and apply the
          # three eligibility gates below before acting on it.
          prs="$(gh pr list --state open \
            --search 'head:release-please--branches--' \
            --json number,author,headRefName,title --limit 100)"

          eligible=false
          pr_number=""
          while IFS=$'\t' read -r number author head_ref title; do
            [ -n "${number:-}" ] || continue
            echo "candidate PR #${number}: author=${author} head=${head_ref} title=${title}"

            case "$author" in
              "github-actions[bot]" | "app/github-actions") ;;
              *) echo "::notice::author '$author' is not release-please; skipping."; continue ;;
            esac
            case "$head_ref" in
              release-please--branches--*) ;;
              *) echo "::notice::head '$head_ref' is not a release-please branch; skipping."; continue ;;
            esac
            case "$title" in
              "chore(main): release "*) ;;
              *) echo "::notice::title is not a release bump; skipping."; continue ;;
            esac

            pr_number="$number"
            eligible=true
            break
          done < <(printf '%s' "$prs" | jq -r '.[] | [.number, .author.login, .headRefName, .title] | @tsv')

          if [ "$eligible" != true ] || [ -z "$pr_number" ]; then
            echo "::notice::no eligible release-please PR is open; nothing to do."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Approve workflow runs blocked on bot approval (#275)
        # Non-fatal by design (#494 follow-up): a failure here must not skip the
        # auto-merge enable or the tag cut below. The outcome is recorded and
        # asserted by the final step so the run still ends red and names the PR.
        if: steps.gate.outputs.eligible == 'true'
        continue-on-error: true
        id: approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Runs that concluded `action_required` are waiting for exactly this
          # approval; without it they never execute and never report a status.
          blocked="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')"
          if [ -z "$blocked" ]; then
            echo "No runs awaiting approval."
            echo "unapproved=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unapproved=""
          for run_id in $blocked; do
            name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.name')"
            echo "Approving run ${run_id} (${name})"
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null 2>&1; then
              echo "::notice::approved ${name}"
            else
              echo "::warning::GITHUB_TOKEN could not approve run ${run_id} (${name})."
              unapproved="${unapproved}${name}, "
            fi
          done
          echo "unapproved=${unapproved}" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (squash — the only method main-protection allows)
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          # --auto hands the "wait for required checks" decision to GitHub, so
          # the ruleset's required statuses are honoured rather than skipped.
          # squash is the only allowed_merge_methods value on main-protection.
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          echo "Auto-merge enabled; will land once the required checks pass."

      - name: Cut the release tag after the auto-merge lands
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Bounded wait for the merge. GitHub's native auto-merge (or the
          # token-driven push) may not fire a `Release` run, so once the PR is
          # MERGED we dispatch `Release` explicitly: a `workflow_dispatch`
          # event ALWAYS creates a run, even for a token-caused merge, because
          # the default-branch copy of the workflow files is used.
          merged=false
          ATTEMPTS=90
          INTERVAL=20
          for _ in $(seq 1 "$ATTEMPTS"); do
            state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
            echo "PR #${PR_NUMBER} state=${state}"
            if [ "$state" = "MERGED" ]; then
              merged=true
              break
            fi
            sleep "$INTERVAL"
          done

          if [ "$merged" != true ]; then
            # Fail loudly (#494). This used to warn and exit 0, so an expired
            # poll produced a silent half-release: manifest and _version.py
            # already bumped, no tag, no GitHub release, exit code 0. The
            # reconcile-release-tag job heals it within one timer tick, so a red
            # run here is informative rather than harmful.
            echo "::error::PR #${PR_NUMBER} was not MERGED after $((ATTEMPTS * INTERVAL / 60)) min; the release tag was NOT cut. reconcile-release-tag will cut it, but a release PR still open past the poll bound needs a human."
            exit 1
          fi

          gh workflow run release-please.yml
          echo "::notice::dispatched Release to cut the tag after #${PR_NUMBER} merged."

      - name: Assert no release run is left waiting on a human approval
        # `always()` so this still reports when the tag cut above timed out --
        # that is the common shape of the failure, and the approval gap is the
        # reason a human had to step in at all.
        if: always() && steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          UNAPPROVED: ${{ steps.approve.outputs.unapproved }}
        run: |
          set -euo pipefail
          if [ -n "${UNAPPROVED:-}" ]; then
            echo "::error::Release PR #${PR_NUMBER} still has workflow runs awaiting approval: ${UNAPPROVED}. GITHUB_TOKEN cannot approve runs of other workflows, and nothing retries it after this job, so the PR will stay BLOCKED until a human approves them on the PR's Checks tab. This is the step that left 1.17.9 stuck for ~12.6h."
            exit 1
          fi
          echo "No unapproved release runs."

  reconcile-release-tag:
    # Excluded from the workflow_run path on purpose: that path already tries to cut
    # the tag, and two dispatchers would race each other. `push` is the reliable
    # complement to `schedule` — see the header note on cron reliability.
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reconcile manifest version against published releases
        run: |
          set -euo pipefail
          desired="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=main" \
              --jq '.content' | tr -d '\n' | base64 -d | jq -r '.["."]'
          )"
          if [ -z "$desired" ] || [ "$desired" = "null" ]; then
            echo "::error::could not read the pinned version from the manifest on main."
            exit 1
          fi
          echo "manifest version on main: $desired"

          # Nothing in this workflow can approve a bot release PR's runs, and
          # nothing retries the attempt after the fast path fails -- so surface
          # the stuck PR here, where it is guaranteed to be looked at.
          stuck="$(
            gh pr list --state open --search 'head:release-please--branches--' \
              --json number,headRefOid --limit 20 \
              --jq '.[] | select(.number) | .number'
          )"
          for pr in $stuck; do
            sha="$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')"
            waiting="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")] | length')"
            if [ "$waiting" != "0" ]; then
              echo "::error::Release PR #${pr} has ${waiting} workflow run(s) awaiting approval and will stay BLOCKED until a human approves them. GITHUB_TOKEN cannot do it and no job retries it."
            else
              echo "Release PR #${pr} is open with no runs awaiting approval."
            fi
          done

          if gh release view "v${desired}" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "v${desired} is already published; nothing to reconcile."
            exit 0
          fi

          echo "::warning::v${desired} is pinned on main but not published. The release commit merged without its tag (token-attributed merge fires no push event). Dispatching Release to cut it."
          gh workflow run release-please.yml
          echo "::notice::dispatched Release to cut the missing v${desired}."
