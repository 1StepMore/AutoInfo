# AutoInfo demo domain: Financial/Business Intelligence
# Tracks market data, economic indicators, corporate filings, and financial news
name: financial-intelligence
description: "Financial and business intelligence — market data, economic indicators, corporate filings"

sources:
  - name: Alpha Vantage
    type: api
    url: https://www.alphavantage.co/query
    quality_tier: 1
    frequency: daily
    access: api_key
    requires_key: true
    rate_limit: 5  # requests per minute

  - name: FRED
    type: api
    url: https://api.stlouisfed.org/fred/
    quality_tier: 1
    frequency: daily
    access: api_key
    auth_mode: query
    params: {file_type: json, series_id: GDP}
    requires_key: true
    rate_limit: 120  # requests per minute

  - name: SEC EDGAR
    type: rss
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=10-K&output=atom
    quality_tier: 1
    frequency: daily
    access: free
    rate_limit: 10  # requests per second

  - name: Twelve Data
    type: api
    url: https://api.twelvedata.com/quote
    quality_tier: 2
    frequency: hourly
    access: api_key
    requires_key: true
    rate_limit: 8  # requests per minute (free tier)
    params: {apikey: YOUR_TWELVEDATA_KEY}
    field_mapping: {id: symbol, title: name, content: name, source_url: ''}

  - name: World Bank Data
    type: api
    url: https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.MKTP.CD
    quality_tier: 2
    frequency: daily
    access: free
    rate_limit: 30
    params: {format: json, per_page: 10}
    json_path: "1"
    field_mapping: {id: indicator.id, title: country.value, content: value, source_url: ''}

topics:
  - name: "Market Trends"
    keywords:
      - stock market
      - S&P 500
      - market trends
      - equities
      - trading
      - market analysis
  - name: "Economic Indicators"
    keywords:
      - GDP
      - inflation
      - unemployment
      - federal reserve
      - economic data
      - consumer price index
  - name: "Corporate Filings"
    keywords:
      - SEC filing
      - 10-K
      - 10-Q
      - earnings report
      - financial disclosure
      - quarterly results
