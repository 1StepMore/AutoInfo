# =============================================================================
# Scenario: collect-process
# Description: Verify collection + processing pipeline (dry-run, collect, process, summaries)
# Tags: collect, process, pipeline, regression
# =============================================================================

name: "Collection and Processing Pipeline"
description: >
  Tests the collection pipeline end-to-end: dry-run preview, actual collection,
  processing (without LLM — uses mock/dry-run path), and summaries list.
  Requires a project already initialized with a demo domain.

tags: [collect, process, pipeline, regression, cli]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-cp"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for collection tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "collect-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"

  # -------------------------------------------------------------------------
  # Step 2: Collect sources — dry-run
  # -------------------------------------------------------------------------
  - name: "Dry-run collection (preview without storing)"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo collect --domain ${DOMAIN} --dry-run --limit 3 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"
        - "Failed"

  # -------------------------------------------------------------------------
  # Step 3: Collect sources — actual collection
  # -------------------------------------------------------------------------
  - name: "Actual collection from domain sources"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo collect --domain ${DOMAIN} --limit 2 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 4: Collect with topic filter — dry-run
  # -------------------------------------------------------------------------
  - name: "Dry-run collection with topic filter"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo collect --domain ${DOMAIN} --topic "cancer" --dry-run --limit 3 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 5: Process collection (mock LLM / no LLM key)
  # -------------------------------------------------------------------------
  - name: "Process collected items (no LLM key — verify command exists)"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo process --domain ${DOMAIN} --help 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "process"
        - "--domain"

  # -------------------------------------------------------------------------
  # Step 6: Summaries list after collection
  # -------------------------------------------------------------------------
  - name: "List summaries for domain"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo summaries list --domain ${DOMAIN} 2>&1
    expected:
      exit_code: 0
      stdout_not_contains:
        - "ERROR"
        - "Traceback"
