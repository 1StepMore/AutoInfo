# AutoInfo demo domain: AI Commercial Intelligence
# Tracks AI startup funding, product launches, and industry trends
name: ai-commercial
description: "AI commercial intelligence — startup funding, product launches, industry trends"

sources:
  - name: techcrunch
    type: rss
    url: https://techcrunch.com/feed/
    quality_tier: 2
    frequency: hourly
    access: free
    rate_limit: 10

  - name: producthunt
    type: rss
    url: https://www.producthunt.com/feed
    quality_tier: 2
    frequency: daily
    access: free
    rate_limit: 10

  - name: Crunchbase
    type: rss
    url: https://news.crunchbase.com/feed/
    quality_tier: 2
    enabled: true

  - name: 36kr
    type: rss
    enabled: true
    url: "https://www.36kr.com/feed"
    quality_tier: 2
    settings:
      feed_url: "https://www.36kr.com/feed"
      rate_limit_per_second: 1
    field_mapping:
      id: id
      title: title
      content: content
      source_url: link
      published_date: updated
    topics:
      - Chinese tech
      - startup

topics:
  - name: "AI Startup Funding"
    keywords:
      - AI startup
      - artificial intelligence
      - funding
      - series A
      - venture capital
      - seed round
  - name: "AI Product Launches"
    keywords:
      - AI product
      - launch
      - LLM
      - GPT
      - generative AI
      - machine learning
