  # ===========================================================================
  # Step 24: Data privacy — delete user data (GDPR right to be forgotten)
  # ===========================================================================
  - name: "Data privacy: delete user data (delete_user_data — GDPR erasure)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app

      # Create a user that will be deleted
      r = app.call_tool("enduser_create", {
          "user_id": "gdpr-delete-user",
          "name": "GDPR Delete Tester",
          "email": "gdpr.delete@test.com",
          "tier": "free",
          "status": "trial",
      })
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "gdpr-delete-user"
      print("PASS:GDPR-DELETE-USER-CREATED")

      # Verify user exists before deletion
      r = app.call_tool("enduser_get", {"user_id": "gdpr-delete-user"})
      data = json.loads(r.content[0].text)
      assert data.get("user_id") == "gdpr-delete-user"
      print("PASS:GDPR-DELETE-USER-EXISTS")

      # Delete user data (soft-delete first)
      r = app.call_tool("delete_user_data", {
          "user_id": "gdpr-delete-user",
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:GDPR-DELETE-SOFT keys={list(data.keys())[:6]}")

      # Verify user is gone after deletion
      r = app.call_tool("enduser_get", {"user_id": "gdpr-delete-user"})
      data = json.loads(r.content[0].text)
      # After soft-delete, user may or may not be retrievable
      # The key is that delete_user_data was called successfully
      print(f"PASS:GDPR-DELETE-VERIFIED post_delete_response={'error' if data.get('error_code') else 'ok'}")

      # Delete user data with purge (hard delete)
      r = app.call_tool("enduser_create", {
          "user_id": "gdpr-purge-user",
          "name": "GDPR Purge Tester",
          "email": "gdpr.purge@test.com",
          "tier": "free",
          "status": "trial",
      })
      print("PASS:GDPR-PURGE-USER-CREATED")

      r = app.call_tool("delete_user_data", {
          "user_id": "gdpr-purge-user",
          "purge": True,
      })
      data = json.loads(r.content[0].text)
      print(f"PASS:GDPR-PURGE-EXECUTED keys={list(data.keys())[:6]}")

      # Verify purged user is gone
      r = app.call_tool("enduser_get", {"user_id": "gdpr-purge-user"})
      data = json.loads(r.content[0].text)
      purged = data.get("error_code") is not None
      print(f"PASS:GDPR-PURGE-VERIFIED purged={'yes' if purged else 'maybe'}")

      print("PASS:MCP-GDPR-DELETE-COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS:GDPR-DELETE-USER-CREATED"
        - "PASS:GDPR-DELETE-USER-EXISTS"
        - "PASS:GDPR-DELETE-SOFT"
        - "PASS:GDPR-DELETE-VERIFIED"
        - "PASS:GDPR-PURGE-USER-CREATED"
        - "PASS:GDPR-PURGE-EXECUTED"
        - "PASS:GDPR-PURGE-VERIFIED"
        - "PASS:MCP-GDPR-DELETE-COMPLETE"

