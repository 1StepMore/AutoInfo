# =============================================================================
# Scenario: mcp-system-tools
# Description: Verify MCP system, discovery, source, and topic tools via Python MCP calls
# Tags: mcp, system, discovery, source, topic, regression
# =============================================================================

name: "MCP System Tools Validation"
description: >
  Tests the MCP server API directly via Python: system tools (health_check,
  diagnose_system, get_config, list_available_models, get_tool_count), discovery
  tools (list_domains, get_domain_schema, list_available_platforms), source
  management tools (add_source, list_sources, remove_source), and topic
  management tools (add_topic, list_topics, remove_topic). Requires a project
  initialized with a demo domain.

tags: [mcp, system, discovery, source, topic, regression]
depends_on: [init-project]

variables:
  TEST_DIR: "/tmp/autoinfo-scenario-mcp-system"
  DOMAIN: "medical-research"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Init project (prerequisite)
  # -------------------------------------------------------------------------
  - name: "Initialize project for MCP tests"
    tool: bash
    setup: |
      rm -rf ${TEST_DIR}
      mkdir -p ${TEST_DIR}
    command: |
      cd ${TEST_DIR} && autoinfo init --demo ${DOMAIN} --name "mcp-system-test" 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "AutoInfo initialized"
    artifacts:
      - "${TEST_DIR}/.autoinfo/config.yaml"

  # -------------------------------------------------------------------------
  # Step 2: health_check — verify MCP server status
  # -------------------------------------------------------------------------
  - name: "MCP health_check returns status and version"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("health_check", {})
      data = json.loads(result.content[0].text)
      assert data["status"] == "ok", f"Expected status=ok, got {data}"
      assert "version" in data, "Missing version field"
      assert data.get("tools_count", 0) >= 68, f"Expected tools_count >= 68, got {data.get('tools_count', 0)}"
      print(f"PASS: health_check status={data['status']}, version={data.get('version')}, tools={data['tools_count']}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: health_check"

  # -------------------------------------------------------------------------
  # Step 3: diagnose_system — comprehensive health check
  # -------------------------------------------------------------------------
  - name: "MCP diagnose_system returns llm, sources, disk, db sections"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("diagnose_system", {})
      data = json.loads(result.content[0].text)
      sections = ["llm", "sources", "disk", "db"]
      for s in sections:
        assert s in data, f"Missing section: {s}"
      print(f"PASS: diagnose_system sections={list(data.keys())[:6]}")

  # -------------------------------------------------------------------------
  # Step 4: get_config — retrieve full project config
  # -------------------------------------------------------------------------
  - name: "MCP get_config returns project, llm, domains"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("get_config", {})
      data = json.loads(result.content[0].text)
      assert "project" in data, "Missing project section"
      assert "llm" in data, "Missing llm section"
      assert "domains" in data, "Missing domains section"
      domain_count = len(data.get("domains", []))
      assert domain_count >= 1, f"Expected >= 1 domain, got {domain_count}"
      print(f"PASS: get_config project={data.get('project',{}).get('name','?')}, domains={domain_count}")

  # -------------------------------------------------------------------------
  # Step 5: list_available_models — show configured LLM models
  # -------------------------------------------------------------------------
  - name: "MCP list_available_models returns model list"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_available_models", {})
      data = json.loads(result.content[0].text)
      assert "models" in data, "Missing models key"
      models = data["models"]
      assert len(models) > 0, "Expected at least 1 model"
      print(f"PASS: list_available_models count={len(models)}")

  # -------------------------------------------------------------------------
  # Step 6: get_tool_count — self-discovery of tool registry size
  # -------------------------------------------------------------------------
  - name: "MCP get_tool_count returns dynamic tool count"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("get_tool_count", {})
      data = json.loads(result.content[0].text)
      assert "count" in data, "Missing count field"
      assert data["count"] >= 115, f"Expected count >= 115, got {data['count']}"
      print(f"PASS: get_tool_count={data['count']}")

  # -------------------------------------------------------------------------
  # Step 7: list_domains — discover configured domains
  # -------------------------------------------------------------------------
  - name: "MCP list_domains returns domain list with active status"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_domains", {})
      data = json.loads(result.content[0].text)
      assert "domains" in data, "Missing domains key"
      domains = data["domains"]
      assert len(domains) >= 1, f"Expected >= 1 domain, got {len(domains)}"
      names = [d.get("name") for d in domains]
      assert "${DOMAIN}" in names, f"${DOMAIN} not found in {names}"
      print(f"PASS: list_domains found {names}")

  # -------------------------------------------------------------------------
  # Step 8: get_domain_schema — retrieve extraction schema
  # -------------------------------------------------------------------------
  - name: "MCP get_domain_schema returns extraction fields"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("get_domain_schema", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      has_fields = "fields" in data or "extraction_fields" in data
      assert has_fields, f"Missing fields/extraction_fields. Keys: {list(data.keys())[:5]}"
      print(f"PASS: get_domain_schema keys={list(data.keys())[:5]}")

  # -------------------------------------------------------------------------
  # Step 9: list_available_platforms — discover collector platforms
  # -------------------------------------------------------------------------
  - name: "MCP list_available_platforms returns supported platform types"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_available_platforms", {})
      data = json.loads(result.content[0].text)
      assert "platforms" in data, "Missing platforms key"
      platforms = data["platforms"]
      assert len(platforms) >= 6, f"Expected >= 6 platforms, got {len(platforms)}"
      names = [p.get("name") for p in platforms[:8]]
      print(f"PASS: list_available_platforms count={len(platforms)}, sample={names}")

  # -------------------------------------------------------------------------
  # Step 10: add_source — add a test source via MCP
  # -------------------------------------------------------------------------
  - name: "MCP add_source adds source to domain"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("add_source", {
          "domain": "${DOMAIN}",
          "name": "mcp-test-source",
          "type": "rss",
          "url": "https://example.com/mcp-feed"
      })
      data = json.loads(result.content[0].text)
      assert "status" in data or "name" in data, f"No confirmation in response: {list(data.keys())[:5]}"
      print(f"PASS: add_source response={data.get('status', data.get('name', 'OK'))}")

  # -------------------------------------------------------------------------
  # Step 11: list_sources — verify source was added
  # -------------------------------------------------------------------------
  - name: "MCP list_sources includes the newly added source"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_sources", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      sources = data.get("sources", data.get("items", []))
      names = [s.get("name") for s in sources]
      assert "mcp-test-source" in names, f"mcp-test-source not in {names}"
      print(f"PASS: list_sources found mcp-test-source")

  # -------------------------------------------------------------------------
  # Step 12: remove_source — clean up test source
  # -------------------------------------------------------------------------
  - name: "MCP remove_source removes the test source"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("remove_source", {"domain": "${DOMAIN}", "name": "mcp-test-source"})
      data = json.loads(result.content[0].text)
      print(f"PASS: remove_source response received")
      # Verify it's gone
      result = app.call_tool("list_sources", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      sources = data.get("sources", data.get("items", []))
      names = [s.get("name") for s in sources]
      assert "mcp-test-source" not in names, f"Source still present: {names}"
      print(f"PASS: remove_source verified — source no longer listed")

  # -------------------------------------------------------------------------
  # Step 13: add_topic — add a topic via MCP
  # -------------------------------------------------------------------------
  - name: "MCP add_topic adds topic with keywords"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("add_topic", {
          "domain": "${DOMAIN}",
          "name": "MCP Test Topic",
          "keywords": ["test", "mcp", "validation"]
      })
      data = json.loads(result.content[0].text)
      print(f"PASS: add_topic response={json.dumps(data)[:200]}")

  # -------------------------------------------------------------------------
  # Step 14: list_topics — verify topic was added
  # -------------------------------------------------------------------------
  - name: "MCP list_topics includes the newly added topic"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_topics", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      topics = data.get("topics", data.get("items", []))
      names = [t.get("name") for t in topics]
      assert "MCP Test Topic" in names, f"MCP Test Topic not in {names}"
      print(f"PASS: list_topics found MCP Test Topic")

  # -------------------------------------------------------------------------
  # Step 15: remove_topic — clean up test topic
  # -------------------------------------------------------------------------
  - name: "MCP remove_topic removes the test topic"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("remove_topic", {"domain": "${DOMAIN}", "name": "MCP Test Topic"})
      data = json.loads(result.content[0].text)
      print(f"PASS: remove_topic response received")
      # Verify it's gone
      result = app.call_tool("list_topics", {"domain": "${DOMAIN}"})
      data = json.loads(result.content[0].text)
      topics = data.get("topics", data.get("items", []))
      names = [t.get("name") for t in topics]
      assert "MCP Test Topic" not in names, f"Topic still present: {names}"
      print(f"PASS: remove_topic verified — topic no longer listed")

  # -------------------------------------------------------------------------
  # Step 16: Negative — call unknown tool (error handling)
  # -------------------------------------------------------------------------
  - name: "MCP unknown tool call returns error"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      try:
          result = app.call_tool("nonexistent_tool_name", {})
          print("UNEXPECTED: call_tool did not raise for unknown tool")
          sys.exit(1)
      except Exception as e:
          print(f"PASS: unknown tool correctly raised exception: {type(e).__name__}")

  # -------------------------------------------------------------------------
  # Step 17: list_available_platforms — verify all 6+ base types
  # -------------------------------------------------------------------------
  - name: "MCP list_available_platforms has at least 6 base types"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      result = app.call_tool("list_available_platforms", {})
      data = json.loads(result.content[0].text)
      platforms = data["platforms"]
      names = [p.get("name") for p in platforms]
      # 6 base types: RSS, REST API, web, webhook, email, PDF
      expected_bases = ["rss", "api", "web", "webhook", "email", "pdf"]
      found_bases = [n for n in names if any(e in n.lower() for e in expected_bases)]
      print(f"PASS: list_available_platforms total={len(platforms)}, base_types_found={found_bases}")
  # -------------------------------------------------------------------------
  # Step 18: set_domain_webhooks e2e callback delivery (25.3)
  # -------------------------------------------------------------------------
  - name: "set_domain_webhooks e2e callback delivery via mock HTTP listener"
    tool: bash
    command: |
      cd ${TEST_DIR}
      # Start a background mock HTTP listener on port 19997
      python3 -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json, threading, sys
      received = []
      class H(BaseHTTPRequestHandler):
          def do_POST(self):
              content_len = int(self.headers.get('Content-Length', 0))
              body = self.rfile.read(content_len)
              received.append(json.loads(body))
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'ok')
      server = HTTPServer(('127.0.0.1', 19997), H)
      t = threading.Thread(target=server.serve_forever, daemon=True)
      t.start()
      print('MOCK_SERVER_READY')
      # Wait for webhook to fire
      import time; time.sleep(3)
      server.shutdown()
      print('WEBHOOKS_RECEIVED=' + str(len(received)))
      " 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "MOCK_SERVER_READY"
  # -------------------------------------------------------------------------
  # Step 19: get_domain_webhooks round-trip (25.4)
  # -------------------------------------------------------------------------
  - name: "get_domain_webhooks round-trip verification"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      test_url = "https://example.com/webhook-roundtrip"
      # Set webhook
      r = app.call_tool("set_domain_webhooks", {"domain": "${DOMAIN}", "url": test_url})
      data = json.loads(r.content[0].text)
      assert data.get("success") or "url" in str(data).lower(), f"Set failed: {data}"
      # Get webhooks and verify round-trip
      r = app.call_tool("get_domain_webhooks", {"domain": "${DOMAIN}"})
      data = json.loads(r.content[0].text)
      webhooks = data.get("webhooks", data.get("urls", []))
      found = test_url in str(webhooks)
      print(f"PASS: set_domain_webhooks round-trip found={found}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: set_domain_webhooks round-trip"
  # -------------------------------------------------------------------------
  # Step 20: set_domain_webhooks invalid URL rejected (25.5)
  # -------------------------------------------------------------------------
  - name: "set_domain_webhooks invalid URL rejected"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      r = app.call_tool("set_domain_webhooks", {"domain": "${DOMAIN}", "url": "ftp://invalid-protocol"})
      data = json.loads(r.content[0].text)
      assert data.get("success") == False or data.get("error_code") is not None, f"Expected rejection: {data}"
      print(f"PASS: invalid URL rejected error_code={data.get('error_code', 'N/A')}")
    expected:
      exit_code: 0
      stdout_contains:
        - "PASS: invalid URL rejected"
