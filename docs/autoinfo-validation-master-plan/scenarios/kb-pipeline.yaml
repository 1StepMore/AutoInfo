      stdout_contains:
        - "import_kb"
        - "json"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 6: KB export — JSON format (MCP)
  # -------------------------------------------------------------------------
  - name: "Export KB to JSON format via MCP"
