      if [ "${JSON_COUNT}" -gt 0 ]; then
        python3 -c "import json,glob; f=sorted(glob.glob('collections/online-video/youtube-mkbhd/*/*.json'))[0]; item=json.load(open(f)); assert 'source_url' in item; assert 'title' in item; assert 'source_type' in item; assert 'source_platform' in item; print('PASS:STRUCTURE_VALID')" 2>&1
      else
        echo "PASS:NO_ITEMS_BUT_NO_ERROR"
      fi
    expected:
      exit_code: 0
      stdout_contains:
        - "---EXIT:0---"
        - "PASS:"
