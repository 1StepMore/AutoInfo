# Regression #104: _cache_items crashed on int item.id (GitHub Trending source).
# _cache_items assumed item.id was str and called .replace() directly; GitHub
# Trending returned int ids causing AttributeError.  Fix: type guard
# ``safe_id = str(item.id).replace("/", "_") if item.id else item.id``.
# This scenario exercises the fixed _cache_items directly via a CLI step
# constructing Item objects with int and str-with-slash ids — deterministic,
# no network or env gating needed.
#
# Fortification (plan todo T9b): the step now runs inside an ABSOLUTE temp
# directory (tempfile.mkdtemp is always absolute) with a guaranteed cleanup —
# try/finally restores the previous cwd and shutil.rmtree's the tmp dir, so a
# failed assertion can never leak a collections/ dir or leave the process in
# a mutated cwd.  Path math is done against the absolute Path(tmp) base only.
name: regression-collect-int-id
description: "Regression #104: _cache_items survives int item ids (GitHub Trending)"
category: regression
regression: true
regression_issue: "#104"
requires_env: []
steps:
  - name: "cache items with int id and str id containing slash"
    kind: cli
    command: |-
      python3 -c '
      import os, shutil, tempfile
      from pathlib import Path
      from autoinfo.collect import _cache_items
      from autoinfo.models import Item

      def mk(i, url):
          return Item(id=i, source_name="regression-104", source_type="web",
                      source_url=url, title="t", content="c")

      tmp = Path(tempfile.mkdtemp(prefix="regression-104-"))
      old_cwd = os.getcwd()
      try:
          os.chdir(tmp)
          _cache_items(
              [mk(12345, "https://x.dev/1"), mk("a/b", "https://x.dev/2")],
              "regression-104", "int-id-source")
          # Absolute base for path math — relative_to() on a relative
          # Path would raise when the base is absolute (py3.12+ rglob).
          base = tmp.resolve()
          files = sorted(str(p.relative_to(base)) for p in (base / "collections").rglob("*.json"))
          assert any(f.endswith("12345.json") for f in files), files
          assert any(f.endswith("a_b.json") for f in files), files
          print("CACHE_ITEMS_INT_ID_OK")
      finally:
          os.chdir(old_cwd)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["CACHE_ITEMS_INT_ID_OK"]
