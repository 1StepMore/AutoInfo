name: Feature request
about: Suggest a new feature or improvement
title: "[Feature] "
labels: ["feature"]
assignees: ""
body:
  - type: dropdown
    id: ownership
    attributes:
      label: 归属（owner）
      description: 默认「任一侧可做」。只在换一侧根本做不了时才指定（判据见 docs/dev/autonomy.md）。
      options:
        - 任一侧可做（默认，不标 owner:*）
        - 只有本机侧能做：重依赖模态（视频/音频/图片渲染）→ owner:code-auto
        - 只有主人侧能做：Windows 原生 / 需要他的账号额度或外部动作 → owner:human-agent
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What the feature is and what it should do.
      placeholder: "A clear description of the feature."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: Who needs this and why. What problem does it solve?
      placeholder: "e.g. Operators want to ... because ..."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What the feature should look like when done, including any interface (CLI, MCP tool, REST) changes.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you considered and why they are insufficient.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What "done" looks like — the checks a reviewer can verify.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Keep the change small and reviewable. Note any parts that could be split into follow-up PRs.
    validations:
      required: false
