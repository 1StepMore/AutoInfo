{% extends "base.html" %}
{% block title %}Error — AutoInfo Storefront{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-danger">
      <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 d-block mb-3"></i>
        <h2 class="h4 mb-2">Something went wrong</h2>
        <p class="text-muted mb-3">{{ error_message }}</p>
        <a href="/storefront/products" class="btn btn-primary">
          <i class="bi bi-arrow-left me-1"></i>Back to Catalog
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
