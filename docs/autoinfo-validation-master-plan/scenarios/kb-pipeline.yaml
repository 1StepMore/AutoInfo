  # -------------------------------------------------------------------------
  # Step 15: KB versioning — restore_entry_version (graceful on no history)
  # -------------------------------------------------------------------------
  - name: "Restore entry version (no history — should handle gracefully)"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      search = app.call_tool("search_knowledge_base", {
          "domain": "medical-research",
          "query": "Imported",
          "limit": 1
      })
      search_data = json.loads(search.content[0].text)
      entries = search_data.get("entries", [])
      if entries:
          entry_id = entries[0].get("entry_id", entries[0].get("id", ""))
          try:
              result = app.call_tool("restore_entry_version", {
                  "version_id": "nonexistent-version"
              })
              data = json.loads(result.content[0].text)
              print(json.dumps({"tool": "restore_entry_version", "status": "handled", "response_keys": list(data.keys())[:5]}))
          except Exception as e:
              print(json.dumps({"tool": "restore_entry_version", "status": "exception", "error_type": type(e).__name__}))
      else:
          print(json.dumps({"tool": "restore_entry_version", "status": "no_entries"}))
    expected:
      exit_code: 0
      stdout_contains:
        - "restore_entry_version"
      stdout_not_contains:
        - "Traceback"

