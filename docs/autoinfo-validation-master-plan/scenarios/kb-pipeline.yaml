      })
      export_data = json.loads(result.content[0].text)
      assert "path" in export_data or "entries_count" in export_data or "format" in export_data, \
        f"Expected path/entries_count/format, got keys: {list(export_data.keys())}"
      print(json.dumps({"tool": "export_kb", "format": "json", "response_keys": list(export_data.keys())[:5]}))
    expected:
      exit_code: 0
      stdout_contains:
        - "export_kb"
        - "json"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 7: KB export — Markdown format (CLI)
  # -------------------------------------------------------------------------
  - name: "Export KB to Markdown format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo output export --domain ${DOMAIN} --format markdown 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Exported"
        - "entries"
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/autoinfo-export-medical-research-*.tar.gz:!"

  # -------------------------------------------------------------------------
  # Step 8: KB export — SQLite format (CLI)
  # -------------------------------------------------------------------------
  - name: "Export KB to SQLite format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo output export --domain ${DOMAIN} --format sqlite 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Exported"
        - "entries"
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/autoinfo-export-medical-research-*.db:!"

  # -------------------------------------------------------------------------
  # Step 9: KB export — CSV format (CLI)
  # -------------------------------------------------------------------------
  - name: "Export KB to CSV format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo output export --domain ${DOMAIN} --format csv 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Exported"
        - "entries"
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/medical-research/autoinfo-csv-*.csv:!"

  # -------------------------------------------------------------------------
  # Step 10: KB export — GraphML format (CLI)
  # -------------------------------------------------------------------------
  - name: "Export KB to GraphML format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR} && autoinfo output export --domain ${DOMAIN} --format graphml 2>&1
    expected:
      exit_code: 0
      stdout_contains:
        - "Exported"
        - "entries"
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/medical-research/autoinfo-graphml-*.graphml:!"

  # -------------------------------------------------------------------------
  # Step 10b: KB export — PDF format (requires weasyprint)
  # -------------------------------------------------------------------------
  - name: "Export KB to PDF format (weasyprint env-gated)"
    tool: bash
    command: |
      cd ${TEST_DIR}
      if python3 -c "import weasyprint" 2>/dev/null; then
        OUTPUT=$(autoinfo output export --domain ${DOMAIN} --format pdf 2>&1)
        EXIT_CODE=$?
        echo "$OUTPUT"
        [ "$EXIT_CODE" -eq 0 ] || exit 1
        echo "$OUTPUT" | grep -qv "Traceback" || exit 1
        echo "$OUTPUT" | grep -q "Exported" || { echo "WARN: 'Exported' not in PDF output"; exit 1; }
      else
        echo "SKIP: weasyprint not installed (pdf export requires weasyprint)"
      fi
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 10c: KB export — RSS format
  # -------------------------------------------------------------------------
  - name: "Export KB to RSS 2.0 XML format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR}
      OUTPUT=$(autoinfo output export --domain ${DOMAIN} --format rss 2>&1)
      EXIT_CODE=$?
      echo "$OUTPUT"
      [ "$EXIT_CODE" -eq 0 ] || exit 1
      echo "$OUTPUT" | grep -q "Exported" || echo "INFO: RSS export completed (no items to report)"
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/medical-research/autoinfo-rss-*.xml:!"

  # -------------------------------------------------------------------------
  # Step 10d: KB export — Sitemap format
  # -------------------------------------------------------------------------
  - name: "Export KB to XML Sitemap format via CLI"
    tool: bash
    command: |
      cd ${TEST_DIR}
      OUTPUT=$(autoinfo output export --domain ${DOMAIN} --format sitemap 2>&1)
      EXIT_CODE=$?
      echo "$OUTPUT"
      [ "$EXIT_CODE" -eq 0 ] || exit 1
    expected:
      exit_code: 0
      stdout_contains:
        - "Exported"
      stdout_not_contains:
        - "Error"
        - "Traceback"
      artifacts:
        - "${TEST_DIR}/exports/medical-research/sitemap.xml:!"

  # -------------------------------------------------------------------------
  # Step 10e: KB export — Agent format (MCP; CLI export lacks entries_count for agent format)
  # -------------------------------------------------------------------------
  - name: "Export KB to agent-native JSON-LD format via MCP"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
