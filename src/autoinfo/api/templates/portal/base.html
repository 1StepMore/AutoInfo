<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoInfo Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .empty-state { padding: 4rem 1rem; text-align: center; color: var(--bs-secondary-color); }
    .meta-grid dt { width: 12rem; font-weight: 600; }
    .meta-grid dd { margin-bottom: 0.25rem; }
    .pref-key { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .pref-val { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; white-space: pre-wrap; word-break: break-word; }
    .stat-card { transition: transform 0.12s; }
    .stat-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/portal/{{ user_id }}">
        <i class="bi bi-person-circle text-primary me-1"></i>AutoInfo Portal
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#portalNav" aria-controls="portalNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="portalNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/portal/{{ user_id }}">
              <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% block nav_preferences %}{% endblock %}" href="/portal/{{ user_id }}/preferences">
              <i class="bi bi-sliders me-1"></i>Preferences
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% block nav_history %}{% endblock %}" href="/portal/{{ user_id }}/history">
              <i class="bi bi-clock-history me-1"></i>History
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% block nav_products %}{% endblock %}" href="/portal/{{ user_id }}/products">
              <i class="bi bi-box-seam me-1"></i>Products
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          {% if user_id %}
          <span class="navbar-text small text-muted d-none d-md-inline">
            <i class="bi bi-person"></i> {{ user_id }}
          </span>
          {% endif %}
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Toggle dark mode">
            <i class="bi bi-circle-half"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    "use strict";
    const toggle = document.getElementById("themeToggle");
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-bs-theme", theme);
      localStorage.setItem("autoinfo-theme", theme);
      if (toggle) {
        toggle.innerHTML = theme === "dark"
          ? '<i class="bi bi-sun-fill"></i>'
          : '<i class="bi bi-moon-fill"></i>';
      }
    }
    (function initTheme() {
      const saved = localStorage.getItem("autoinfo-theme");
      if (saved) { applyTheme(saved); }
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        applyTheme("dark");
      }
    })();
    if (toggle) {
      toggle.addEventListener("click", function () {
        const cur = document.documentElement.getAttribute("data-bs-theme") || "light";
        applyTheme(cur === "dark" ? "light" : "dark");
      });
    }
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
