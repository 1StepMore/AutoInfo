  - name: "Delivery log querying via MCP (seed → query_delivery_log → get_delivery_log)"
    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      from autoinfo.mcp.server import app
      from autoinfo.user_store import create_profile, create_subscription
      from autoinfo.delivery_log import append_delivery_log

      # Create a user and subscription for delivery log testing
      p = create_profile(
          user_id="dellog-user",
          name="Delivery Log Tester",
          email="dellog@test.com",
          status="active",
          tier="pro",
      )
      sub = create_subscription(
          user_id="dellog-user",
          product_id="medical-research-processed",
          status="active",
      )
      sid = sub.sub_id
      print(f"PASS:DELLOG-SUB-CREATED sub_id={sid}")

      # Seed multiple delivery log entries with different channels and statuses
      channels = ["email", "telegram", "webhook", "discord", "smtp", "rss"]
      statuses = ["delivered", "success", "failed", "retrying", "pending"]
      for i in range(12):
          ch = channels[i % len(channels)]
          st = statuses[i % len(statuses)]
          append_delivery_log(
              subscription_id=sid,
              channel=ch,
              message_type="digest" if i % 2 == 0 else "alert",
              status=st,
              attempt_count=1 + (i % 3),
              error_message="timeout" if st == "failed" else None,
              sla_tier="critical" if i < 4 else "standard",
          )
      print("PASS:DELLOG-SEEDED-12")

      # Query delivery log by subscription_id
      r = app.call_tool("query_delivery_log", {
          "subscription_id": sid,
          "limit": 10,
      })
      data = json.loads(r.content[0].text)
      assert len(data) >= 10, f"Expected >= 10, got {len(data)}"
      print(f"PASS:DELLOG-QUERY count={len(data)}")

      # Query with status filter
      r = app.call_tool("query_delivery_log", {
          "subscription_id": sid,
          "status": "failed",
          "limit": 10,
      })
      data = json.loads(r.content[0].text)
      # status filter is post-query; verify all returned have status=failed
      all_failed = all(e.get("status") == "failed" for e in data) or len(data) == 0
      print(f"PASS:DELLOG-STATUS-FILTER all_failed={all_failed} count={len(data)}")

      # Get delivery log with pagination (no subscription_id filter)
      r = app.call_tool("get_delivery_log", {
          "limit": 5,
          "offset": 0,
      })
      data = json.loads(r.content[0].text)
      deliveries = data.get("deliveries", [])
      assert len(deliveries) <= 5, f"Pagination failed: {len(deliveries)}"
      assert data.get("limit") == 5
      print(f"PASS:DELLOG-PAGINATION limit=5 count={data.get('count', 0)}")

      # Get second page
      r = app.call_tool("get_delivery_log", {
          "limit": 5,
          "offset": 5,
      })
      data = json.loads(r.content[0].text)
      page2 = data.get("deliveries", [])
      print(f"PASS:DELLOG-PAGE2 count={len(page2)} offset={data.get('offset', 0)}")

      # Get all (no limit)
      r = app.call_tool("get_delivery_log", {})
      data = json.loads(r.content[0].text)
      print(f"PASS:DELLOG-ALL count={data.get('count', 0)}")

      # Cleanup
      app.call_tool("enduser_delete", {"user_id": "dellog-user"})
      print("PASS:DELLOG-USER-CLEANED")

      print("PASS:MCP-DELIVERY-LOG-COMPLETE")
    expected:
