# Nightly full-suite run (M0T9).
#
# Runs the ENTIRE test suite (excluding `real_api`) on a schedule so slow,
# env-sensitive, or order-dependent failures surface outside the push/PR CI.
# SEQUENTIAL only: the CWD-fixture tests (test_bug_40 etc.) are not
# xdist-safe, so no pytest-xdist / -n flags may be added here.
#
# Note on env keys: none required. Env-dependent tests are skip-gated
# (requires_optional_dep / requires_llm_key in tests/conftest.py) or report
# unconfigured, so this workflow runs with a bare runner environment.

name: Nightly full suite

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full suite (sequential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango-1.0-0

      # FULL extra set so the nightly exercises the pdf/tts/video/ebook
      # paths (skip-gates only kick in where deps are truly missing).
      # NOTE: explicit extras, NOT `[all]` (all == this exact set anyway),
      # and NOT `stripe` — stripe is a CORE dependency, not an extra
      # (a nonexistent extra makes pip fail the install).
      # akshare extra lands with M2T19 — add `,akshare` here when it exists
      - name: Install package
        run: pip install -e ".[dev,web,pdf,tts,video,ebook]"

      - name: Run full test suite (sequential)
        run: |
          set -o pipefail
          pytest -m "not real_api" -q --junitxml=nightly-junit.xml 2>&1 | tee nightly-pytest.log
        # --timeout (180s) from pyproject applies; no xdist here by design.

      # AX verification gate (agent-infra remediation plan 2026-10-30, Wave
      # 2.3): M-04 (doc freshness via doc_inventory --check) and M-05 (token
      # baseline, keyless — the baseline is a committed file) gate here on
      # every nightly. Run-sourced metrics (M-01/02/03/06) report UNMEASURED
      # on this fresh checkout by design — UNMEASURED never fails the gate;
      # they activate automatically once nightly validation runs are
      # persisted (plan decision point B1).
      - name: AX metrics gate (M-04/M-05)
        run: python scripts/ax_metrics.py

      # Persisted validation-suite run (agent-infra remediation plan
      # 2026-10-30, decision B1): same engine entry as the MCP
      # run_all_validation_scenarios tool; persists the aggregate suite run +
      # sessions report + category-pyramid ledger — the run records ax_metrics
      # M-01/02/03/06 and the regression flywheel consume. Env/domain-gated
      # scenarios report `unconfigured` on this fresh checkout (honest, never
      # fake-passed). Scenario failures are printed, not fatal: PR CI already
      # gates the keyless subset (scenario_portability_gate); this step's
      # deliverable is the persisted evidence.
      - name: Persist validation suite run (decision B1)
        run: python scripts/nightly_validation_run.py

      - name: Upload triage artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-failure-triage
          path: |
            nightly-junit.xml
            nightly-pytest.log
            tests/TRIAGE.md
          if-no-files-found: error
