          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      result = app.call_tool("export_kb", {
          "domain": "medical-research",
          "format": "agent"
      })
      agent_data = json.loads(result.content[0].text)
      assert "@type" in agent_data or "entries" in agent_data, \
        f"Expected @type/entries in agent export, got keys: {list(agent_data.keys())[:8]}"
      print(json.dumps({"tool": "export_kb", "format": "agent", "response_keys": list(agent_data.keys())[:8]}))
    expected:
      exit_code: 0
      stdout_contains:
        - "export_kb"
        - "agent"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 10f: Podcast RSS validation — verify RSS 2.0 structure
  # -------------------------------------------------------------------------
  - name: "Validate RSS 2.0 XML structure (channel + item elements)"
    tool: bash
    command: |
      cd ${TEST_DIR}
      OUTPUT=$(autoinfo output export --domain ${DOMAIN} --format rss 2>&1)
      RSS_FILE=$(echo "$OUTPUT" | grep -oP 'exports/[^\s]+\.xml' | head -1)
      if [ -n "$RSS_FILE" ] && [ -f "${TEST_DIR}/${RSS_FILE}" ]; then
        echo "=== RSS XML structure ==="
        grep -q '<rss ' "${TEST_DIR}/${RSS_FILE}" && echo "rss_root: present" || echo "rss_root: absent"
        grep -q '<channel>' "${TEST_DIR}/${RSS_FILE}" && echo "channel: present" || echo "channel: absent"
        grep -q '<item>' "${TEST_DIR}/${RSS_FILE}" && echo "items: present" || echo "items: none (empty KB)"
        wc -c < "${TEST_DIR}/${RSS_FILE}" | xargs echo "file_size_bytes:"
      else
        echo "rss_file: not_found (empty KB or export no-op)"
      fi
    expected:
      exit_code: 0
      stdout_not_contains:
        - "Error"
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 11: KB versioning — get_entry_history
  # -------------------------------------------------------------------------
  - name: "Get entry version history via MCP"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      # Search for an entry to get its ID
      search = app.call_tool("search_knowledge_base", {
          "domain": "medical-research",
          "query": "Imported",
          "limit": 1
      })
      search_data = json.loads(search.content[0].text)
      entries = search_data.get("entries", [])
      if entries:
          entry_id = entries[0].get("entry_id", entries[0].get("id", ""))
          result = app.call_tool("get_entry_history", {"entry_id": entry_id})
          hist_data = json.loads(result.content[0].text)
          versions = hist_data.get("versions", hist_data.get("history", []))
          print(json.dumps({"tool": "get_entry_history", "version_count": len(versions)}))
      else:
          print(json.dumps({"tool": "get_entry_history", "version_count": 0, "note": "no entries found"}))
    expected:
      exit_code: 0
      stdout_contains:
        - "get_entry_history"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 12: KB relations — link_items + get_item_relations
  # -------------------------------------------------------------------------
  - name: "Link items with relation type and verify"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())
      
      app = _App()

      search = app.call_tool("search_knowledge_base", {
          "domain": "medical-research",
          "query": "Imported",
          "limit": 2
      })
      search_data = json.loads(search.content[0].text)
      entries = search_data.get("entries", [])
      if len(entries) >= 2:
          id1 = entries[0].get("entry_id", entries[0].get("id", ""))
          id2 = entries[1].get("entry_id", entries[1].get("id", ""))
          result = app.call_tool("link_items", {
              "item_a_id": id1,
              "item_b_id": id2,
              "relation_type": "related_to"
          })
          link_data = json.loads(result.content[0].text)

          # Verify relation
          rel_result = app.call_tool("get_item_relations", {"item_id": id1})
          rel_data = json.loads(rel_result.content[0].text)
          relations = rel_data.get("relations", rel_data.get("items", []))
          print(json.dumps({"tool": "link_items", "relation_count": len(relations)}))
      else:
          print(json.dumps({"tool": "link_items", "relation_count": 0, "note": "< 2 entries"}))
    expected:
      exit_code: 0
      stdout_contains:
        - "link_items"
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 13: Knowledge graph query
  # -------------------------------------------------------------------------
  - name: "Query knowledge graph via MCP"
    tool: python
    command: |
      import sys, os, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt
      
      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)
      
      class _App:
          def call_tool(self, name, args=None):
