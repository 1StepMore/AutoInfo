# Observability tools — trace, metrics, prometheus, audit log.
name: observability
description: "Observability tools — trace, metrics, prometheus, audit log"
category: observability
requires_env: []
steps:
  - name: "trace_item returns pipeline timeline for dummy trace_id"
    tool: trace_item
    arguments:
      trace_id: "00000000-0000-0000-0000-000000000000"
    expect:
      success: true
      data_has: ["trace_id", "pipeline_events", "kb_entries"]

  - name: "get_metrics returns collected system metrics"
    tool: get_metrics
    arguments: {}
    expect:
      success: true
      data_has: ["items_collected_total"]

  - name: "get_prometheus_metrics returns exposition-format text"
    tool: get_prometheus_metrics
    arguments: {}
    expect:
      success: true
      data_has: ["format", "metrics_text"]

  - name: "query_audit_log returns entries with count"
    tool: query_audit_log
    arguments:
      limit: 5
    expect:
      success: true
      data_has: ["entries", "count"]
