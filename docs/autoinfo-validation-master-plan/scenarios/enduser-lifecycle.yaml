    tool: python
    command: |
      import os, sys, json
      os.chdir("${TEST_DIR}")
      import asyncio, json
      from autoinfo.mcp.server import call_tool as _ct, list_tools as _lt

      class _Result:
          def __init__(self, texts):
              self.content = texts
          def __getitem__(self, k): return json.loads(self.content[0].text)[k]
          def get(self, k, d=None): return json.loads(self.content[0].text).get(k, d)
          def __contains__(self, k): return k in json.loads(self.content[0].text)

      class _App:
          def call_tool(self, name, args=None):
              texts = asyncio.run(_ct(name, args or {}))
              try:
                  d = json.loads(texts[0].text)
                  if isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), dict):
                      texts = [type(texts[0])(type="text", text=json.dumps({**d, **d["data"]}))]
                  elif isinstance(d, dict) and d.get("success") and isinstance(d.get("data"), list):
                      texts = [type(texts[0])(type="text", text=json.dumps(d["data"]))]
              except Exception:
                  pass
              return _Result(texts)
          def list_tools(self):
              return asyncio.run(_lt())

      app = _App()
      from autoinfo.user_store import create_profile, create_subscription
      from autoinfo.delivery_log import append_delivery_log

      p = create_profile(
          user_id="dellog-user",
          name="Delivery Log Tester",
          email="dellog@test.com",
          status="active",
          tier="pro",
      )
      sub = create_subscription(
          user_id="dellog-user",
          products=["medical-research-processed"],
          status="active",
      )
      sid = sub.subscription_id
      print(f"DELLOG_SUB_CREATED sub_id={sid}")

      # Seed multiple delivery log entries
      channels = ["email", "telegram", "webhook", "discord", "smtp", "rss"]
      statuses = ["delivered", "success", "failed", "retrying", "pending"]
      for i in range(12):
          ch = channels[i % len(channels)]
          st = statuses[i % len(statuses)]
          append_delivery_log(
              subscription_id=sid,
              channel=ch,
              message_type="digest" if i % 2 == 0 else "alert",
              status=st,
              attempt_count=1 + (i % 3),
              error_message="timeout" if st == "failed" else "",
              sla_tier="critical" if i < 4 else "standard",
          )
      print("DELLOG_SEEDED count=12")

      # Query delivery log by subscription_id
      r = app.call_tool("query_delivery_log", {"subscription_id": sid, "limit": 10})
      data = json.loads(r.content[0].text)
      assert len(data) >= 10, f"Expected >= 10, got {len(data)}"
      print(f"DELLOG_QUERY count={len(data)}")

      # Query with status filter
      r = app.call_tool("query_delivery_log", {"subscription_id": sid, "status": "failed", "limit": 10})
      data = json.loads(r.content[0].text)
      all_failed = all(e.get("status") == "failed" for e in data) or len(data) == 0
      print(f"DELLOG_STATUS_FILTER all_failed={all_failed} count={len(data)}")

      # Get delivery log with pagination
      r = app.call_tool("get_delivery_log", {"limit": 5, "offset": 0})
      data = json.loads(r.content[0].text)
      deliveries = data.get("deliveries", [])
      assert len(deliveries) <= 5, f"Pagination failed: {len(deliveries)}"
      assert data.get("limit") == 5
      print(f"DELLOG_PAGINATION limit=5 count={data.get('count', 0)}")

      # Get second page
      r = app.call_tool("get_delivery_log", {"limit": 5, "offset": 5})
      data = json.loads(r.content[0].text)
      page2 = data.get("deliveries", [])
      print(f"DELLOG_PAGE2 count={len(page2)} offset={data.get('offset', 0)}")

      # Get all
      r = app.call_tool("get_delivery_log", {})
      data = json.loads(r.content[0].text)
      print(f"DELLOG_ALL count={data.get('count', 0)}")

      # Cleanup
      app.call_tool("enduser_delete", {"user_id": "dellog-user"})
      print("DELLOG_USER_CLEANED")

      print("MCP_DELIVERY_LOG_COMPLETE")
    expected:
      exit_code: 0
      stdout_contains:
        - "DELLOG_SUB_CREATED"
        - "DELLOG_SEEDED"
        - "DELLOG_QUERY"
        - "DELLOG_STATUS_FILTER"
        - "DELLOG_PAGINATION"
        - "DELLOG_PAGE2"
        - "DELLOG_ALL"
        - "DELLOG_USER_CLEANED"
        - "MCP_DELIVERY_LOG_COMPLETE"
