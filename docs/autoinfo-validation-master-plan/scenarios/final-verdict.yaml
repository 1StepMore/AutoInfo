# =============================================================================
# Scenario: final-verdict
# Description: Aggregate summary verdict checks across all validation parts.
#              Verifies scenario coverage, production gap checklist, and
#              sign-off criteria readiness.
# Tags: verdict, summary, checklist, sign-off, regression
# =============================================================================

name: "Final Verdict Validation"
description: >
  Aggregates validation results across all 15 parts: counts scenario files
  covering each question, verifies the production gap checklist items,
  checks overall project status, and evaluates sign-off criteria.
  This scenario is the last to run — it depends on all other scenarios
  reporting their individual results.
tier: 1

tags: [verdict, summary, checklist, sign-off, production, regression]
depends_on:
  - init-project
  - core-pipeline
  - cli-full
  - mcp-system-tools
  - mcp-kb-output
  - quality-gates
  - kb-pipeline
  - rest-api-webui
  - agent-e2e
  - async-cron-email
  - error-boundary
  - production-validation
  - enduser-lifecycle
  - human-agent-collaboration
  - cross-dimension-e2e

variables:
  SCENARIOS_DIR: "/mnt/d/贯维/AutoInfo/docs/autoinfo-validation-master-plan/scenarios"

steps:
  # -------------------------------------------------------------------------
  # Step 1: Verify all scenario YAML files exist
  # -------------------------------------------------------------------------
  - name: "All 22 scenario YAML files exist"
    tool: bash
    command: |
      DIR="${SCENARIOS_DIR}"
      EXPECTED_FILES="init-project core-pipeline collect-process cli-full domain-management mcp-system-tools mcp-kb-output output-digest output-report search-kb quality-gates kb-pipeline rest-api-webui agent-e2e async-cron-email error-boundary production-validation final-verdict enduser-lifecycle enduser-deliverable human-agent-collaboration cross-dimension-e2e"
      COUNT=0
      for f in $EXPECTED_FILES; do
        if [ -f "$DIR/$f.yaml" ]; then
          echo "  FOUND $f.yaml"
          COUNT=$((COUNT + 1))
        else
          echo "  MISSING $f.yaml"
        fi
      done
      echo "SCENARIO_FILES=$COUNT"
      [ "$COUNT" -ge 22 ]
    expected:
      exit_code: 0
      stdout_contains:
        - "SCENARIO_FILES=22"
      stdout_not_contains:
        - "MISSING"

  # -------------------------------------------------------------------------
  # Step 2: Count total steps across all scenarios
  # -------------------------------------------------------------------------
  - name: "Aggregate total step count across all scenario files"
    tool: bash
    command: |
      DIR="${SCENARIOS_DIR}"
      TOTAL_STEPS=0
      for f in "$DIR"/*.yaml; do
        SCOUNT=$(grep -c '^  - name:' "$f" 2>/dev/null || echo 0)
        echo "  $(basename "$f"): $SCOUNT steps"
        TOTAL_STEPS=$((TOTAL_STEPS + SCOUNT))
      done
      echo "TOTAL_STEPS=$TOTAL_STEPS"
      [ "$TOTAL_STEPS" -ge 50 ]
    expected:
      exit_code: 0
      stdout_contains:
        - "TOTAL_STEPS="
      stdout_not_contains:
        - "Traceback"

  # -------------------------------------------------------------------------
  # Step 3: Verify production gap checklist — key infrastructure present
  # -------------------------------------------------------------------------
  - name: "Production gap checklist — key infrastructure verified"
    tool: bash
    command: |
      PROJECT_ROOT="/mnt/d/贯维/AutoInfo"
      python3 -c "import autoinfo.mcp.server" 2>/dev/null && echo "MCP_SERVER_OK"
      python3 -c "from autoinfo.kb import KBStore" 2>/dev/null && echo "KBSTORE_OK"
      python3 -c "from autoinfo.output import generate_digest" 2>/dev/null && echo "OUTPUT_OK"
      python3 -c "from autoinfo.quality import run_quality_gates" 2>/dev/null && echo "QUALITY_OK"
      python3 -c "from autoinfo.delivery import SMTPDeliveryChannel" 2>/dev/null && echo "DELIVERY_OK"
      python3 -c "from autoinfo.user_store import get_profile" 2>/dev/null && echo "USER_STORE_OK"
      python3 -c "from autoinfo.billing import check_access" 2>/dev/null && echo "BILLING_OK"
      python3 -c "from autoinfo.audit import query_audit_log" 2>/dev/null && echo "AUDIT_OK"
      TEST_COUNT=$(python3 -m pytest --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
      echo "TEST_COUNT=${TEST_COUNT:-?}"
      [ -f "${PROJECT_ROOT}/docs/autoinfo-validation-master-plan/README.md" ] && echo "DOCS_OK"
    expected:
      exit_code: 0
      stdout_contains:
        - "MCP_SERVER_OK"
        - "KBSTORE_OK"
        - "OUTPUT_OK"
        - "QUALITY_OK"
        - "DELIVERY_OK"
        - "USER_STORE_OK"
        - "BILLING_OK"
        - "AUDIT_OK"
        - "DOCS_OK"

  # -------------------------------------------------------------------------
  # Step 4: Verify deployment scripts and Makefile targets
  # -------------------------------------------------------------------------
  - name: "Deployment infrastructure — Makefile and backup scripts"
    tool: bash
    command: |
      PROJECT_ROOT="/mnt/d/贯维/AutoInfo"
      [ -f "${PROJECT_ROOT}/Makefile" ] && echo "MAKEFILE_OK"
      grep -q "test:" "${PROJECT_ROOT}/Makefile" 2>/dev/null && echo "TARGET_TEST_OK"
      grep -q "backup:" "${PROJECT_ROOT}/Makefile" 2>/dev/null && echo "TARGET_BACKUP_OK"
      grep -q "lint:" "${PROJECT_ROOT}/Makefile" 2>/dev/null && echo "TARGET_LINT_OK"
      [ -f "${PROJECT_ROOT}/scripts/backup-db.sh" ] && echo "BACKUP_SCRIPT_OK"
      [ -f "${PROJECT_ROOT}/scripts/restore-db.sh" ] && echo "RESTORE_SCRIPT_OK"
      [ -f "${PROJECT_ROOT}/pyproject.toml" ] && echo "PYPROJECT_OK"
    expected:
      exit_code: 0
      stdout_contains:
        - "MAKEFILE_OK"
        - "TARGET_TEST_OK"
        - "TARGET_BACKUP_OK"
        - "BACKUP_SCRIPT_OK"
        - "RESTORE_SCRIPT_OK"
        - "PYPROJECT_OK"

  # -------------------------------------------------------------------------
  # Step 5: Overall sign-off criteria evaluation
  # -------------------------------------------------------------------------
  - name: "Sign-off criteria — CI Gate evaluation"
    tool: bash
    command: |
      TEST_COLLECT_OUT=$(cd /mnt/d/贯维/AutoInfo && python3 -m pytest --collect-only -q 2>&1 | tail -1)
      echo "TEST_COLLECTION=$TEST_COLLECT_OUT"
      python3 -c "import autoinfo" 2>/dev/null && echo "AUTOINFO_IMPORT_OK"
      SCN_COUNT=$(ls /mnt/d/贯维/AutoInfo/docs/autoinfo-validation-master-plan/scenarios/*.yaml 2>/dev/null | wc -l)
      echo "SCENARIO_FILE_COUNT=$SCN_COUNT"
      cd /tmp && rm -rf /tmp/sign-off-test && mkdir /tmp/sign-off-test && cd /tmp/sign-off-test
      autoinfo init --demo medical-research 2>&1 > /dev/null && echo "INIT_WORKS"
    expected:
      exit_code: 0
      stdout_contains:
        - "AUTOINFO_IMPORT_OK"
        - "INIT_WORKS"
      stdout_not_contains:
        - "Traceback"
