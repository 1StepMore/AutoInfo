# Error boundary — verify graceful error handling for unknown tools,
# nonexistent domains, and missing entries.
#
# Every error step asserts the canonical error envelope from
# src/autoinfo/mcp/errors.py: ``{success: false, error: {code, message,
# actionable}}``.  ``error_code`` pins the code; ``error_actionable``
# (issue #141) additionally verifies the ``actionable`` boolean field is
# present on the error envelope — the hint agents use to remediate.
name: error-boundary
description: "Error boundary testing for unknown tools and nonexistent resources"
category: errors
requires_env: []
steps:
  - name: "unknown tool returns UnknownTool"
    tool: definitely_not_a_real_tool
    arguments: {}
    expect:
      success: false
      error_code: "UnknownTool"
      error_actionable: false

  - name: "nonexistent domain schema returns DomainNotFound"
    tool: get_domain_schema
    arguments:
      domain: nonexistent-domain-xyz
    expect:
      success: false
      error_code: "DomainNotFound"
      error_actionable: true

  - name: "nonexistent kb entry returns NotFound"
    tool: get_kb_entry
    arguments:
      entry_id: nonexistent
    expect:
      success: false
      error_code: "NotFound"
      error_actionable: true
